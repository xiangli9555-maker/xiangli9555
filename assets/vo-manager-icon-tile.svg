<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="glow2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0FF796"/>
      <stop offset="100%" stop-color="#00D470"/>
    </linearGradient>
  </defs>
  <!-- 深色瓦片（侧栏/页头用） -->
