  <!-- 描边三角 -->
  <polygon points="24,6 42,40 6,40"
           fill="none"
           stroke="url(#glow2)"
           stroke-width="2.8"
           stroke-linejoin="round"/>
  <!-- 声波条 -->
  <rect x="18" y="23" width="4" height="11" rx="2" fill="#0FF796" opacity=".55"/>
  <rect x="25" y="17" width="4" height="17" rx="2" fill="#0FF796"/>
  <rect x="32" y="25" width="4" height="9"  rx="2" fill="#0FF796" opacity=".55"/>
