<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0FF796"/>
      <stop offset="100%" stop-color="#00D470"/>
    </linearGradient>
  </defs>
  <!-- 描边三角（与品牌实心三角同轮廓基因） -->
