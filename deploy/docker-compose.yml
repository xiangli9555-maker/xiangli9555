services:
  mysql:
    image: mysql:8.0
    container_name: vo-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-vo_manager_pwd_2026}
      MYSQL_DATABASE: vo_manager
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-vo_manager_pwd_2026}"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: vo-backend
    restart: always
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-vo_manager_pwd_2026}
      DB_NAME: vo_manager
      PORT: 3001
      AUDIO_DIR: /data/audio
      DFAI_TOKEN: ${DFAI_TOKEN:-}
      TZ: Asia/Shanghai
    volumes:
      - audio_data:/data/audio
      # 让 refresh 直接读前端实时快照（与 vo-nginx 同源），避免每次重建 backend 后需手动 docker cp /app/tapd-snapshot.js
      - ./frontend/assets/tapd-snapshot.js:/app/tapd-snapshot.js:ro
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "3001"

  nginx:
    image: nginx:alpine
    container_name: vo-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  mysql_data:
  audio_data:
