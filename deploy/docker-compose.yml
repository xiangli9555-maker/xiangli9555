services:
  mysql:
    image: mysql:8.0
    container_name: vo-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-vo_manager}
      MYSQL_USER: ${DB_USER:-vo_manager}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: vo-backend
    restart: always
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-vo_manager}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-vo_manager}
      PORT: 3001
      AUDIO_DIR: /data/audio
      API_TOKENS_JSON: ${API_TOKENS_JSON:?set API_TOKENS_JSON in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # 编辑口令：站点默认只读，只有输入正确口令才解锁写权限（留空则用内置默认口令）
      VOMI_OWNER_KEY: ${VOMI_OWNER_KEY:-}
      VOMI_SESSION_SECRET: ${VOMI_SESSION_SECRET:-}
      # 权限名单（企微账号 → 职能组 copy 文案 / audio 音频）。留空则用 security.js 内置名单。
      # 覆盖格式：[{"account":"xxx","name":"张三","group":"audio","title":"pm|member","role":"admin|editor"}]
      VOMI_USERS_JSON: ${VOMI_USERS_JSON:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-180}
      MAX_AUDIO_BYTES: ${MAX_AUDIO_BYTES:-104857600}
      MAX_STORAGE_BYTES: ${MAX_STORAGE_BYTES:-10737418240}
      DFAI_API_TOKEN: ${DFAI_API_TOKEN:-}
      DEMAND_JOBS_FILE: /app/demand_jobs.json
      TENCENT_DOCS_MCP_TOKEN_FILE: /app/tencent_docs_token
      TENCENT_DOCS_OA_MCP_TOKEN_FILE: /app/tencent_docs_oa_token
      HOLIDAY_CALENDAR_PATH: /app/holiday-calendar.js
      WECOM_CORPID: ${WECOM_CORPID:-}
      WECOM_CORPSECRET: ${WECOM_CORPSECRET:-}
      # 档期实时刷新（POST /api/schedule-from-sheet/refresh）所需
      WECOM_CLI_PATH: /usr/local/bin/wecom-cli
      WECOM_HOME: /home/node
      SCHEDULE_PULL_SCRIPT: /app/tools/pull_schedule_from_sheet.py
      # 台词库总表「录入覆盖度」（GET /api/library-coverage、POST /refresh）
      LIBRARY_COVERAGE_PULL_SCRIPT: /app/tools/pull_library_coverage.py
      TZ: Asia/Shanghai
    volumes:
      - audio_data:/data/audio
      # 企微 CLI 二进制 + 机器人凭证：宿主机持久化、只读挂载，永不入 Git/镜像
      - /root/.wecom/wecom-cli:/usr/local/bin/wecom-cli:ro
      - /root/.config/wecom/credentials.enc:/home/node/.config/wecom/credentials.enc:ro
      - /root/.config/wecom/.encryption_key:/home/node/.config/wecom/.encryption_key:ro
      # 让 refresh 直接读前端实时快照（与 vo-nginx 同源），避免每次重建 backend 后需手动 docker cp /app/tapd-snapshot.js
      - ./frontend/assets/tapd-snapshot.js:/app/tapd-snapshot.js:ro
      - ./frontend/assets/holiday-calendar.js:/app/holiday-calendar.js:ro
      - ./frontend/data/release-plans.json:/app/data/release-plans.json:ro
      # 任务状态与腾讯文档凭证由宿主机持久化；容器重建不丢，secrets 永不入 Git/镜像。
      - ./backend/runtime/demand_jobs.json:/app/demand_jobs.json
      - ./secrets/tencent_docs_token:/app/tencent_docs_token:ro
      - ./secrets/tencent_docs_oa_token:/app/tencent_docs_oa_token:ro
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "3001"

  nginx:
    image: nginx:alpine
    container_name: vo-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # TLS 证书（宿主机路径可改；certbot 默认 /etc/letsencrypt/live/<domain>）
      - ${CERT_DIR:-./certs}:/etc/nginx/certs:ro
      # certbot 验证目录
      - certbot_challenge:/var/www/certbot:ro
    depends_on:
      - backend

volumes:
  mysql_data:
  audio_data:
  certbot_challenge:
