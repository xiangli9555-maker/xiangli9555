<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vomi · DAW 工作台 · 操作指引</title>
<style>
:root{--bg:#0b1c17;--panel:rgba(20,51,41,.94);--line:rgba(169,206,184,.18);--green:#0ff796;--text:#eff6f1;--muted:#adc5b8;--side-w:190px;--lane-inset:24px;font-family:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC",sans-serif;font-synthesis:none;font-variant-numeric:tabular-nums}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{width:100%;height:100%;margin:0}
body{background:#060f0b;color:var(--text);height:100dvh;display:flex;align-items:center;justify-content:center;padding:0}
.canvas-stage{position:relative;flex:none}
/* 1520设计宽度聚焦四轨内容；高度自然收口，不缩小任务字号、不裁内容。 */
.wrap{width:1520px;height:auto;flex:none;background:var(--bg);border:1px solid rgba(169,206,184,.22);border-radius:14px;padding:24px 32px 22px;display:flex;flex-direction:column;position:relative}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.logo{font-size:26px;line-height:32px;font-weight:800;color:var(--green);letter-spacing:2px}
.hero{margin-bottom:18px}
h1{font-size:32px;line-height:40px;font-weight:700;margin:2px 0 6px;letter-spacing:0}
.slogan{color:var(--muted);opacity:.78;font-size:12px;line-height:18px;letter-spacing:2.4px}
/* 右上角关闭：与段落小字同色系的低调灰，不抢主内容。 */
.top-close{position:absolute;top:14px;right:16px;z-index:5;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(141,154,147,.32);border-radius:8px;background:transparent;color:#8d9a93;transition:color .18s,border-color .18s,background-color .18s}
.top-close:hover{color:#b8c5be;border-color:rgba(141,154,147,.62);background:rgba(141,154,147,.1)}
.top-close svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}

/* ========== 原版四轨 · 卡带表头 ========== */
.tape-win{position:relative;border-radius:7px;background:#08150f;border:1px solid rgba(169,206,184,.14);display:flex;align-items:center;justify-content:center;gap:16px;overflow:hidden}
.tape-label{position:absolute;top:3px;left:8px;font-family:Consolas,"Courier New",monospace;font-size:8px;letter-spacing:1.5px;color:var(--muted);opacity:.7}
.reel{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--rc);position:relative;flex:none}
.reel::after{content:'';position:absolute;inset:5px;border-radius:50%;border:2px dashed rgba(255,255,255,.25)}
@keyframes spin{to{transform:rotate(360deg)}}
.t-dot{width:9px;height:9px;border-radius:50%;flex:none}

/* ========== 直接显示 · DAW 工作台 ========== */
.daw{border:1px solid var(--line);border-radius:12px;background:#0e211a;overflow:hidden}

.daw-scroll{width:100%;overflow:visible}
.daw-inner{position:relative;width:100%;min-width:0}
.daw-row{display:flex;border-bottom:1px solid rgba(169,206,184,.1)}
.daw-row:last-child{border-bottom:none}
.daw-side{position:relative;width:var(--side-w);flex:0 0 var(--side-w);padding:10px 12px;border-right:1px solid var(--line);background:rgba(0,0,0,.16);display:flex;align-items:center}

/* ========== 轨道表头 · 点唱机卡带 ========== */
.tape-card{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px 10px;background:#0d261e;transition:border-color .3s}
.daw-row.trk:hover .tape-card{border-color:rgba(169,206,184,.45)}
.tape-card .tape-win{height:44px;margin-bottom:8px}
.sc-top{display:flex;align-items:center;gap:7px}
.t-name{font-size:15px;line-height:22px;font-weight:600;white-space:nowrap}
/* 只保留磁带窗和角色名，四轨说明/徽章/标语/计数不渲染。 */
/* 段落、节点、任务共享左右留白，起点不再挤在卡带分隔线上。 */
.daw-lane{position:relative;flex:1;min-width:0;margin-inline:var(--lane-inset)}
.daw-lane.ruler{height:46px;background:rgba(0,0,0,.10)}
/* TIMELINE 归属段落行左栏：绝对定位，纵向中心正好压在 top:26px 那条虚线刻度线上。
   节点行左栏随之留空，不再出现「空一格 + 孤零零一个标签」的断层。 */
.axis-side{position:absolute;left:12px;top:26px;transform:translateY(-50%);font-family:Consolas,"Courier New",monospace;font-size:9.5px;line-height:11px;color:var(--muted);letter-spacing:1.5px;white-space:nowrap}
/* 独立音乐段落行：横向虚线 + 与下一行节点共用坐标的竖向引线。 */
.song-row{border-bottom:none;background:rgba(0,0,0,.12)}
.song-lane{height:56px;position:relative;overflow:visible}
.song-lane::before{content:'';position:absolute;left:0;right:0;top:26px;border-top:1px dashed rgba(169,206,184,.32)}
.song-anchor{position:absolute;top:0;height:56px;width:0}
/* 音乐段落只是注解层：统一小号灰字，不做强调配色。 */
.song-label{position:absolute;top:18px;left:0;transform:translateX(-50%);font-size:11px;font-weight:500;line-height:16px;color:#8d9a93;background:#0c1f17;padding:0 7px;white-space:nowrap;letter-spacing:0}
.song-anchor::after{content:'';position:absolute;left:0;top:42px;height:22px;border-left:1px dashed rgba(169,206,184,.45);pointer-events:none;z-index:2}
.song-anchor.zero .song-label{transform:none;padding-left:0}
.song-anchor.last .song-label{transform:translateX(-100%);padding-right:0}
.song-anchor.last::after{left:auto;right:0}
.rmark{position:absolute;top:0;transform:translateX(-50%);font-size:13px;line-height:20px;color:var(--green);padding-top:14px;white-space:nowrap;transition:color .3s;text-align:center;letter-spacing:0;font-weight:600}
.rmark.zero{transform:none;text-align:left}
.rmark.last{transform:translateX(-100%);text-align:right}
.rmark::after{content:'';position:absolute;left:50%;top:0;width:1px;height:9px;background:var(--green);transition:.3s}
.rmark.zero::after{left:0}
.rmark.last::after{left:auto;right:0}
.rmark.hit::after{height:11px;box-shadow:0 0 6px rgba(15,247,150,.6)}

.clip{position:absolute;z-index:2;height:34px;border-radius:5px;display:flex;align-items:center;gap:8px;padding:0 11px;font-size:13px;line-height:20px;font-weight:600;white-space:nowrap;border:1px solid;cursor:pointer;transition:filter .18s,background-color .18s;min-width:170px;text-align:left;letter-spacing:0}
.clip:hover{filter:brightness(1.2)}
.clip:active{filter:brightness(1.35)}
.clip-writer{background:rgba(90,138,170,.16);border-color:rgba(90,138,170,.55);color:#aecbe3}
.clip-audio{background:rgba(217,178,65,.10);border-color:rgba(217,178,65,.45);color:#D9B241}
.clip-writerpm{background:rgba(214,153,190,.14);border-color:rgba(214,153,190,.5);color:#eec3da}
.clip-audiopm{background:rgba(140,190,160,.10);border-color:rgba(140,175,155,.4);color:#C6D8CA}

.sys-tag{font-size:10px;line-height:16px;padding:1px 6px;border-radius:3px;font-weight:700;letter-spacing:0;flex:none}
.sys-tag.vomi{background:var(--green);color:#06251a}
.sys-tag.sheet{background:transparent;border:1px solid rgba(15,247,150,.5);color:var(--green)}
.sys-tag.off{background:rgba(255,255,255,.16);color:var(--text)}


.daw-foot{display:flex;gap:10px;padding:9px 18px;border-top:1px solid var(--line);background:rgba(0,0,0,.24);font-size:11.5px;color:var(--muted);flex-wrap:wrap;align-items:center}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border:1px dashed rgba(169,206,184,.25);border-radius:16px;font-size:11px}

/* ========== 详情弹窗 ========== */
dialog{position:fixed;inset:auto;left:50%;top:50%;margin:0;width:570px;max-width:none;max-height:none;padding:0;color:var(--text);background:#133127;border:1px solid rgba(142,200,163,.4);border-radius:12px;overflow:visible;transform:translate(-50%,-50%) scale(var(--detail-scale,1));transform-origin:center}
dialog::backdrop{background:rgba(0,12,7,.78)}
.dialog-head{padding:28px 28px 18px;display:flex;justify-content:space-between;gap:16px}
.eyebrow{font-size:11px;color:var(--green);font-weight:600;margin-bottom:10px}
.dialog-head h2{font-size:23px;line-height:1.5;font-weight:650}
.close{display:flex;justify-content:center;align-items:center;flex:none;width:36px;height:36px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--muted)}
.close:hover{color:var(--green);border-color:var(--green)}
.close svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round}
.dialog-body{padding:0 28px 28px}
.dialog-meta{display:grid;grid-template-columns:44px minmax(0,1fr);gap:9px 12px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px;line-height:1.8}
.dialog-meta dt{color:var(--muted)}.dialog-meta dd{margin:0}
.step-list{padding:0;margin:22px 0;list-style:none;counter-reset:steps}
.step-list li{counter-increment:steps;display:flex;gap:13px;margin:14px 0;font-size:14px;line-height:1.9}
.step-list li:before{content:counter(steps);color:var(--green);font-size:12px;line-height:26px;flex:none;width:16px}
.detail-note{font-size:12px;line-height:1.8;color:var(--muted);border-left:2px solid var(--green);padding-left:12px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* 播放时全页唯一动态 = 四轨背后的 Vomi 水印呼吸；事项不再逐个弹跳、谱号固定在起点不移动。 */
.clip{translate:0 0;transition:filter .18s,background-color .18s,border-color .18s}
/* 段落小字保持统一灰（不再随播放变绿）；高亮只留给节点行。 */
.rmark.stage-current{color:#0ff796}
.clef-marker{position:absolute;left:0;top:0;width:24px;height:40px;display:flex;align-items:center;justify-content:center;border:0;border-radius:4px;padding:0;background:transparent;z-index:6;will-change:transform;touch-action:manipulation}
.clef-marker img{width:14px;height:38px;object-fit:contain;pointer-events:none;user-select:none}
.clef-marker:focus-visible{outline:1px solid var(--green);outline-offset:1px}
/* Vomi 水印：沿用网站表头的品牌锁形（assets/vomi-mark.svg），压在四轨背后居中，随事项起拍。 */
/* 水印改成「从左向右填充式」：整轮播放走到哪，水印就亮到哪；底纹始终极淡，只作背景暗示。 */
.vomi-wm{position:absolute;left:0;top:0;z-index:0;pointer-events:none;user-select:none;display:grid;place-items:center;color:#0ff796}
.vomi-wm svg{grid-area:1/1;display:block;width:100%;height:100%}
.vomi-wm svg .wm-wave{stroke:currentColor}
.vomi-wm svg .wm-word{fill:currentColor}
/* 底纹：整枚水印的完整轮廓，压到几乎看不见。 */
.vomi-wm .wm-base{opacity:.03}
/* 填充层：按整轮进度从左向右裁开，亮度仍压在「不影响看文字」的范围内。 */
.vomi-wm .wm-fill{opacity:.08;clip-path:inset(0 calc(100% - var(--wm-fill,0) * 100%) 0 0);will-change:clip-path}
@media(prefers-reduced-motion:reduce){.clef-marker{will-change:auto}.vomi-wm .wm-fill{will-change:auto}}

</style>
</head>
<body>
<div class="canvas-stage" id="canvasStage">
<main class="wrap">
<button type="button" class="top-close" id="closeGuide" aria-label="关闭指引"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
<div class="hero">
<div class="logo">Vomi</div>
<h1>一人一声部，一曲一版本</h1>
<div class="slogan">EVERY VOICE IN LINE · EVERY SONG ON TIME</div>
</div>

<!-- 按截图直接显示四轨，不经过视角选择页 -->
<section id="daw" aria-label="四轨协作时间轴">
  <div class="daw" id="dawBox">
    <div class="daw-scroll">

 checkScript:{owner:'audio',stage:'script',start:62.5,tag:'sheet',title:'检验台词库表格',place:'版本台词库 › 本版需求的台词区域',when:'台词锁时',steps:['收齐本版本在线台词表，检查需求、角色与中英台词是否完整。','核对实际句数与预估差异，缺失或疑问反馈文案与文案 PM。'],note:'验收实际台词内容，不以单据状态代替台词表验收。'},
 schedule:{owner:'audio',stage:'schedule',start:75,tag:'sheet',title:'回填录制档期',place:'版本台词库 › 3.录制档期',when:'台词锁后 1 周内',steps:['打开对应版本台词库的「3.录制档期」。','回填已确认的声优、日期和时间，核对本版本场次齐全。'],note:'按表格现有字段登记；表格是档期真源，Vomi 档期页只读。'},
 /* 录制Ing 起，音频同学与文案一起线下监棚：同一件事，两条轨各一张卡。 */
 monitor:{owner:'audio',withRole:'文案',stage:'schedule',start:75,tag:'off',title:'OFF 监棚',place:'录制棚 / 线下协作',when:'录制Ing 起',steps:['按已确认的录制档期进棚，与文案一起跟录。','现场核对台词读法、情绪与表现，问题当场记下来。'],note:'音频同学与文案一起线下监棚；录制中的临时调整先记录，事后统一回填台词表。'},
 assign:{owner:'writer-pm',stage:'assign',start:0,tag:'off',title:'分配文案TAPD选角&台词单',place:'TAPD / 关联「台词-中」单 › 处理人',when:'需求锁后',steps:['梳理本版本需求及关联的「台词-中」单。','将每条单据分发给负责文案，确认处理人。'],note:'单据流转在 TAPD 完成；本指引不会代为分发或同步 ND。'},
 animation:{owner:'audio-pm',stage:'talent',start:37.5,tag:'off',title:'找演绎确认视频时间',place:'Vomi 音画同步信息 → 对应演绎同学',when:'声优锁后',steps:['读取需求汇总里已填写的音画同步信息。','找对应演绎同学确认动画何时完成，将时间同步给负责预约的音频同学。'],note:'音频 PM 负责协调动画时间；预约和档期回填由音频同学执行。'}
};
const PERSONAL={writer:['upload','estimate','sync','final','monitor'],audio:['castingStore','reserve','checkScript','schedule','monitor'],'writer-pm':['assign'],'audio-pm':['animation']};
const OWNER_NAME=Object.fromEntries(ROLES.map(r=>[r.key,r.name]));
const $=id=>document.getElementById(id);

/* ============ 两行共享同一坐标，段落不会替换节点 ============ */
const edgeClass=m=>m.pct===0?' zero':m.pct===100?' last':'';
function renderRuler(){
  $('songSections').innerHTML=MILES.map(m=>`<div class="song-anchor${edgeClass(m)}" data-mile="${m.id}" style="left:${m.pct}%"><span class="song-label">${m.section}</span></div>`).join('');
  $('ruler').innerHTML=MILES.map(m=>`<div class="rmark act${edgeClass(m)}" data-mile="${m.id}" style="left:${m.pct}%">${m.label}</div>`).join('');
}
function renderTracks(){
  let html='';
  ROLES.forEach((r,ri)=>{
    const ids=PERSONAL[r.key];
    /* 同节点任务纵向堆叠；不同节点共用子行，保持时间位置且压低整轨。 */
    const slots=new Map();
    const placements=ids.map(id=>{const t=TASKS[id],slot=slots.get(t.start)||0;slots.set(t.start,slot+1);return {id,t,slot};});
    const height=Math.max(TRACK_LAYOUT.minHeight,Math.max(...slots.values())*TRACK_LAYOUT.pitch+TRACK_LAYOUT.inset*2);
    html+=`<div class="daw-row trk" data-t="${r.key}" style="--rc:${r.color}">
      <div class="daw-side"><div class="tape-card">
        <div class="tape-win"><span class="tape-label">TRACK 0${ri+1}</span><div class="reel"></div><div class="reel"></div></div>
        <div class="sc-top"><span class="t-dot" style="background:${r.color}"></span><span class="t-name">${r.name}</span></div>
      </div></div>
      <div class="daw-lane track" data-lane="${r.key}" style="height:${height}px">`;
    placements.forEach(({id,t,slot})=>{
      const trans=t.start===0?'':'transform:translateX(-50%);';
      html+=`<button type="button" class="clip ${r.cls}" data-task="${id}" data-start="${t.start}" style="left:${t.start}%;top:${slot*TRACK_LAYOUT.pitch+TRACK_LAYOUT.inset}px;${trans}" aria-label="${r.name} · ${t.title}，查看步骤"><span class="sys-tag ${t.tag}">${TAG_TEXT[t.tag]}</span>${t.title.replace(/&/g,'&amp;')}</button>`;
    });
    html+='</div></div>';
  });
  $('tracks').innerHTML=html;
  $('tracks').querySelectorAll('.clip').forEach(b=>b.addEventListener('click',()=>openDetail(b.dataset.task,b)));
}

/* ============ 播放：整轮约 10 秒，全页唯一动态是四轨背后的水印呼吸 ============ */
const QUEUE=['assign','upload','estimate','sync','animation','castingStore','reserve','final','checkScript','schedule','monitor'];
const PLAYBACK_RATE=2,BASE_STEP_MS=1580,BASE_OUTRO_MS=2600;   /* 11×790ms + 尾奏 1300ms ≈ 10.0s */
/* 水印填充按「整轮总进度」走（不是每事项一次呼吸）：从 0 单调涨到 1，暂停时停在当前位置。 */
const WM_TOTAL=QUEUE.length*BASE_STEP_MS+BASE_OUTRO_MS;
const wmProgress=()=>Math.min(1,(index*BASE_STEP_MS+Math.min(elapsed,duration()))/WM_TOTAL);
const REDUCED=window.matchMedia('(prefers-reduced-motion: reduce)');
let index=0,previousIndex=-1,elapsed=0,playing=false,finished=false,lastTime=0,raf=0,closed=false;
const clips=()=>Array.from(document.querySelectorAll('.clip'));
const taskAt=n=>TASKS[QUEUE[n]];
const ownerAt=n=>taskAt(n)?.owner||'audio';
const stageAt=n=>taskAt(n)?.stage||'outro';
const duration=()=>index===QUEUE.length?BASE_OUTRO_MS:BASE_STEP_MS;
function setPlaybackState(){
  const box=$('dawBox'),clef=$('clefMarker');
  if(closed||!box||!clef)return;   /* 关闭后页面已移除，避免异步回调再取节点 */
  box.classList.toggle('running',playing);
  clef.setAttribute('aria-label',finished?'重播':playing?'暂停':'播放');
  clef.setAttribute('aria-pressed',String(!playing));
}
function markerPoint(n){
  const container=$('dawInner'),bounds=container.getBoundingClientRect(),zoom=bounds.width/container.offsetWidth;
  if(n===QUEUE.length){
    const lane=document.querySelector('[data-lane="audio"]'),r=lane.getBoundingClientRect();
    return {x:(r.right-bounds.left)/zoom-24,y:(r.top-bounds.top)/zoom+lane.offsetHeight/2-20};
  }
  const cl=document.querySelector(`[data-task="${QUEUE[n]}"]`);
  if(!cl)return null;
  const lane=cl.parentElement,r=lane.getBoundingClientRect();
  const left=lane.clientWidth*Number(cl.dataset.start)/100-(Number(cl.dataset.start)===0?0:cl.offsetWidth/2);
  return {x:(r.left-bounds.left)/zoom+left+cl.offsetWidth+4,y:(r.top-bounds.top)/zoom+parseFloat(cl.style.top)+(cl.offsetHeight-40)/2};
}
/* 谱号只做播放/暂停按钮，钉在起点不动；不再随事项跳动。 */
function positionMarker(){
  const to=markerPoint(0);if(!to)return;
  $('clefMarker').style.transform=`translate(${to.x}px,${to.y}px)`;
}
/* 全页唯一动态：水印按整轮进度从左向右填充。 */
function renderFrame(){
  const box=$('dawBox');if(closed||!box)return;
  box.style.setProperty('--wm-fill',wmProgress().toFixed(4));
}
function renderCurrent(){
  if(closed)return;
  clips().forEach(c=>c.setAttribute('aria-current',c.dataset.task===QUEUE[index]?'step':'false'));
  document.querySelectorAll('[data-mile]').forEach(n=>n.classList.toggle('stage-current',n.dataset.mile===stageAt(index)));
  // 只复用已有业务文字，不添加可见状态句或第15项任务。
  $('announcement').textContent=taskAt(index)?OWNER_NAME[ownerAt(index)]+'，'+taskAt(index).title:MILE_LABELS.outro;
  setPlaybackState();positionMarker();
}
/* 暂停不再把水印抹掉：填充位置就是进度，停在哪亮到哪。 */
function pause(){
  playing=false;cancelAnimationFrame(raf);setPlaybackState();
}
function play(){
  if(closed||$('task-detail').open)return;
  if(finished){index=0;previousIndex=-1;elapsed=0;finished=false;renderCurrent();renderFrame();}
  if(playing)return;
  playing=true;lastTime=performance.now();setPlaybackState();raf=requestAnimationFrame(tick);
}
function tick(now){
  if(!playing)return;
  // 从浏览器后台返回时不跨项快进；隐藏时另行暂停。
  elapsed+=Math.min(100,Math.max(0,now-lastTime))*PLAYBACK_RATE;lastTime=now;
  if(elapsed>=duration()){
    if(index===QUEUE.length){elapsed=duration();finished=true;pause();renderFrame();return;}
    elapsed-=duration();previousIndex=index;index++;renderCurrent();
  }
  renderFrame();raf=requestAnimationFrame(tick);
}
$('clefMarker').addEventListener('click',()=>playing?pause():play());
/* 右上角关闭：先停播放，再整页淡出移除（刷新才会回来）。 */
$('closeGuide').addEventListener('click',()=>{
  closed=true;pause();
  const stage=$('canvasStage');
  stage.style.transition='opacity .26s ease';
  stage.style.opacity='0';
  setTimeout(()=>stage.remove(),280);
  /* 被嵌进 Vomi 登录后的指引层时，通知父页收层并记「已看过」；独立打开无影响。 */
  if (window.parent && window.parent !== window) { try { window.parent.postMessage('vomi-guide-close','*'); } catch(_){} }
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
REDUCED.addEventListener('change',()=>{if(REDUCED.matches)pause();renderFrame();});
window.__dawMotion={getState:()=>({mode:'c',rate:PLAYBACK_RATE,index,elapsed,playing,finished,task:QUEUE[index]||null,owner:ownerAt(index),stage:stageAt(index)}),queue:QUEUE.map(id=>({id,owner:TASKS[id].owner,stage:TASKS[id].stage}))};

/* ============ 详情弹窗 ============ */
function openDetail(id,button){
  pause();
  const t=TASKS[id];
  window.__returnFocus=button;
  $('detail-role').textContent=(t.withRole?OWNER_NAME[t.owner]+' + '+t.withRole:OWNER_NAME[t.owner])+' · '+MILE_LABELS[t.stage].split(' ')[0];
  $('detail-title').textContent=t.title;
  $('detail-place').textContent=t.place;
  $('detail-when').textContent=t.when;
  $('detail-note').textContent=t.note;
  $('detail-steps').replaceChildren(...t.steps.map(s=>{const li=document.createElement('li');li.textContent=s;return li;}));
  $('task-detail').showModal();
  fitDetail();
}
$('close-detail').addEventListener('click',()=>$('task-detail').close());
$('task-detail').addEventListener('close',()=>{const b=window.__returnFocus;window.__returnFocus=null;if(b&&b.isConnected)b.focus();});
$('task-detail').addEventListener('click',e=>{if(e.target!==$('task-detail'))return;const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();});

/* ============ 初始化 ============ */
renderRuler();renderTracks();
/* 高度随内容收口；先测完整内容，再按窗口宽高等比适配，无裁切和滚动条。 */
const FRAME_WIDTH=1520,VIEWPORT_INSET=16;
const wrapEl=document.querySelector('.wrap');
function layoutTrackClips(){
  document.querySelectorAll('.track').forEach(lane=>{
    const occupied=[];
    lane.querySelectorAll('.clip').forEach(clip=>{
      const start=Number(clip.dataset.start),width=clip.offsetWidth;
      const left=lane.clientWidth*start/100-(start===0?0:width/2),right=left+width+28;
      let slot=0;
      while(occupied[slot]?.some(box=>left<box.right+10&&right>box.left-10))slot++;
      (occupied[slot]||=[]).push({left,right});
      clip.style.top=`${slot*TRACK_LAYOUT.pitch+TRACK_LAYOUT.inset}px`;
    });
    lane.style.height=`${Math.max(TRACK_LAYOUT.minHeight,occupied.length*TRACK_LAYOUT.pitch+TRACK_LAYOUT.inset*2)}px`;
  });
}
/* ============ Vomi 水印 ============ */
/* 品牌锁形沿用网站表头 assets/vomi-mark.svg 的画法：两侧波形 + 中间「-Vomi-」字标。
   这里把画幅从 176×32 拉长到 256×40（同比例放大后再加长波形），字标保持原比例不被拉伸。 */
const WM_VB={w:256,h:40},WM_FONT=20,WM_FLAT=6,WM_STEP=3;
const WM_L=[4,89],WM_R=[167,252];
const WM_Y_L=[13,19,7,25,11,21,14,18,12,20,15,17,13,19];
const WM_Y_R=[13,18,14,20,12,18,11,21,7,25,12,19,13,17];
function wmWave([x0,x1],ys){
  const mid=WM_VB.h/2,k=WM_VB.h/32;
  let d=`M${x0} ${mid}H${x0+WM_FLAT}`,x=x0+WM_FLAT,i=0;
  while(x+WM_STEP<=x1-WM_FLAT){d+=`L${x+WM_STEP} ${(ys[i%ys.length]*k).toFixed(1)}`;x+=WM_STEP;i++;}
  return d+`H${x1}`;
}
function wmLayer(cls){
  return `<svg class="${cls}" viewBox="0 0 ${WM_VB.w} ${WM_VB.h}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" focusable="false" aria-hidden="true">`
    +`<g class="wm-wave" fill="none" stroke-width="${(1.8*WM_VB.h/32).toFixed(2)}" stroke-linecap="round" stroke-linejoin="round">`
    +`<path d="${wmWave(WM_L,WM_Y_L)}"/><path d="${wmWave(WM_R,WM_Y_R)}"/></g>`
    +`<text class="wm-word" x="${WM_VB.w/2}" y="${WM_VB.h/2+0.5}" font-family="Microsoft YaHei UI, Microsoft YaHei, Segoe UI, sans-serif" font-size="${WM_FONT}" font-weight="600" letter-spacing="0" text-anchor="middle" dominant-baseline="middle">-Vomi-</text></svg>`;
}
/* 两层同图叠加：底纹全程在，填充层被 clip-path 从左向右裁开，形成填充式进度。 */
function buildWatermark(){
  const el=document.getElementById('vomiWm');if(!el)return;
  el.innerHTML=wmLayer('wm-base')+wmLayer('wm-fill');
}
buildWatermark();
/* 水印横向居中在时间轴区域，高度约等于一条职能组轨道；按画幅比例缩放，不拉伸。 */
const WM_ASPECT=WM_VB.w/WM_VB.h;
function positionWatermark(){
  const wm=$('vomiWm'),inner=$('dawInner'),tracks=$('tracks');
  if(!wm||!tracks||!inner)return;
  const rows=[...tracks.querySelectorAll('.trk')];
  const rowH=rows.length?Math.max(...rows.map(r=>r.offsetHeight)):TRACK_LAYOUT.minHeight;
  const cs=getComputedStyle(document.documentElement);
  const sideW=parseFloat(cs.getPropertyValue('--side-w'))||190;
  const laneInset=parseFloat(cs.getPropertyValue('--lane-inset'))||24;
  const laneLeft=sideW+laneInset,laneRight=inner.offsetWidth-laneInset;
  const w=Math.round(rowH*WM_ASPECT);
  wm.style.width=`${w}px`;
  wm.style.height=`${rowH}px`;
  wm.style.left=`${Math.round(laneLeft+(laneRight-laneLeft-w)/2)}px`;
  wm.style.top=`${Math.round(tracks.offsetTop+tracks.offsetHeight/2-rowH/2)}px`;
}
function fitDetail(){
  const dialog=$('task-detail');
  if(!dialog.open)return;
  const s=Math.min(1,(document.documentElement.clientWidth-32)/dialog.offsetWidth,(document.documentElement.clientHeight-32)/dialog.offsetHeight);
  dialog.style.setProperty('--detail-scale',String(Math.max(.01,s)));
}
function fitScale(){
  if(closed)return;
  const availableWidth=Math.max(1,window.innerWidth-VIEWPORT_INSET*2);
  const availableHeight=Math.max(1,window.innerHeight-VIEWPORT_INSET*2);
  wrapEl.style.zoom='1';
  layoutTrackClips();
  positionWatermark();
  const contentHeight=wrapEl.offsetHeight;
  let s=Math.min(1,availableWidth/FRAME_WIDTH,availableHeight/contentHeight);
  wrapEl.style.zoom=String(s);
  /* 浏览器会把细边框取整到物理像素；回测实际尺寸，短窗口也不越界。 */
  for(let pass=0;pass<4;pass++){
    const actual=wrapEl.getBoundingClientRect();
    const correction=Math.min(1,availableWidth/actual.width,availableHeight/actual.height);
    if(correction>=.9999)break;
    s*=correction;
    wrapEl.style.zoom=String(s);
  }
  const bounds=wrapEl.getBoundingClientRect();
  $('canvasStage').style.width=`${bounds.width}px`;
  $('canvasStage').style.height=`${bounds.height}px`;
  fitDetail();
  positionMarker();
}
window.addEventListener('resize',fitScale);fitScale();
document.fonts.ready.then(async()=>{await $('clefMarker').querySelector('img').decode();fitScale();renderCurrent();if(!REDUCED.matches&&!document.hidden)play();});
</script>
