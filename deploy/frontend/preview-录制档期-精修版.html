// 按 (lang, role) 归组：一行 = 同一游戏角色的中配/英配之一
// 返回 [{role, lang, actor, covers:[{story,est}], total, status}, ...]
function aggregateActors(demands, release){
  const map = new Map();  // key = lang + '|' + role
  demands.forEach(dem => {
    if((dem.release_plan||'') !== release) return;
    let ves = dem.voice_estimates;
    if(typeof ves === 'string'){ try{ ves = JSON.parse(ves); }catch(_){ ves = []; } }
    if(!Array.isArray(ves)) return;
    ves.forEach(v => {
      const role  = (v.role || '').trim() || '(未指定角色)';
      const cat   = categoryOf(v) || 'NPC';
      const gender = String(v.gender || '').trim();
      const est   = parseInt(v.est_lines || v.est || 0, 10) || 0;
      const story = (dem.task_name || '').trim();
      // 中配
      const cn = (v.cn_va || '').trim();
      if(cn && cn !== 'N/A'){
        const k = 'cn|' + role;
        if(!map.has(k)) map.set(k, { role, category: cat, gender, lang: 'cn', actor: cn, covers: [], total: 0, status: 'pending' });
        const g = map.get(k);
        if(!g.gender && gender) g.gender = gender;
        if(g.actor.indexOf(cn) < 0) g.actor = g.actor ? (g.actor + ' / ' + cn) : cn;
        g.covers.push({ story, est });
        g.total += est;
      }
      // 英配
      const en = (v.en_va || '').trim();
      if(en && en !== 'N/A'){
        const k = 'en|' + role;
        if(!map.has(k)) map.set(k, { role, category: cat, gender, lang: 'en', actor: en, covers: [], total: 0, status: 'pending' });
        const g = map.get(k);
        if(!g.gender && gender) g.gender = gender;
        if(g.actor.indexOf(en) < 0) g.actor = g.actor ? (g.actor + ' / ' + en) : en;
        g.covers.push({ story, est });
        g.total += est;
      }
    });
  });
  // “已约”只认recording_schedules正式数据；未发布草稿不参与。
  // 同时为每个 (lang, role) 找一条最近档期（含 date/slot/start_time/end_time）用于左右双轨制展示
  const sched = window.PUBLISHED_SCHEDULES || [];
  const bookedRoles = new Set();
  const scheduleByKey = {};      // key = 'lang|role' -> 最近一档（保留兼容 formatScheduleLabel）
  const schedulesByKey = {};     // key = 'lang|role' -> 全量档期数组（按 date 升序）
  sched.forEach(s => {
    const lang = s.lang === '英配' ? 'en' : 'cn';
    (s.roles || []).forEach(r => bookedRoles.add(lang + '|' + r));
    if(s.role_cn) bookedRoles.add('cn|' + s.role_cn);
    if(s.role_en) bookedRoles.add('en|' + s.role_en);
    if(s.role)    bookedRoles.add(lang + '|' + s.role);
    // 归组：一个 (lang, role) 可能有多档
    const keys = [];
    if(s.role_cn) keys.push('cn|' + s.role_cn);
    if(s.role_en) keys.push('en|' + s.role_en);
    if(s.role){
      const lg = (s.lang==='英配'?'en':'cn');
      keys.push(lg + '|' + s.role);
    }
    const entry = {
      date: s.date || '',
      slot: s.slot || s.time_slot || '',
      start_time: s.start_time || '',
      end_time:   s.end_time || '',
      studio: s.studio || ''
    };
    keys.forEach(k => {
      if(!schedulesByKey[k]) schedulesByKey[k] = [];
      schedulesByKey[k].push(entry);
      // scheduleByKey 保留最近一档兼容旧调用
      const cur = scheduleByKey[k];
      if(!cur || (entry.date||'') > (cur.date||'')){
        scheduleByKey[k] = entry;
      }
    });
  });
  // 按日期升序 + 去重
  Object.keys(schedulesByKey).forEach(k => {
    const seen = new Set();
    schedulesByKey[k] = schedulesByKey[k]
      .filter(x => { const sig = x.date+'|'+x.start_time+'|'+x.end_time; if(seen.has(sig)) return false; seen.add(sig); return true; })
      .sort((a,b) => (a.date||'').localeCompare(b.date||''));
  });
  const list = [...map.values()];
  list.forEach(a => {
    const k = a.lang + '|' + a.role;
    if(bookedRoles.has(k)) a.status = 'booked';
    a.schedule = scheduleByKey[k] || null;
    a.schedules = schedulesByKey[k] || []; // ← 新增：全量档期数组
  });
  list.sort((a,b) => b.total - a.total);
  return list;
}

// 按角色视图聚合：把 (cn|role) + (en|role) 合并到同一个 role（带所属大类）
function aggregateByRole(demands, release){
  const flat = aggregateActors(demands, release);
  const map = new Map(); // key = role
  flat.forEach(a => {
    if(!map.has(a.role)){
      map.set(a.role, { role: a.role, category: a.category || '', covers: [], total: 0, cn: null, en: null, hasPending: false });
    }
    const g = map.get(a.role);
    if(!g.category && a.category) g.category = a.category;
    g.covers.push(...a.covers);
    g.total += a.total;
    if(a.lang === 'cn') g.cn = a;
    else g.en = a;
    if(a.status === 'pending') g.hasPending = true;
  });
  // 排序：未约的（任一语种）排前
  const list = [...map.values()];
  list.sort((a,b) => {
    if(a.hasPending !== b.hasPending) return a.hasPending ? -1 : 1;
    return b.total - a.total;
  });
  return list;
}

// 按需求视图聚合：1 行 = 需求 × 演员 × 语种
function aggregateByDemand(demands, release){
  const map = new Map(); // key = demandId|lang|role
  const sched = window.PUBLISHED_SCHEDULES || [];
  // 简化版：复用 aggregateActors 找 schedule
  const flat = aggregateActors(demands, release);
  demands.forEach(dem => {
    if((dem.release_plan||'') !== release) return;
    let ves = dem.voice_estimates;
    if(typeof ves === 'string'){ try{ ves = JSON.parse(ves); }catch(_){ ves = []; } }
    if(!Array.isArray(ves)) return;
    ves.forEach(v => {
      const role  = (v.role || '').trim() || '(未指定角色)';
      const est   = parseInt(v.est_lines || v.est || 0, 10) || 0;
      const story = (dem.task_name || '').trim() || ('需求 ' + dem.id);
      const area  = String(dem.area || '').trim();
      [['cn', v.cn_va], ['en', v.en_va]].forEach(([lang, actor]) => {
        const name = String(actor||'').trim();
        if(!name || name === 'N/A') return;
        const k = (dem.id||'') + '|' + lang + '|' + role;
        const found = flat.find(a => a.role === role && a.lang === lang);
        const schedInfo = found ? found.schedule : null;
        const status = found ? found.status : 'pending';
        map.set(k, {
          demandId: dem.id,
          area: area,
          story: story,
          lang: lang,
          role: role,
          actor: name,
          est: est,
          schedule: schedInfo,
          status: status
        });
      });
    });
  });
  const list = [...map.values()];
  // 排序：未约置顶 → 同需求 → 同语种
  list.sort((a,b) => {
    if((a.status==='pending') !== (b.status==='pending')) return a.status==='pending' ? -1 : 1;
    if(a.story !== b.story) return a.story < b.story ? -1 : 1;
    if(a.lang !== b.lang) return a.lang < b.lang ? -1 : 1;
    return b.est - a.est;
  });
  return list;
}

function renderActorRollup(){
  // 若 release 为空，自动用 demands 中出现次数最多的版本作为"当前版本"
  if(!ACTOR_STATE.release && ACTOR_STATE.demands && ACTOR_STATE.demands.length){
    const auto = detectCurrentReleaseFromDemands();
    if(auto) ACTOR_STATE.release = auto;
  }

  // 视图切换器显示
  document.querySelectorAll('.view-tabs [data-vmode]').forEach(b => {
    b.classList.toggle('on', b.dataset.vmode === ACTOR_STATE.vmode);
  });
  const roleView = document.getElementById('actorRoleView');
  const demandView = document.getElementById('actorDemandView');
  if(roleView)   roleView.style.display   = ACTOR_STATE.vmode === 'role'   ? '' : 'none';
  if(demandView) demandView.style.display = ACTOR_STATE.vmode === 'demand' ? '' : 'none';

  // KPI 卡：基于 aggregateActors 全量
  const all = aggregateActors(ACTOR_STATE.demands, ACTOR_STATE.release);
  // 应用筛选（按角色视图的搜索仍作用于需求视图）
  const q = (document.getElementById('actorSearch').value || '').trim().toLowerCase();
  const list = all.filter(a => {
    // lang 仅在侧栏胶囊被点击时使用，主表按 role 合并展示时不过滤单条 flat（避免误伤对侧语种的角色）
    // → 现在保留：只看某语种时，仅显示"在该语种下有应约的角色"
    if(ACTOR_STATE.lang !== 'all' && a.lang !== ACTOR_STATE.lang) return false;
    if(ACTOR_STATE.status !== 'all' && a.status !== ACTOR_STATE.status) return false;
    if(ACTOR_STATE.cat !== 'all'){
      const c = (a.category || categoryOf(a.role) || '').trim();
      if(c !== ACTOR_STATE.cat) return false;
    }
    if(ACTOR_STATE.gender !== 'all'){
      const g = String(a.gender || genderOf(a.role) || '').toLowerCase();
      if(ACTOR_STATE.gender === 'male'   && !(g==='m'||g==='male'||g==='男')) return false;
      if(ACTOR_STATE.gender === 'female' && !(g==='f'||g==='female'||g==='女')) return false;
    }
    if(q){
      const hay = (a.role + ' ' + a.covers.map(c=>c.story).join(' ')).toLowerCase();
      if(hay.indexOf(q) < 0) return false;
    }
    return true;
  });

  const cnAll = list.filter(a=>a.lang==='cn');
  const enAll = list.filter(a=>a.lang==='en');
  const cnTotal = cnAll.length, cnBooked = cnAll.filter(a=>a.status==='booked').length;
  const enTotal = enAll.length, enBooked = enAll.filter(a=>a.status==='booked').length;
  const pendingN = list.filter(a=>a.status==='pending').length;
  // 风险公告：3 个业务核心数据点（品牌黄 + 透明度）+ 1 个时间维度
  // · 未约齐演员：至少 1 语种未约的 unique 角色数
  // · 缺少档期：当前未约的 (lang, role) 行数
  // · 受影响需求：至少 1 个 voice_estimate 角色未约的需求数
  const unalignedRoles = (function(){
    const m = new Set();
    list.forEach(a => { if(a.status==='pending') m.add(a.role); });
    return m.size;
  })();
  // 未预约角色名列表（用于副标题展示）
  const pendingRoleNames = (function(){
    const names = new Set();
    list.forEach(a => { if(a.status==='pending') names.add(a.role); });
    return Array.from(names);
  })();
  // 声优视图风险预警：按 game 角色大类（category）聚合待约角色数（角色去重）
  // · 同一角色在中+英两语种都 pending 也只算 1 位
  // · 与需求视图 AREA 口径镜像：pill 显示"角色名" + 圆形数字徽章
  const catPendingStats = (function(){
    const m = new Map(); // category -> Set<role>
    list.forEach(a => {
      if(a.status !== 'pending') return;
      const c = (a.category||'').trim() || '未分类';
      if(!m.has(c)) m.set(c, new Set());
      m.get(c).add(a.role);
    });
    const cnt = {};
    m.forEach((set, c) => { cnt[c] = set.size; });
    return { cnt };
  })();
  // 按语种拆分未约数
  const cnPendingN = list.filter(a=>a.lang==='cn' && a.status==='pending').length;
  const enPendingN = list.filter(a=>a.lang==='en' && a.status==='pending').length;
  const affectedDemands = (function(){
    const m = new Set();
    const pendingRoles = new Set(list.filter(a=>a.status==='pending').map(a=>a.role));
    (ACTOR_STATE.demands||[]).forEach(d => {
      if(ACTOR_STATE.release && (d.release_plan||'') !== ACTOR_STATE.release) return;
      let ves = d.voice_estimates;
      if(typeof ves === 'string'){ try{ ves = JSON.parse(ves); }catch(_){ ves = []; } }
      if(!Array.isArray(ves)) return;
      ves.forEach(v => {
        const role = (v.role||'').trim();
        if(role && pendingRoles.has(role)) m.add(d.id || (d.task_name||''));
      });
    });
    return m.size;
  })();
  // ===== 需求视图专用：按 AREA 统计"未出完整档期"的需求数 =====
  const AREA_ORDER = ['SOL','大战场','系统','商业化','干员'];
  const areaPendingStats = (function(){
    const byDemand = aggregateByDemand(ACTOR_STATE.demands, ACTOR_STATE.release);
    // 需求维度：只要该需求有 >=1 行 pending，就算"尚未出完整档期"
    const pendMap = new Map(); // demandKey -> {area, story, pendingCount}
    byDemand.forEach(r => {
      const key = (r.demandId||'—') + '|' + (r.story||'');
      if(!pendMap.has(key)) pendMap.set(key, { area:(r.area||'未分类'), story:(r.story||''), pendingCount:0 });
      if(r.status === 'pending') pendMap.get(key).pendingCount++;
    });
    const pendDemands = [...pendMap.values()].filter(x => x.pendingCount > 0);
    // 按 AREA 计数
    const cnt = {};
    pendDemands.forEach(x => { cnt[x.area] = (cnt[x.area]||0) + 1; });
    // 待预约最多的需求名（按 pendingCount 降序，取前 3）
    const topNames = pendDemands
      .sort((a,b) => b.pendingCount - a.pendingCount)
      .slice(0,3)
      .map(x => x.story);
    return { total:pendDemands.length, cnt, topNames };
  })();
  const deliveryDate = deliveryDayOf(ACTOR_STATE.release);
  const workDaysLeft = workingDaysUntil(deliveryDate);
  let deliveryHtml = '—';
  if(deliveryDate && workDaysLeft !== null){
    if(workDaysLeft > 0)      deliveryHtml = String(workDaysLeft);
    else if(workDaysLeft === 0) deliveryHtml = '今天';
    else                      deliveryHtml = String(-workDaysLeft) + '↓';
  }
  const banner = document.getElementById('riskBanner');
  const title = document.getElementById('riskTitle');
  const sub = document.getElementById('riskSub');
  const stats = document.getElementById('riskStats');
  const areasEl = document.getElementById('riskAreas');
  const action = document.getElementById('riskAction'); // 已下线：筛选器里已有"未约"选项
  if(banner && title && sub && stats){
    if(ACTOR_STATE.vmode === 'demand'){
      // ===== 需求视图：按 AREA 口径 =====
      const ap = areaPendingStats;
      if(ap.total > 0){
        banner.classList.remove('calm');
        // 预设顺序优先，数据里出现但不在预设内的 AREA 追加在后面（避免漏统计）
        const extraAreas = Object.keys(ap.cnt).filter(a => AREA_ORDER.indexOf(a) < 0);
        const order = AREA_ORDER.concat(extraAreas).filter(a => (ap.cnt[a]||0) > 0);
        // AREA 圆框 pill（圆角矩形 = 圆框框）—— AREA 名在前，圆形数字徽章加尾后强化"标出来"
        if(areasEl){
          if(order.length){
            areasEl.innerHTML = order.map(a =>
              `<span class="risk-area-pill">${escHtmlSafe(a)}<span class="num">${ap.cnt[a]}</span></span>`
            ).join('');
            areasEl.hidden = false;
          } else {
            areasEl.innerHTML = '';
            areasEl.hidden = true;
          }
        }
        title.textContent = `风险预警 · ${ap.total} 个需求尚未出完整录制档期`;
        const nameTxt = ap.topNames.length
          ? ap.topNames.map(n => escHtmlSafe(n)).join('、')
          : '—';
        sub.innerHTML = `${nameTxt} 需要音频尽快确认预约`;
        if(action){ action.classList.remove('active'); action.textContent = '仅看未预约'; }
      } else {
        banner.classList.add('calm');
        if(areasEl){ areasEl.innerHTML = ''; areasEl.hidden = true; }
        title.textContent = '全部需求档期已出齐';
        sub.innerHTML = '当前版本所有需求的录制档期均已排期完成。';
        if(action){ action.classList.add('active'); action.textContent = '✓ 全部完成'; }
      }
    } else if(pendingN > 0){
      // ===== 声优视图：按 game 角色大类（category）口径，镜像需求视图 AREA =====
      banner.classList.remove('calm');
      const cp = catPendingStats;
      if(areasEl){
        // 预设大类顺序（与侧栏 tab 顺序一致），非预设项追加在末
        const CAT_ORDER = ['指挥官','干员','Boss','AI兵','NPC','AI系统音'];
        const extras = Object.keys(cp.cnt).filter(c => CAT_ORDER.indexOf(c) < 0);
        const order = CAT_ORDER.concat(extras).filter(c => (cp.cnt[c]||0) > 0);
        if(order.length){
          areasEl.innerHTML = order.map(c =>
            `<span class="risk-area-pill">${escHtmlSafe(c)}<span class="num">${cp.cnt[c]}</span></span>`
          ).join('');
          areasEl.hidden = false;
        } else {
          areasEl.innerHTML = '';
          areasEl.hidden = true;
        }
      }
      title.textContent = `风险预警 · ${unalignedRoles} 位声优尚未预约档期（中配 ${cnPendingN} ，英配 ${enPendingN} ）`;
      sub.innerHTML = '录制时间需要音频同学尽快确认';
      if(action){ action.classList.remove('active'); action.textContent = '仅看未预约'; }
    } else {
      banner.classList.add('calm');
      if(areasEl){ areasEl.innerHTML = ''; areasEl.hidden = true; }
      title.textContent = '全部声优档期已确认';
      sub.innerHTML = `当前版本共 ${cnTotal+enTotal} 位应约的中英配档期均已排期完成。`;
      if(action){ action.classList.add('active'); action.textContent = '✓ 全部完成'; }
    }
    stats.innerHTML = `
      <div class="risk-stat"><div class="k">受影响需求</div><div class="v ${pendingN>0?'warn':'ok'}">${affectedDemands}<span class="unit">个</span></div></div>
      <div class="risk-stat"><div class="k">距 VO 资源交付</div><div class="v">${deliveryHtml}<span class="unit">工作日</span></div></div>
    `;
  }
  // 保留旧 actorStatStrip 兼容（如有其它地方引用，避免报错）
  const oldStrip = document.getElementById('actorStatStrip');
  if(oldStrip) oldStrip.innerHTML = '';

  // 分发到两个视图
  if(ACTOR_STATE.vmode === 'role')   renderActorRoleTable(list);
  if(ACTOR_STATE.vmode === 'demand') renderActorDemandTable();
  // 主表重渲染后恢复日历 focus 的高亮（保证筛选/搜索不打断联动）
  if(typeof window.applyMidFocus === 'function'){
    try{ window.applyMidFocus(); }catch(_){}
  }

  const actorTabHintEl = document.getElementById('actorTabHint');
  if(actorTabHintEl) actorTabHintEl.textContent = pendingN ? `${pendingN} 未约` : '';
  // 同步刷新顶栏「录制档期截止」药丸（release 状态变更后）
  try{ renderScheduleDeadline(); }catch(_){}
}

// 格式化档期时间：从 schedule 渲染 "9/08 14:00-18:00" 或 fallback "9/08 上午"
function formatScheduleLabel(s){
  if(!s) return '';
  var d = s.date || '';
  var md = '';
  if(d){
    var p = d.split('-');
    if(p.length === 3) md = parseInt(p[1],10) + '/' + parseInt(p[2],10);
    else md = d;
  }
  var st = s.start_time || '';
  var et = s.end_time || '';
  if(st && et) return { date: md, time: st + '-' + et };
  if(s.slot) return { date: md, time: s.slot };
  return { date: md, time: '' };
}

// 判断某档期条目在指定日期是否有录制（日期 focus 真过滤用）
function itemHasSlotOn(item, ymd){
  if(!ymd) return true;
  if(!item) return false;
  var arr = (item.schedules && Array.isArray(item.schedules) && item.schedules.length)
    ? item.schedules
    : (item.schedule ? [item.schedule] : []);
  if(!arr.length) return false;
  return arr.some(function(s){ return s && s.date && String(s.date).slice(0,10) === ymd; });
}

    const roles = byCat.get(cat);

    const bookedCnt = roles.length - pendingCnt;

    const head = `
      <div class="ac-cat-head">
        <span class="ac-cat-idx">${idxStr}</span>
        <span class="ac-cat-name">${escHtmlSafe(cat)}</span>
        ${countHtml}
      </div>`;
    const cards = roles.map(g => {
      const initial = (g.role || '?').charAt(0);

      const langHideEn = ACTOR_STATE.lang === 'cn' ? ' ac-hidden' : '';

          </div>
        </div>`;
    }).join('');
    return head + `<div class="acard-group">${cards}</div>`;
  }).join('');
}

// 档期卡 v4 · 方案 C 横排压缩：
//   单档 → 大字完整时间「9/11 10:00-14:00」
//   多档 → 序列条「● 9/11 10-14   ● 9/22 14-17」+ 底部一行「据点攻防（+2 场）」
function renderRoleSchedCard(item, lang, focusYmd){
  let schedules = (item && Array.isArray(item.schedules) && item.schedules.length) ? item.schedules : (item && item.schedule ? [item.schedule] : []);
  const covers = item && Array.isArray(item.covers) ? item.covers : [];
  const storyNames = [...new Set(covers.map(c => (c.story||'').trim()).filter(Boolean))].slice(0,2).join(' · ');
  // 日期 focus → 仅保留该日的档期；该日无档则显示占位
  if(focusYmd){
    schedules = schedules.filter(function(s){ return s && s.date && String(s.date).slice(0,10) === focusYmd; });
    if(!schedules.length){
      return `<div class="sched-card pending muted"><span class="sc-empty">该日无录制</span></div>`;
    }
  }
  // "已过"判定：日期 < 今天（不含今天）
  const _today = new Date(); _today.setHours(0,0,0,0);
  function _isPast(s){
    const d = s && s.date ? new Date(String(s.date)) : null;
    if(!d || isNaN(d)) return false;
    d.setHours(0,0,0,0);
    return d < _today;
  }

  if(item && item.status === 'booked' && schedules.length){
    if(schedules.length === 1){
      const lab = formatScheduleLabel(schedules[0]);
      const pastCls = _isPast(schedules[0]) ? ' past' : '';
      const storyLine = storyNames ? `<span class="sc-story">${escHtml(storyNames)}</span>` : '';
      // data-ymd：供日历 / 即将录制 focus 时反向定位到主表这一格
      const ymdAttr = schedules[0] && schedules[0].date ? ` data-ymd="${escHtml(String(schedules[0].date).slice(0,10))}"` : '';
      return `<div class="sched-card booked-${lang}${pastCls}"${ymdAttr}>
        <span class="sc-time">${escHtml(lab.date||'')}${lab.time?` ${escHtml(lab.time)}`:''}</span>
        ${storyLine}
      </div>`;
    }
    // 多档 → 横排展示：完整时间 · 每档带小圆点（每档独立判定 past）
    const pills = schedules.map(s => {
      const lab = formatScheduleLabel(s);
      const timeStr = lab.time || '';
      const pastCls = _isPast(s) ? ' past' : '';
      const pillYmd = s && s.date ? ` data-ymd="${escHtml(String(s.date).slice(0,10))}"` : '';
      return `<span class="sc-pill${pastCls}"${pillYmd}><span class="sc-pill-dot"></span><span class="sc-pill-date">${escHtml(lab.date||'')}</span><span class="sc-pill-time">${escHtml(timeStr)}</span></span>`;
    }).join('');
    // 若所有档期都已过，卡片整体加 past
    const allPast = schedules.every(_isPast);
    const tail = storyNames ? `<span class="sc-story">${escHtml(storyNames)} <span class="sc-more">· 共 ${schedules.length} 场</span></span>` : `<span class="sc-story"><span class="sc-more">共 ${schedules.length} 场</span></span>`;
    return `<div class="sched-card booked-${lang} multi${allPast?' past':''}">
      <span class="sc-pills">${pills}</span>
      ${tail}
    </div>`;
  }
  const storyLine = storyNames ? `<span class="sc-story">${escHtml(storyNames)}</span>` : '';
  return `<div class="sched-card pending">
    <span class="sc-empty">待预约</span>
    ${storyLine}
  </div>`;
}

function renderSchedCell(item, lang){
  if(item && item.status === 'booked' && item.schedule){
    const lab = formatScheduleLabel(item.schedule);
    return `<div class="sched-cell"><span class="sched-pill ${lang}"><span class="date">${escHtml(lab.date||'')}</span>${lab.time?`<span class="sep">·</span><span class="time">${escHtml(lab.time)}</span>`:''}</span>${item.actor?`<span class="sched-note">演员：${escHtml(item.actor)}</span>`:''}</div>`;
  }
  if(item && item.status === 'booked'){
    return `<div class="sched-cell"><span class="sched-pill ${lang}"><span class="time">✓ 已约 · 演员 ${escHtml(item.actor||'—')}</span></span></div>`;
  }
  return `<div class="sched-cell empty"><span class="pending-tag">待预约</span></div>`;
}

function renderActorDemandTable(){
  const all = aggregateByDemand(ACTOR_STATE.demands, ACTOR_STATE.release);
  // 筛选：搜索框作用于 story/role/actor；需求视图额外按 AREA 筛
  const q = (document.getElementById('actorSearch').value || '').trim().toLowerCase();
  const focusYmd = window.MID_FOCUS_YMD || null;
  const list = all.filter(r => {
    if(ACTOR_STATE.lang !== 'all' && r.lang !== ACTOR_STATE.lang) return false;
    if(ACTOR_STATE.status !== 'all' && r.status !== ACTOR_STATE.status) return false;
    if(ACTOR_STATE.area && ACTOR_STATE.area !== 'all' && (r.area||'未分类') !== ACTOR_STATE.area) return false;
    if(focusYmd && !itemHasSlotOn(r, focusYmd)) return false;
    if(q){
      const hay = (r.story + ' ' + r.role + ' ' + r.actor).toLowerCase();
      if(hay.indexOf(q) < 0) return false;
    }
    return true;
  });

  const empty = document.getElementById('actorDemandEmpty');
  const grid = document.getElementById('actorDemandTbody');
  if(!list.length){
    grid.innerHTML = '';
    empty.style.display = 'block';
    empty.innerHTML = ACTOR_STATE.demands.length === 0
      ? '⏳ 数据加载中或当前 release 无声优预估。<br/>先到「需求汇总」页点表头「声优预估 ↻」同步。'
      : `当前筛选下无匹配需求（release=${ACTOR_STATE.release}）。`;
    return;
  }
  empty.style.display = 'none';

  // ① 按需求 ID + story 分组（保留 AREA）
  const groups = new Map();
  list.forEach(r => {
    const key = (r.demandId||'—') + '|' + (r.story||'');
    if(!groups.has(key)) groups.set(key, { demandId: r.demandId, story: r.story, area: r.area || '未分类', rows: [], pendingCount: 0 });
    const g = groups.get(key);
    g.rows.push(r);
    if(r.status === 'pending') g.pendingCount++;
  });

  // ② 按 AREA 分组（有未约的 AREA 排前，其余按名称）
  const areaMap = new Map();
  [...groups.values()].forEach(g => {
    if(!areaMap.has(g.area)) areaMap.set(g.area, []);
    areaMap.get(g.area).push(g);
  });
  const areas = [...areaMap.keys()].sort((a,b) => {
    const pa = areaMap.get(a).some(g => g.pendingCount > 0) ? 0 : 1;
    const pb = areaMap.get(b).some(g => g.pendingCount > 0) ? 0 : 1;
    if(pa !== pb) return pa - pb;
    return a < b ? -1 : 1;
  });

  // 档期文案：已约 → "M/D HH:MM-HH:MM"；未约 → 空（由调用方渲染"待预约"）
  const schedTxt = r => {
    if(!r || r.status !== 'booked' || !r.schedule) return '';
    const lab = formatScheduleLabel(r.schedule);
    if(!lab) return '';
    return (lab.date||'') + (lab.time ? ' ' + lab.time : '');
  };

  const renderCard = g => {
    const hasPending = g.pendingCount > 0;
    // ★ 按角色聚合：一个角色一块，块内并列中配 / 英配档期（待预约的角色排前）
    const roleMap = new Map();
    g.rows.forEach(r => {
      const rk = (r.role || '—');
      if(!roleMap.has(rk)) roleMap.set(rk, { role:rk, actor:r.actor, cn:null, en:null, pend:0, slots:0 });
      const e = roleMap.get(rk);
      if(r.lang === 'cn') e.cn = r; else e.en = r;
      if(r.status === 'pending') e.pend++;
      e.slots++;
    });
    const roles = [...roleMap.values()];
    // ★ 角色行排序（用户 2026-08-31 拍板四档优先级）：
    //   档 1（最上）: 中英两条都未排档期（pend=2）
    //   档 2      : 英文即将录制（en booked 且日期在今天/未来）
    //   档 3      : 中文即将录制（cn booked 且日期在今天/未来，且不满足档 2）
    //   档 4（最下）: 已录完（中英全 booked 且日期都已过）
    //   组内：档 2/3 按各自日期升序（近的更靠上），档 4 按最近日期倒序（最新完成的靠上）
    const today0 = (function(){var d=new Date();d.setHours(0,0,0,0);return d.getTime();})();
    const dateOfSched = r => {
      if(!r || r.status !== 'booked' || !r.schedule) return null;
      try{
        var s = r.schedule;
        var d = s.date ? new Date(s.date) : (s.start ? new Date(s.start) : null);
        if(!d || isNaN(d.getTime())) return null;
        d.setHours(0,0,0,0);
        return d.getTime();
      }catch(_){ return null; }
    };
    const bucketOf = e => {
      const cnBooked = !!(e.cn && e.cn.status === 'booked');
      const enBooked = !!(e.en && e.en.status === 'booked');
      const cnDate = dateOfSched(e.cn);
      const enDate = dateOfSched(e.en);
      const cnUpcoming = cnBooked && cnDate !== null && cnDate >= today0;
      const enUpcoming = enBooked && enDate !== null && enDate >= today0;
      // 档 1: 中英都没排（不区分 pending/null，只要没 booked 即"未排"）
      if(!cnBooked && !enBooked) return { b:1, key:0 };
      // 档 2: 英即将录制
      if(enUpcoming) return { b:2, key:enDate };
      // 档 3: 中即将录制
      if(cnUpcoming) return { b:3, key:cnDate };
      // 档 4: 已录完
      return { b:4, key:-(Math.max(cnDate||0, enDate||0)) };
    };
    roles.forEach(e => { e._sort = bucketOf(e); });
    roles.sort((a,b) => (a._sort.b - b._sort.b) || (a._sort.key - b._sort.key));
    return `
      <div class="dcard ${hasPending?'has-pending':''}">
        <div class="dcard-head">
          <div class="dcard-headline">
            <div class="dcard-name">${escHtmlSafe(g.story||'—')}</div>
          </div>
          <div class="dcard-pending ${hasPending?'':'ok'}">${hasPending ? `<span class="dp-icon">⏱</span>${g.pendingCount} 位待预约` : `<span class="dp-icon"></span>已完成`}</div>
        </div>
        <div class="dcard-roles">
          ${roles.map(e => {
            const cnTxt = schedTxt(e.cn), enTxt = schedTxt(e.en);
            const cnPend = e.cn && e.cn.status !== 'booked';
            const enPend = e.en && e.en.status !== 'booked';
            // v3：3 状态分类 —— 完全没配/部分待约/全部待约
            const slotCnt = e.slots;                           // 实际有的行数（cn+en 各自可能为 null 但 slots 包含）
            const filled  = (e.cn?1:0) + (e.en?1:0);            // 有数据的行
            const pending = e.pend;                              // 待预约行数
            let chipCls = '';
            if(slotCnt === 0 || (filled === 0)) chipCls = 'all-pending';
            else if(pending === filled) chipCls = 'all-pending';
            else if(pending > 0) chipCls = 'is-pending';
            return `
              <div class="role-chip ${chipCls}">
                <div class="rc-name">
                  ${pending ? '<span class="rc-warn" title="有档期待预约">!</span>' : ''}
                  <span title="${escHtmlSafe(e.role)}">${escHtmlSafe(e.role)}</span>
                </div>
                <div class="rc-scheds">
                  <div class="rc-line ${cnPend?'pend':''} ${cnTxt?'':'empty'}" data-lang="cn">
                    <span class="rc-lang cn">中</span>
                    <span class="rc-time ${cnTxt?'real':'empty'}">${cnTxt ? escHtmlSafe(cnTxt) : (e.cn ? '未排档期' : '无安排')}</span>
                  </div>
                  <div class="rc-line ${enPend?'pend':''} ${enTxt?'':'empty'}" data-lang="en">
                    <span class="rc-lang en">英</span>
                    <span class="rc-time ${enTxt?'real':'empty'}">${enTxt ? escHtmlSafe(enTxt) : (e.en ? '未排档期' : '无安排')}</span>
                  </div>
                </div>
              </div>`;
          }).join('')}
        </div>
      </div>`;
  };

  grid.innerHTML = areas.map((area, ai) => {
    const demands = areaMap.get(area);
    // AREA 内：未约需求排前
    demands.sort((a,b) => {
      if((a.pendingCount>0) !== (b.pendingCount>0)) return a.pendingCount>0 ? -1 : 1;
      return a.story < b.story ? -1 : 1;
    });
    const areaPending = demands.reduce((s,g)=>s+g.pendingCount,0);
    // 完成度 = 该 AREA 下已排期的档期数 / 总档期数
    const allSlots  = demands.reduce((s,g)=>s+g.rows.length, 0);
    const doneSlots = demands.reduce((s,g)=>s+g.rows.filter(r=>r.status==='booked').length, 0);
    const pct  = allSlots ? Math.round(doneSlots / allSlots * 100) : 0;
    const cls  = areaPending > 0 ? 'has-pending' : 'is-done';
    return `
      <div class="area-section ${cls}">
        <div class="area-head">
          <span class="area-idx">${String(ai+1).padStart(2,'0')}</span>
          <div class="area-idblock">
            <div class="area-title">
              <span class="area-name">${escHtmlSafe(area)}</span>
              ${areaPending > 0
                ? `<span class="area-pend-badge" title="该 AREA 下待预约的档期合计"><span class="dot"></span>${areaPending} 位待约</span>`
                : `<span class="area-pend-badge zero" title="该 AREA 档期已全部确认"><span class="dot"></span>已排齐</span>`}
            </div>
          </div>
          <div class="area-stat">
            <div class="area-metric"><span class="lbl">需求</span><span class="val">${demands.length}</span></div>
            <div class="area-metric"><span class="lbl">档期</span><span class="val">${allSlots}</span></div>
            <div class="area-metric ${areaPending>0?'pend':'done'}"><span class="lbl">${areaPending>0?'待约':'完成'}</span><span class="val">${areaPending>0?areaPending:doneSlots}</span></div>
          </div>
        </div>
        <div class="area-progress">
          <span class="bar"><i style="width:${pct}%"></i></span>
          <span class="pct">${pct}%</span>
        </div>
        <div class="demand-cards lang-only-${ACTOR_STATE.lang==='en'?'en':ACTOR_STATE.lang==='cn'?'cn':'all'}">${demands.map(renderCard).join('')}</div>
      </div>`;
  }).join('');
}

    .replace(/[【】\s_]/g,'')
    .replace(/\.0+$/,''); // 去除末尾 .0/.00
}

    'Yang2': new Date('2026-12-17'),
    'Yang3': new Date('2027-02-25')

  return map[normReleaseKey(release)] || null;
}

function recordingScheduleDeadlineOf(release){
  const map = {
    'Ma4':   new Date('2026-09-03'), // 声优锁 08-13 + 22d
    'Ma5':   new Date('2026-08-20'), // 声优锁 07-30 + 21d
    'Yang1': new Date('2026-11-19'), // 声优锁 10-28 + 22d（用户校准值）
    'Yang2': new Date('2026-12-31'), // 声优锁 12-17 + 14d（圣诞周跳过）
    'Yang3': new Date('2027-03-12')  // 声优锁 02-25 + 15d（春节周跳过）
  };
  return map[normReleaseKey(release)] || null;
}
// 录制定档期区间 [start, end]：起日 = 声优锁后 1 个有效天，截止 = recordingScheduleDeadlineOf。
function recordingScheduleRangeOf(release){
  const map = {
    'Ma4':   [new Date('2026-08-14'), new Date('2026-09-03')],
    'Ma5':   [new Date('2026-07-31'), new Date('2026-08-20')],
    'Yang1': [new Date('2026-10-29'), new Date('2026-11-19')], // 用户校准起日
    'Yang2': [new Date('2026-12-18'), new Date('2026-12-31')],
    'Yang3': [new Date('2027-02-26'), new Date('2027-03-12')]
  };
  return map[normReleaseKey(release)] || null;
}

function renderScheduleDeadline(){
  var rel = '';
  try{
    rel = String(
      (window.SCHED_STATE && SCHED_STATE.currentRelease)
      || (window.ACTOR_STATE && ACTOR_STATE.release)
      || (typeof detectCurrentReleaseFromDemands === 'function' ? detectCurrentReleaseFromDemands() : '')
      || (window.SHELL_RELEASE || '')
      || ''
    ).trim();
  }catch(_){ rel=''; }
  var meta = document.getElementById('schedDeadlinePill');
  if(!meta) return;
  var rangeEl = document.getElementById('schedDeadlineRange');
  var relEl = document.getElementById('schedDeadlineRel');
  var calmEl = document.getElementById('schedDeadlineCalm');
  var today = new Date(); today.setHours(0,0,0,0);
  var range = recordingScheduleRangeOf(rel);
  function fmt(d){ return (d.getMonth()+1) + '.' + (d.getDate()<10?'0':'') + d.getDate(); }
  if(!range || !rel){
    meta.hidden = true;
    return;
  }
  var startD = range[0], endD = range[1];
  var passed = endD.getTime() < today.getTime();
  if(rangeEl) rangeEl.textContent = fmt(startD) + ' → ' + fmt(endD);
  if(relEl) relEl.textContent = rel;
  if(calmEl) calmEl.hidden = !passed;
  var sy = startD.getFullYear(), sm = startD.getMonth()+1, sd = startD.getDate();
  var ey = endD.getFullYear(), em = endD.getMonth()+1, ed = endD.getDate();
  meta.title = rel + ' 录制定档期：' + sy + '-' + (sm<10?'0':'') + sm + '-' + (sd<10?'0':'') + sd + ' → ' + ey + '-' + (em<10?'0':'') + em + '-' + (ed<10?'0':'') + ed;
  meta.hidden = false;
}

document.addEventListener('DOMContentLoaded', function(){
  try{ renderScheduleDeadline(); }catch(_){}
  // 首屏保险：即便无档期数据，也把中间辅助栏日历先画出来（当月空月历）
  try{ if(typeof renderMidPanel === 'function') renderMidPanel([]); }catch(_){}

});
// 工作日统一按共享模块：周末补班计入，法定放假日与 12/25 排除。
var SCHED_HOLIDAY_CALENDAR = window.VOMI_HOLIDAY_CALENDAR;
function isHolidayOrWeekend(day){
  if(SCHED_HOLIDAY_CALENDAR) return !SCHED_HOLIDAY_CALENDAR.isWorkday(day);
  const dow = day.getDay();
  return dow === 0 || dow === 6;
}
// 从 today 到 targetDate 之间的工作日数（不含起点，含终点）
function workingDaysUntil(targetDate){
  if(!targetDate) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const oneDay = 86400000;
  let n = 0;
  for(let t = today.getTime() + oneDay; t <= targetDate.getTime(); t += oneDay){
    if(isHolidayOrWeekend(new Date(t))) continue;
    n++;
  }
  return n;
}

}

function escHtml(s){ return escHtmlSafe(s); }
function escAttr(s){ return String(s==null?'':s).replace(/['"\\]/g, '\\$&'); }

      var day=d.getDate(); if(!marks[day]) marks[day]={cn:0,en:0};
      if(r.lang==='en') marks[day].en++; else marks[day].cn++;
    });

    var html='';
    ['一','二','三','四','五','六','日'].forEach(function(w){ html+='<div class="mp-cal-dow">'+w+'</div>'; });
    var firstIdx=(base.getDay()+6)%7;
    for(var i=0;i<firstIdx;i++) html+='<div class="mp-cal-day empty"></div>';
    var last=new Date(base.getFullYear(), base.getMonth()+1, 0).getDate();
    for(var d=1; d<=last; d++){
      var mk=marks[d]||{cn:0,en:0};
      var cls='mp-cal-day';
      if(mk.cn&&mk.en) cls+=' both';
      else if(mk.cn) cls+=' cn';
      else if(mk.en) cls+=' en';
      var holi = holidayInfo(base.getFullYear(), base.getMonth(), d);
      if(holi) cls += ' holiday';
      var tt=(mk.cn||mk.en)?(' title="中配 '+mk.cn+' / 英配 '+mk.en+'"'):'';
      if(holi) tt += (tt?' · ':' title="') + holi.label;
      var inner = '<span class="d-num">'+d+'</span>' + (holi?('<span class="d-tag">'+holi.tag+'</span>'):'');
      var hasBooking = (mk.cn||mk.en);
      var ymd = base.getFullYear()+'-'+String(base.getMonth()+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      var attr = hasBooking ? (' data-ymd="'+ymd+'"') : '';
      html+='<div class="'+cls+'"'+tt+attr+'>'+inner+'</div>';
    }
    grid.innerHTML=html;
    applyMidFocus();
  }
  // ★ 即将录制：展示列表跟随日历当前月份，最多 5 条
  function currentMonthNum(){

    return { y:a.getFullYear(), m:a.getMonth() };
  }
  function upcomingDisplayList(){
    var all = window.__MID_UPCOMING_ROWS || [];

    var inMonth = all.filter(function(it){

    });

  }

  function updateUpcomingTitle(){

  function renderMidUpcoming(rows){
    var box=document.getElementById('mpUpcoming'); if(!box) return;
    var list=(rows||[]).map(function(r){
      var d=parseYMD(r.date); if(!d) return null;
      var lg=(r.lang==='en'?'en':'cn');
      // 优先用 HH:MM-HH:MM 精确时间；缺失时才回退到"上午/下午/晚"这种时段模糊值
      var st=String(r.start_time||'').trim();
      var et=String(r.end_time||'').trim();
      var timeTxt=(st && et) ? (st+'-'+et) : (st || String(r.slot||'待定时段'));
      return {
        date:d,
        time:timeTxt,
        lang:lg,
        role:String(r.role||'未关联角色'),
        demand:String(r.title||demandNameFromId(r.demandId)||r.plan||'未关联需求')
      };
    }).filter(Boolean);
    // "即将录制"语义：只保留今天及以后。过去档期已归档，不占即将列表
    var _t0 = new Date(); _t0.setHours(0,0,0,0);
    var _fullList = list.filter(function(it){ return it.date >= _t0; })
                         .sort(function(a,b){ return a.date-b.date; });
    // ★ 存全量（跨月、不截断），供日历点击后按日期筛选
    window.__MID_UPCOMING_ROWS = _fullList;

    list = upcomingDisplayList();

    if(!list.length){ box.innerHTML='<div class="mp-empty">'+upcomingEmptyText()+'</div>'; updateUpcomingTitle(); applyMidFocus(); return; }
    renderUpcomingItems(box, list, null);
    updateUpcomingTitle();
    applyMidFocus();

  // ★ 即将录制条目渲染（供初始渲染 + 日历日期过滤重绘共用）
  // focusYmd = null → 全量显示；= 'YYYY-MM-DD' → 该日条目全部高亮 .focused
  function renderUpcomingItems(box, items, focusYmd){
    var _todayUp = new Date(); _todayUp.setHours(0,0,0,0);
    var html='';
    items.forEach(function(it){
      var y=it.date.getFullYear(), m=it.date.getMonth()+1, dd=it.date.getDate();
      var ymd=y+'-'+String(m).padStart(2,'0')+'-'+String(dd).padStart(2,'0');
      var isPast = it.date < _todayUp;
      var pastCls = isPast ? ' past' : '';
      // 日历过滤模式下，所有条目都是目标日期 → 统一加 focused
      var focusCls = (focusYmd && ymd === focusYmd) ? ' focused' : '';
      var dotColor = isPast ? '#5D6E78' : (it.lang==='en' ? 'var(--c-primary)' : '#8CA8C1');
      var dotShadow = isPast ? 'none' : (it.lang==='en' ? '0 0 4px rgba(15,247,150,.6)' : '0 0 4px rgba(140,168,189,.6)');
      var dateColor = isPast ? 'var(--c-text-mute)' : '#fff';
      var timeColor = isPast ? 'var(--c-text-dim)' : 'rgba(255,255,255,.7)';
      var langTxt=it.lang==='en'?'英配':'中配';
      html+='<div class="mp-up-item'+pastCls+focusCls+'" data-ymd="'+ymd+'">'
        +'<div class="mp-up-pill'+pastCls+'" style="--up-dot:'+dotColor+';--up-shadow:'+dotShadow+';--up-date:'+dateColor+';--up-time:'+timeColor+'">'
          +'<span class="mp-up-pill-dot"></span>'
          +'<span class="mp-up-pill-date">'+m+'/'+dd+'</span>'
          +'<span class="mp-up-pill-time">'+it.time+'</span>'

        +'<div class="mp-up-role">'+esc(it.role)+'</div>'

      +'</div>';
    });

  }

  // 中间侧栏 focus 联动：点日历某日 / 点即将录制条目 → 双向高亮，点页面空白清除
  window.MID_FOCUS_YMD = window.MID_FOCUS_YMD || null;
  function focusMidDay(ymd, evt){
    if(evt){ evt.stopPropagation(); }
    window.MID_FOCUS_YMD = (window.MID_FOCUS_YMD === ymd) ? null : ymd;
    // 智能翻月：若目标日期不在当前日历月，自动把日历翻到那个月，保证高亮可见
    if(window.MID_FOCUS_YMD){
      var d = parseYMD(ymd);
      if(d){
        var anchor = MID_STATE.monthAnchor || monthStart(new Date());
        if(d.getFullYear()!==anchor.getFullYear() || d.getMonth()!==anchor.getMonth()){
          MID_STATE.monthAnchor = monthStart(d);
          renderMidPanel(); // 内部会调用 applyMidFocus
        }
      }
    }
    // 日期 focus → 重绘主表真过滤（只显示该日录制信息）
    if(typeof renderActorRollup === 'function') renderActorRollup();
  }
  function clearMidFocus(){
    if(!window.MID_FOCUS_YMD) return;
    window.MID_FOCUS_YMD = null;
    if(typeof renderActorRollup === 'function') renderActorRollup();
  }
  function applyMidFocus(){
    var target = window.MID_FOCUS_YMD;
    // 日历日
    document.querySelectorAll('#mpCalendarGrid .mp-cal-day').forEach(function(el){
      el.classList.remove('focused','dimmed');
      if(!target || el.classList.contains('empty')) return;
      var y = el.getAttribute('data-ymd');
      if(y === target) el.classList.add('focused');
      else el.classList.add('dimmed');
    });
    // 即将录制：按日期过滤重绘（而非仅 CSS 高亮）
    var upBox = document.getElementById('mpUpcoming');
    var upTitle = document.getElementById('mpUpcomingTitle');
    if(upBox && window.__MID_UPCOMING_ROWS){
      if(target){
        // ★ 过滤：只显示目标日期的条目
        var dayItems = window.__MID_UPCOMING_ROWS.filter(function(it){
          var y=it.date.getFullYear(), m=it.date.getMonth()+1, dd=it.date.getDate();
          return (y+'-'+String(m).padStart(2,'0')+'-'+String(dd).padStart(2,'0')) === target;
        });
        if(dayItems.length){
          // 标题改为具体日期
          var td = parseYMD(target);
          if(td) upTitle.textContent = (td.getMonth()+1)+'/'+td.getDate()+' · 录制安排';
          renderUpcomingItems(upBox, dayItems, target);
        } else {
          upTitle.textContent = (target.replace(/-/g,'/'))+' · 无录制';
          upBox.innerHTML = '<div class="mp-empty">该日暂无录制安排</div>';
        }
      } else {
        // ★ 恢复：跟随当前日历月份，最多 5 条
        var back = upcomingDisplayList();
        updateUpcomingTitle();
        if(!back.length){ upBox.innerHTML='<div class="mp-empty">'+upcomingEmptyText()+'</div>'; }
        else renderUpcomingItems(upBox, back, null);
      }
    }
    // 主表真过滤已由 renderActorRollup 按 window.MID_FOCUS_YMD 完成，此处不再做 DOM 高亮
  }
  // 点空白清 focus + 事件委托（一次性挂）
  if(!window.__MID_FOCUS_BOUND){
    window.__MID_FOCUS_BOUND = true;
    document.addEventListener('click', function(e){
      // 优先命中日历方格
      var dayEl = e.target.closest && e.target.closest('#mpCalendarGrid .mp-cal-day[data-ymd]');
      if(dayEl){
        e.stopPropagation();
        focusMidDay(dayEl.getAttribute('data-ymd'));
        return;
      }
      // 再命中即将录制条目
      var upEl = e.target.closest && e.target.closest('#mpUpcoming .mp-up-item[data-ymd]');
      if(upEl){
        e.stopPropagation();
        focusMidDay(upEl.getAttribute('data-ymd'));
        return;
      }
      // 都没命中 → 若点在空白处则恢复默认总计
      if(!isBlankTarget(e.target)) return;
      clearAllFilters();
    });
  }

  window.clearMidFocus = clearMidFocus;
  window.applyMidFocus = applyMidFocus;

  function aggregate(){
    var c=loadClarify(); var plans={}; var order=[];
    Object.keys(c).forEach(function(id){
      var r=c[id]; var p=r.release||'未指定';
      if(!plans[p]){ plans[p]={plan:p,cn:0,en:0,lines:0,n:0}; order.push(p); }
      plans[p].cn += (+r.cn||0); plans[p].en += (+r.en||0);
      plans[p].lines += (+r.lines||0); plans[p].n += 1;
    });
    return order.map(function(k){return plans[k];});
  }

  function renderSched(){
    // 档期草稿区块已从主页面移除；本函数保留仅用于兼容旧调用，直接返回不再渲染
    var body=document.getElementById('schedBody');
    if(!body) return;
    var rows=loadSched();
    var lang=SCHED_STATE.lang||'all';
    if(window.FORCE_SCHED_MOCK){
      // 强制预览：永远使用虚拟草稿，并绕过 release 过滤，保证必有可见样例。
      rows = buildMockDraftRows();
      lang = 'all';
    }
    if(!SCHED_STATE.currentRelease){
      SCHED_STATE.currentRelease = detectCurrentReleaseFromDemands() || detectCurrentReleaseFromRows(rows) || detectCurrentReleaseFromRows(PUBLISHED_ROWS) || '';
    }
    var byReleaseDraft = window.FORCE_SCHED_MOCK
      ? rows.slice()
      : rows.filter(function(r){ return schedReleaseMatch(r.plan||r.release_plan||''); });
    var autoMockFallback = false;
    if(window.FORCE_SCHED_MOCK && !byReleaseDraft.length){
      // 仅 file:// 预览：release/history 过滤后仍可回退样例；线上空数据必须保持空态。
      var mockRows = buildMockDraftRows();
      var mockByRelease = mockRows.filter(function(r){ return schedReleaseMatch(r.plan||r.release_plan||''); });
      byReleaseDraft = mockByRelease.length ? mockByRelease : mockRows;
      autoMockFallback = byReleaseDraft.length > 0;
    }
    var byReleasePub = window.FORCE_SCHED_MOCK
      ? []
      : PUBLISHED_ROWS.filter(function(r){ return schedReleaseMatch(r.release_plan||r.plan||''); });
    var viewRows = lang==='all' ? byReleaseDraft : byReleaseDraft.filter(function(r){ return normLang(r.vaType)===lang; });
    var pubRows = lang==='all' ? byReleasePub : byReleasePub.filter(function(r){ return normLang(r.language||r.lang||r.vaType||r.va_type||r.voice_type)===lang; });

    var st = SCHED_STATE.status || 'all';
    if(st!=='all'){
      viewRows = viewRows.filter(function(r){ return schedStatusBucket(r.status)===st; });
      pubRows = pubRows.filter(function(r){ return schedStatusBucket(r.status||r.publish_status||r.state)===st; });
    }

    var panelRows = buildPanelRows(viewRows,pubRows);
    var segLabel = SCHED_STATE.releaseToken==='__archive__' ? '历史归档' : (SCHED_STATE.releaseToken ? SCHED_STATE.releaseToken : '全部版本');
    var mockTag = isMockRows(rows) ? (window.FORCE_SCHED_MOCK ? ' · 强制虚拟预览' : ' · 虚拟预览') : (autoMockFallback ? ' · 自动兜底样例' : '');
    var countNode = document.getElementById('schedCount');
    if(countNode) countNode.textContent=segLabel+mockTag+' · '+viewRows.length+' 草稿 · '+pubRows.length+' 已发布';
    var pb=document.getElementById('publishDraftsBtn'); if(pb){pb.disabled=!rows.length;pb.querySelector('span').textContent=rows.length?'发布草稿 · '+rows.length:'发布草稿';}
    if(!rows.length && !autoMockFallback){
      body.innerHTML='<div class="empty-hint">暂无档期草稿 · 点右上「<b>从澄清看板生成草稿</b>」一键从需求汇总的澄清看板生成</div>';
      renderAgg(); updateKPI(viewRows); renderMidPanel(panelRows); return;
    }
    if(!viewRows.length){
      var emptyTxt = SCHED_STATE.releaseToken==='__archive__' ? '历史归档下暂无档期草稿。' : '当前版本筛选下暂无档期草稿。';
      body.innerHTML='<div class="empty-hint">'+emptyTxt+'</div>';
      renderAgg(); updateKPI(viewRows); renderMidPanel(panelRows); return;
    }
    var html='<table class="sched-table"><thead><tr>'
      +'<th>发布计划</th><th>关联需求</th><th>声优类型</th><th>预估时长</th><th>粗估句数</th>'
      +'<th>录音棚</th><th>日期</th><th>时段</th><th>发布后状态</th><th>操作</th></tr></thead><tbody>';
    viewRows.forEach(function(r){
      html+='<tr data-id="'+r.id+'">'
        +'<td>'+esc(r.plan)+'</td>'
        +'<td>'+demandSel(r)+'</td>'
        +'<td><span class="tag '+(r.vaType==='en'?'en':'cn')+'">'+(r.vaType==='en'?'英配':'中配')+'</span></td>'
        +'<td><span style="font-family:JetBrains Mono,monospace">'+fmtH(r.estHours)+' h</span></td>'
        +'<td style="font-family:JetBrains Mono,monospace">'+esc(r.lines)+'</td>'
        +'<td><input class="sched-input" value="'+esc(r.studio)+'" onchange="SCHED.upd(\''+r.id+'\',\'studio\',this.value)"/></td>'
        +'<td><input class="sched-input" type="date" value="'+esc(r.date)+'" onchange="SCHED.upd(\''+r.id+'\',\'date\',this.value)"/></td>'
        +'<td><input class="sched-input" value="'+esc(r.slot)+'" placeholder="上午/下午/晚" onchange="SCHED.upd(\''+r.id+'\',\'slot\',this.value)"/></td>'
        +'<td>'+statusSel(r)+'</td>'
        +'<td><button class="sched-del" style="color:var(--c-primary);margin-right:4px" title="发布这一条草稿" onclick="SCHED.publishOne(\''+r.id+'\')">发布</button><button class="sched-del" title="删除草稿" onclick="SCHED.del(\''+r.id+'\')">✕</button></td>'
        +'</tr>';
    });
    html+='</tbody></table>';
    body.innerHTML=html;
    renderAgg(); updateKPI(viewRows); renderMidPanel(panelRows);
  }
  function statusSel(r){
    var v=r.status||'draft';
    return '<select class="sched-input" style="width:auto" onchange="SCHED.upd(\''+r.id+'\',\'status\',this.value)">'
      +'<option value="draft"'+(v==='draft'?' selected':'')+'>草稿</option>'

      +'<option value="done"'+(v==='done'?' selected':'')+'>已完成</option>'
      +'</select>';

  function renderAgg(){
    var agg=aggregate(); var b=document.getElementById('aggBody');
    if(!b) return;
    if(!agg.length){ b.innerHTML='<div class="wiz-empty">未检测到澄清数据。<br/>请先在「需求汇总」填写各需求的声优需求 / 粗估句数。</div>'; return; }
    var html='';
    agg.forEach(function(a){
      var hrs=((+a.lines||0)*RATE_DEFAULT/3600).toFixed(1);
      html+='<div class="agg-row"><span class="k">'+esc(a.plan)+'</span>'
        +'<span class="v">中 '+a.cn+' · 英 '+a.en+' <small>· '+a.lines+'句/'+hrs+'h</small></span></div>';
    });

  function updateKPI(sourceRows){
    var rows=Array.isArray(sourceRows)?sourceRows:loadSched();
    var totH=rows.reduce(function(s,r){return s+(+r.estHours||0);},0);
    var conf=countConflicts(rows);
    setStat(0, rows.length, '/ 场', false);
    setStat(1, totH.toFixed(1), 'h', false);
    setStat(2, uniqStudios(rows), '家', false);
    setStat(3, conf, '个', conf>0);
  }
  function uniqStudios(rows){ var s={}; rows.forEach(function(r){ if(r.studio&&r.studio!=='待定') s[r.studio]=1; }); return Object.keys(s).length; }
  function countConflicts(rows){
    var m={}, c=0;
    rows.forEach(function(r){ if(!r.date||!r.studio||r.studio==='待定') return; var k=r.date+'|'+r.studio+'|'+(r.slot||''); m[k]=(m[k]||0)+1; if(m[k]===2) c++; });
    return c;
  }
  function setStat(i,val,unit,danger){
    var stats=document.querySelectorAll('.stat-strip .stat'); if(!stats[i]) return;
    var v=stats[i].querySelector('.stat-value'); v.innerHTML=val+'<span class="unit">'+unit+'</span>';
    var sub=stats[i].querySelector('.stat-sub');
    if(danger){ v.style.color='var(--c-danger)'; sub.style.color='var(--c-danger)'; sub.textContent='同档期同棚冲突'; }
    else { v.style.color=''; sub.style.color=''; sub.textContent='—'; }
  }

  function validateDraft(r){
    if(!(r.demandId||r.demand_id)) return '请选择关联需求';
    if(!r.date) return '请填写录制日期';
    if(!r.vaType) return '请选择中配或英配';
    return '';
  }
  function publishRows(rows){
    if(!rows.length){toast('没有可发布的草稿');return Promise.resolve();}
    var invalid=rows.map(function(r){return {id:r.id,error:validateDraft(r)}}).filter(function(x){return x.error});
    if(invalid.length){toast('有 '+invalid.length+' 条草稿未完成：'+invalid[0].error,true);return Promise.resolve();}
    var btn=document.getElementById('publishDraftsBtn'); if(btn)btn.disabled=true;
    return fetch('/api/schedules/publish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({drafts:rows})})
      .then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok&&r.status!==207)throw Error(j.error||('HTTP '+r.status));return j;});})
      .then(function(j){
        var ids=new Set((j.published||[]).map(function(x){return String(x.client_draft_id)}));
        var remain=loadSched().filter(function(x){return !ids.has(String(x.id));}); saveSched(remain);
        if((j.failed||[]).length) toast('已发布 '+ids.size+' 条，'+j.failed.length+' 条失败：'+j.failed[0].error,true);
        else toast('已发布 '+ids.size+' 条正式档期');
        return loadPublishedSchedules();
      }).catch(function(e){toast('发布失败：'+e.message,true);}).finally(function(){if(btn)btn.disabled=false;renderSched();});
  }
  var SCHED={
    upd:function(id,key,val){ var rows=loadSched(); var r=rows.find(function(x){return x.id===id;}); if(!r) return; r[key]=val; saveSched(rows); renderSched(); },
    del:function(id){ saveSched(loadSched().filter(function(x){return x.id!==id;})); renderSched(); },
    publishOne:function(id){var r=loadSched().find(function(x){return x.id===id;});return publishRows(r?[r]:[]);},
    publishAll:function(){return publishRows(loadSched());},
    open:function(){
      var agg=aggregate(); var wr=document.getElementById('wizRows');
      if(!agg.length){ wr.innerHTML='<div class="wiz-empty">未检测到澄清数据 · 请先在需求汇总填写声优需求 / 粗估句数</div>'; }
      else{
        var html='';
        agg.forEach(function(a){
          var hrs=((+a.lines||0)*RATE_DEFAULT/3600).toFixed(1);
          html+='<div class="wiz-row"><input type="checkbox" class="chk" data-plan="'+esc(a.plan)+'" data-cn="'+a.cn+'" data-en="'+a.en+'" data-lines="'+a.lines+'" checked>'
            +'<span class="plan">'+esc(a.plan)+'</span>'
            +'<span class="meta">中 <b>'+a.cn+'</b> · 英 <b>'+a.en+'</b> · <b>'+a.lines+'</b>句 · ≈<b>'+hrs+'h</b></span>'
            +'<select class="wiz-split"><option value="type">按声优类型</option><option value="count">按声优数</option></select></div>';
        });
        wr.innerHTML=html;
      }
      document.getElementById('wizMask').classList.add('on');
    },
    close:function(){ document.getElementById('wizMask').classList.remove('on'); },
    confirm:function(){
      var rate=+document.getElementById('wizRate').value||RATE_DEFAULT;
      var studio=document.getElementById('wizStudio').value;
      var rows=loadSched();
      var checks=document.querySelectorAll('#wizRows .chk:checked');
      if(!checks.length){ toast('请至少选择一个发布计划'); return; }
      checks.forEach(function(chk){
        var plan=chk.dataset.plan, lines=+chk.dataset.lines||0, cn=+chk.dataset.cn||0, en=+chk.dataset.en||0;
        var split=chk.parentElement.querySelector('.wiz-split').value;
        var totalH=lines*rate/3600;
        if(split==='count'){
          var tot=Math.max(cn+en,1); var perL=Math.max(Math.round(lines/tot),0), perH=+(totalH/tot).toFixed(2);
          for(var i=0;i<cn;i++) rows.push(mkSess(plan,'cn',perL,perH,studio));
          for(var j=0;j<en;j++) rows.push(mkSess(plan,'en',perL,perH,studio));
        } else {
          var half=Math.round(lines/2), halfH=+(totalH/2).toFixed(2);
          if(cn>0) rows.push(mkSess(plan,'cn',half,halfH,studio));
          if(en>0) rows.push(mkSess(plan,'en',lines-half,+(totalH-halfH).toFixed(2),studio));
        }
      });
      saveSched(rows); SCHED.close(); renderSched();
      toast('已生成 '+rows.length+' 场草稿 · 在表格补全录音棚/日期/时段');
    },
    addEmpty:function(){ var rows=loadSched(); rows.push({id:uid(),plan:'',demandId:'',vaType:'cn',lines:0,estHours:0,studio:'待定',date:'',slot:'',status:'draft'}); saveSched(rows); renderSched(); },
    export:function(){
      var rows=loadSched(); if(!rows.length){ toast('暂无档期可导出'); return; }
      var head=['发布计划','关联需求ID','声优类型','粗估句数','预估时长(h)','录音棚','日期','时段','状态'];
      var lines=rows.map(function(r){ return [r.plan,r.demandId||'',r.vaType==='en'?'英配':'中配',r.lines,r.estHours,r.studio,r.date,r.slot,r.status].map(function(x){return '"'+String(x==null?'':x).replace(/"/g,'""')+'"';}).join(','); });
      var csv='﻿'+head.join(',')+'\n'+lines.join('\n');
      var blob=new Blob([csv],{type:'text/csv;charset=utf-8'}); var a=document.createElement('a');
      a.href=URL.createObjectURL(blob); a.download='VO录制档期草稿.csv'; a.click();
      toast('已导出 '+rows.length+' 场档期 CSV');
    }
  };
  function mkSess(plan,vaType,lines,estHours,studio){ return {id:uid(),plan:plan,demandId:'',vaType:vaType,lines:lines,estHours:estHours,studio:studio,date:'',slot:'',status:'draft'}; }
  function toast(m,isConflict){ var t=document.createElement('div'); t.textContent=m; t.style.cssText='position:fixed;bottom:16px;right:20px;max-width:460px;font-family:JetBrains Mono,monospace;font-size:11.5px;letter-spacing:.5px;background:var(--c-surface);border:1px solid '+(isConflict?'rgba(214,153,190,.55)':'var(--c-hairline)')+';padding:7px 12px;border-radius:4px;color:'+(isConflict?'#D699BE':'var(--c-primary)')+';z-index:500;transition:opacity .3s;opacity:1'; document.body.appendChild(t); setTimeout(function(){t.style.opacity='0';setTimeout(function(){t.remove();},300);},isConflict?8000:2400); }
  // 从 Vo 版本汇总表手动同步：实际行为是重新拉取 recording_schedules（由后端 automation-1787028270062 每日 10:30 自动从版本汇总表「声优锁-总表」写入）。
  // 前端按钮只做"按需刷新"，不会真正触发腾讯文档拉取。
  window.syncFromVersionSummary=function(){
    var btn=document.getElementById('syncFromSummaryBtn');
    if(btn){ btn.disabled=true; btn.dataset.label=btn.dataset.label||btn.innerHTML; btn.innerHTML='<span class="sync-spinner"></span>同步中…'; }
    toast('正在从 Vo 版本汇总表同步…');
    return loadPublishedSchedules().then(function(rows){
      toast('已同步：'+(Array.isArray(rows)?rows.length:0)+' 条录制定档');
      return rows;
    }).catch(function(e){ toast('同步失败：'+(e&&e.message||e), true); return []; }).finally(function(){
      if(btn){ btn.disabled=false; if(btn.dataset.label) btn.innerHTML=btn.dataset.label; }
    });
  };
  window.openDraftWizard=SCHED.open; window.closeDraftWizard=SCHED.close; window.confirmDraftWizard=SCHED.confirm;
  window.addEmptySched=SCHED.addEmpty; window.exportSchedule=SCHED.export; window.publishScheduleDrafts=SCHED.publishAll;
  window.renderSched=renderSched;
  document.getElementById('wizMask').addEventListener('click',function(e){ if(e.target===this) SCHED.close(); });
  renderSched();
  loadDemandOptions();
  // 启动：草稿仅本机；正式档期只读recording_schedules。KV不再承载档期草稿。
  kvPull(CLARIFY).then(function(remoteClar){
    try{if(remoteClar && !Object.keys(loadClarify()).length)localStorage.setItem(CLARIFY,remoteClar);}catch(_){}
    return loadPublishedSchedules();
  }).then(renderSched);
})();
</script>

<script>
(function(){
  if(document.body.classList.contains("embed")) return;   // 嵌在 Vo Manager 外壳内时交给外壳处理
  var MAP = {
    "需求汇总":"preview-需求汇总-精修版.html",
    "声优库":"preview-声优库-精修版.html",
    "录制档期":"preview-录制档期-精修版.html",
    "音频资产库":"preview-资产库-精修版.html",
    "vo资产库":"preview-资产库-精修版.html",
    "vo智能助手":"preview-AI助手-精修版.html",
    "vohq助手":"preview-AI助手-精修版.html",
    "vo助手":"preview-AI助手-精修版.html"
  };
  var cur = (location.pathname.split("/").pop()||"").toLowerCase();
  var items = document.querySelectorAll("aside.sidebar .nav-item");
  for(var i=0;i<items.length;i++){
    var btn = items[i];
    var label = (btn.textContent||"").replace(/\s+/g,"").toLowerCase();
    var target = MAP[label];
    if(!target) continue;
    if(target.toLowerCase()===cur){ btn.classList.add("active"); continue; }
    btn.style.cursor="pointer";
    btn.addEventListener("click", function(t){ return function(){ window.location.href = t; }; }(target));
  }
})();
</script>
