function updateStats(){
  // ① 当前推进版本：dev/test 段包含 TODAY 的最早版本；否则取下一个开始的版本
  const inProg = VERSIONS.filter(v => !v.planned).find(v => {
    const dev = v.phases.find(p=>p.type==='dev'), test = v.phases.find(p=>p.type==='test');
    if(dev && TODAY >= d(dev.start) && TODAY <= d(dev.end)) return true;
    if(test && TODAY >= d(test.start) && TODAY <= d(test.end)) return true;
    return false;
  });
  const nextVer = inProg || VERSIONS.filter(v => !v.planned).find(v => {
    const dev = v.phases.find(p=>p.type==='dev');
    return dev && d(dev.start) > TODAY;
  });
  const cv = document.getElementById('statCurVer');
  const cvSub = document.getElementById('statCurVerSub');
  if(nextVer){
    const nowPh = nextVer.phases.find(p => TODAY >= d(p.start) && TODAY <= d(p.end));
    // 阶段标签：按实际阶段显示（dev=开发期 / test=测试期 / release=发布期）
    const PHASE_NAMES = { dev:'开发期', test:'测试期', release:'发布期', w0:'启动周' };
    const phaseLabel = nowPh ? (PHASE_NAMES[nowPh.type] || nowPh.type) : '未开始';
    const lastPh = nextVer.phases[nextVer.phases.length-1];
    // 「距结束」= 距该版本「★对外正式包确认」的工作日；无该条目时回退用 lastPh.end
    const endDate = PACK_CONFIRM_BY_VER[nextVer.id] || d(lastPh.end);
    const daysToEnd = workingDaysUntil(TODAY, endDate);
    const usePack = !!PACK_CONFIRM_BY_VER[nextVer.id];
    const endLabel = usePack ? '距对外包' : '距结束';
    cv.innerHTML = `${nextVer.name}<span class="unit">${nowPh?'':'即将开始'}</span>`;
    const modeCls = usePack ? 'cd-mode-real' : 'cd-mode-est';
    const estNote = usePack ? '' : ' <span class="cd-est-note">（估）</span>';
    cvSub.innerHTML = `${phaseLabel} · <span class="cd-mode ${modeCls}">${endLabel} ${daysToEnd} 工作日</span>${estNote}`;
  } else {
    cv.innerHTML = `—<span class="unit"></span>`;
    cvSub.textContent = '暂无进行中/临近版本';
  }

  // ② 下一节点：EVENTS 里未来最近的点事件（受视角/分类过滤联动），倒计时用工作日
  const nowMon = mondayOf(TODAY);
  const nextEvt = EVENTS.filter(e => !e.range && eventVisible(e) && e.date >= TODAY)
    .sort((a,b) => a.date - b.date)[0];
  const cd = document.getElementById('statCd');
  const cdSub = document.getElementById('statCdSub');
  if(nextEvt){
    const wd = workingDaysUntil(TODAY, nextEvt.date);
    cd.innerHTML = `${wd}<span class="unit">工作日</span>`;
    const label = nextEvt.short.replace(/^→/, '');
    cdSub.textContent = `${label} · ${fmtShort(nextEvt.date)}`;
  } else {
    cd.innerHTML = `—<span class="unit"></span>`;
    cdSub.textContent = '暂无后续节点';
  }

  // ③ 本周节点：EVENTS 里 date 落在本周(周一-周日)的会议/里程碑数量（受视角过滤联动）
  const wkSun = new Date(nowMon.getTime() + 6*86400000);
  const wkPoints = EVENTS.filter(e => !e.range && eventVisible(e) && e.date >= nowMon && e.date <= wkSun);
  const nx = document.getElementById('statNext');
  const nxSub = document.getElementById('statNextSub');
  nx.innerHTML = `${wkPoints.length}<span class="unit">个</span>`;
  if(wkPoints.length){
    // 副标：显示前 2 个节点名
    const labels = wkPoints.slice(0,2).map(e => e.short.replace(/^→/, '')).join(' · ');
    nxSub.textContent = wkPoints.length > 2 ? `${labels} +${wkPoints.length-2}` : labels;
  } else {
    nxSub.textContent = roleFilter ? '本周该视角无节点' : '本周无关键节点';
  }

  // ④ 本周待办：EVENTS 里过程事项（分配会/文案ING/录制定档期/选角ING/Vo ING）与本周相交的数量
  const wkSubs = EVENTS.filter(e => e.subTask && eventVisibleTimeline(e) && (
    e.range ? (e.range[0] <= wkSun && e.range[1] >= nowMon)
            : (e.date >= nowMon && e.date <= wkSun)
  ));
  const rg = document.getElementById('statRange');
  const rgSub = document.getElementById('statRangeSub');
  rg.innerHTML = `${wkSubs.length}<span class="unit">条</span>`;
  if(wkSubs.length){
    const tagLabel = { 's-thu-alloc':'台词需求分配会', 'r-cn-ing':'文案ING', 's-sched-win':'录制定档期', 'r-cast':'选角ING', 'r-vo-ing':'Vo ING' };
    // 每条事项带版本名；同版本同事项去重，避免只显示类型后无法判断归属
    const labels = [...new Set(wkSubs.map(e=>{
      const v = VERSIONS.find(x=>x.id===e.forVer);
      const ver = v ? v.name : e.forVer;
      return `${ver} ${tagLabel[e.tag]||e.tag}`;
    }))];
    rgSub.textContent = labels.join(' · ');
  } else {
    rgSub.textContent = '本周无子事项';
  }
}

// 开发倒计时：显示当前版本 + 后续 2 个版本，距离本版本「转测 W1（周一）」还剩几周
// 规则：若版本已进入转测/发布（test.start <= TODAY），跳过；只显示 dev 或更早阶段的版本
// 「几周」= 从本周一开始，到 test.start 那周的周一，跨越的完整周数（>=0）
function renderThisWeek(){
  const box = document.getElementById('rpThisWeek');
  // 按发布时间顺序（VERSIONS 已按 release-plans.json 顺序），过滤：仍未进入转测 & 非 planned
  const nowMon = mondayOf(TODAY);
  const cands = VERSIONS.filter(v => !v.planned).map(ver => {
    const testPh = ver.phases.find(p => p.type === 'test');
    if(!testPh) return null;
    const testStart = d(testPh.start);
    const testMon = mondayOf(testStart);
    // 已到转测/发布 → 跳过
    if(testMon.getTime() <= nowMon.getTime()) return null;
    // 计算"工作周"数：从本周一逐周向前走到 testMon，跳过节假日周
    let weeksLeft = 0;
    let cur = new Date(nowMon.getTime());
    while(cur.getTime() < testMon.getTime()){
      cur = new Date(cur.getTime() + 7*86400000);
      if(weekIsHoliday(cur)) continue; // 节假日周不计
      weeksLeft++;
    }
    return { ver, testStart, testMon, weeksLeft };
  }).filter(Boolean);
  const items = cands.slice(0, 3); // 当前 + 后 2 个
  if(!items.length){ box.innerHTML = '<div class="rp-empty">所有版本已进入转测</div>'; return; }
  box.innerHTML = items.map(it => {
    // 判断"当前所处阶段"用于副标签
    const nowPh = it.ver.phases.find(p => {
      const s = d(p.start), e = d(p.end);
      return TODAY >= s && TODAY <= e;
    });
    const PHASE_NAMES = { dev:'开发期', test:'测试期', release:'发布期', w0:'启动周' };
    const phaseLabel = nowPh ? (PHASE_NAMES[nowPh.type] || nowPh.type) : '未开始';
    return `
    <div class="rp-tw-item">
      <div class="rp-tw-ver">${it.ver.name}<span class="rp-tw-phase">${phaseLabel}</span></div>
      <div class="rp-tw-cd">
        <span class="rp-tw-cd-num">${it.weeksLeft}</span><span class="rp-tw-cd-unit">周</span>
      </div>
      <div class="rp-tw-cd-sub">距转测 W1 · ${fmtShort(it.testStart)}</div>
    </div>`;
  }).join('');
}

// 未来60天（含今天）：今天00:00～今天+59天；点节点落窗即显示，区间与窗口相交即显示。
// 区间一旦命中窗口，日期必须显示该事项的完整起止段，不裁剪为窗口边界。
// 内容：4大关键节点 + 台词需求分配会 / 文案ING / 录制定档期 / 选角ING / Vo ING。
function renderTimeline60(){
  const box = document.getElementById('rpTimeline');
  const end = new Date(TODAY); end.setDate(end.getDate()+59);
  const TIME_HINT = {
    'm-estimate':  '11:30',
    'm-script':    '11:30',
    'm-deliver':   '',
    's-thu-alloc': '11:30'
  };
  const evs = EVENTS.filter(e => {
    if(!eventVisibleTimeline(e)) return false;
    if(e.range){ return e.range[0] <= end && e.range[1] >= TODAY; }
    return e.date >= TODAY && e.date <= end;
  }).sort((a,b)=>(a.date||a.range[0])-(b.date||b.range[0]));
  if(!evs.length){ box.innerHTML = '<div class="rp-empty">未来 60 天无事项</div>'; return; }
  // 版本名前缀（区间事项 short 缺前缀，补上以便看清是哪个版本）
  const verShort = (forVer) => { const v = VERSIONS.find(x=>x.id===forVer); return v ? v.name.replace('.0','') : ''; };
  box.innerHTML = evs.map(e => {
    const hint = TIME_HINT[e.tag] ? ` <span class="rp-tl-hint">· ${TIME_HINT[e.tag]}</span>` : '';
    if(e.range){
      const [rawStart,rawEnd] = e.range;
      const state = rawStart < TODAY && rawEnd >= TODAY ? ' · 进行中' : '';
      const label = `${verShort(e.forVer)} ${e.short}`.trim();
      return `<div class="rp-tl-item ${e.tag}">
        <div class="rp-tl-dot evt-${e.tag}"></div>
        <div class="rp-tl-body">
          <div class="rp-tl-date">${fmtShort(rawStart)} → ${fmtShort(rawEnd)}${state}${hint}</div>
          <div class="rp-tl-label evt-${e.tag}">${label}</div>
        </div>
      </div>`;
    }
    const dd = e.date;
    // 6 节点 short 已带 →版本名 前缀，只去掉箭头保留版本名
    const label = e.short.replace(/^→/, '');
    return `<div class="rp-tl-item ${e.tag}">
      <div class="rp-tl-dot evt-${e.tag}"></div>
      <div class="rp-tl-body">
        <div class="rp-tl-date">${fmt(dd)} <span class="rp-tl-wk">周${'日一二三四五六'[dd.getDay()]}</span>${hint}</div>
        <div class="rp-tl-label evt-${e.tag}">${label}</div>
      </div>
    </div>`;
  }).join('');
}

// 版本进度卡：当前版本 + 后续 2 个版本，进度% + 下一节点工作日倒计时（排除周末与中国法定节假日）
function renderProgress(){
  const box = document.getElementById('rpProgress');
  // 「当前 + 后 2 个」= 按发布时间顺序，dev 段尚未结束（或即将开始）的前 3 个非 planned 版本
  const vers = VERSIONS.filter(v => {
    if(v.planned) return false;
    const lastPh = v.phases[v.phases.length-1];
    return d(lastPh.end) >= TODAY; // 尚未完全结束
  }).slice(0, 3);
  if(!vers.length){ box.innerHTML = '<div class="rp-empty">暂无进行中版本</div>'; return; }
  box.innerHTML = vers.map(ver => {
    const firstPh = ver.phases[0], lastPh = ver.phases[ver.phases.length-1];
    const s = d(firstPh.start), e = d(lastPh.end);
    const total = diffDays(s,e) || 1;
    const elapsed = diffDays(s, TODAY);
    const pct = Math.max(0, Math.min(100, Math.round(elapsed/total*100)));
    const nev = EVENTS.filter(ev => ev.forVer===ver.id && ev.date>=TODAY && eventVisible(ev))
                       .sort((a,b)=>a.date-b.date)[0];
    const cd = nev ? workingDaysUntil(TODAY, nev.date) : null;
    return `<div class="rp-pg-card">
      <div class="rp-pg-head"><span class="rp-pg-name">${ver.name}</span><span class="rp-pg-pct">${pct}%</span></div>
      <div class="rp-pg-bar"><div class="rp-pg-fill" style="width:${pct}%"></div></div>
      <div class="rp-pg-next">${nev ? `下一节点 · ${nev.short} · ${cd}个工作日后` : '无后续节点'}</div>
    </div>`;
  }).join('');
}

    tt.classList.add('show');
    clearTimeout(tt._hideTt);
    tt._hideTt = setTimeout(()=>tt.classList.remove('show'), 2800);
    return;
  }
  const msCell = e.target.closest('.yc-ms');
  if(msCell){
    const verName = msCell.querySelector('.ms-ver')?.textContent;
    const ver = VERSIONS.find(v => v.name === verName);
    if(ver) showDetail(ver);
  }
});
document.addEventListener('click', ()=>tt.classList.remove('show'));

// ================================================================
// DAY-CELL CALENDAR — 单版本切片：行=版本×阶段的每周（4子行）× 列=周一~周日
// ================================================================
function scrollToTodayDay(){
  const el = document.querySelector('.day-table td.td-date.today');
  if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
}

function renderDayView(){
  const thead = document.getElementById('dayHead');
  const tbody = document.getElementById('dayBody');
  const ver = VERSIONS.find(v=>v.id===activeVerId);
  if(!ver){
    thead.innerHTML='';
    tbody.innerHTML='<tr><td colspan="10" style="text-align:center;color:var(--c-text-mute);padding:32px">请选择版本</td></tr>';
    return;
  }

  // Header: 年度 | 版本节点 | 分工 | 周一~周日
  thead.innerHTML = '<tr>'
    + '<th class="th-year">年度</th>'
    + '<th class="th-phase">版本节点</th>'
    + '<th class="th-role">分工</th>'
    + '<th class="th-day">周一</th>'
    + '<th class="th-day">周二</th>'
    + '<th class="th-day">周三</th>'
    + '<th class="th-day">周四</th>'
    + '<th class="th-day">周五</th>'
    + '<th class="th-day weekend">周六</th>'
    + '<th class="th-day weekend">周日</th>'
    + '</tr>';

  tbody.innerHTML = '';
  const todayTs = new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate()).getTime();

  // 单版本视图：第一列年度贯穿全部行，取 release 阶段年份
  const relPh0 = ver.phases.find(p=>p.type==='release') || ver.phases[ver.phases.length-1];
  const dayVerYear = d(relPh0.start).getFullYear();
  // 预算所有 phase 的周数（用于年度列 rowSpan）
  let dayTotalWeeks = 0;
  for(const ph2 of ver.phases){
    const ps2 = d(ph2.start), pe2 = d(ph2.end);
    const wkMon2 = mondayOf(ps2);
    const wkEndRaw2 = new Date(pe2);
    const fwd2 = (7 - pe2.getDay()) % 7;
    if(fwd2 > 0) wkEndRaw2.setDate(wkEndRaw2.getDate() + fwd2);
    let cur2 = new Date(wkMon2), n=0;
    while(cur2 <= wkEndRaw2){ n++; cur2.setDate(cur2.getDate()+7); }
    dayTotalWeeks += n;
  }
  const dayTotalRows = dayTotalWeeks * 4;
  let dayYearInserted = false; // 首行插入 rowspan 单元格后即置 true

  for(const ph of ver.phases){
    const ps = d(ph.start), pe = d(ph.end);
    const wkMon = mondayOf(ps);
    const wkEndRaw = new Date(pe);
    const fwd = (7 - pe.getDay()) % 7;
    if(fwd > 0) wkEndRaw.setDate(wkEndRaw.getDate() + fwd);

    // Collect weeks (Mondays) covered by this phase
    const weeks = [];
    let cur = new Date(wkMon);
    while(cur <= wkEndRaw){ weeks.push(new Date(cur)); cur.setDate(cur.getDate()+7); }
    if(!weeks.length) continue;

    for(let wi=0; wi<weeks.length; wi++){
      const mon = weeks[wi];
      const wkIdx = Math.round((mon.getTime() - wkMon.getTime())/86400000/7);
      // 「节点周免节假日」：仅当本周含任何事件（会议/critical，受角色关注过滤）时，整周不显示节假日。
      // （dev 末两周不再特殊豁免，按真实节假日数据正常显示）
      const wkSunLocal = new Date(mon.getTime() + 6*86400000);
      const hasEventInWeek = eventsInRange(mon, wkSunLocal).some(ev => eventVisible(ev));
      const suppressHoliday = hasEventInWeek;
      const rows = []; // 4 rows per week
      // Row 1: phase label (only on first row of first week per phase — spans all 4 rows × N weeks? too much. simpler: label repeats per week)
      const tr1 = document.createElement('tr'); // date row
      // 年度列 · 仅在最顶行插入一次，rowSpan=全表行数
      if(!dayYearInserted){
        const tdY = document.createElement('td');
        tdY.className = 'td-year';
        tdY.rowSpan = dayTotalRows;
        tdY.innerHTML = `<div class="dy-year">${dayVerYear}</div>`;
        tr1.appendChild(tdY);
        dayYearInserted = true;
      }
      if(wi===0){
        const tdP = document.createElement('td');
        tdP.className = 'td-phase pd-' + ph.type;
        tdP.rowSpan = weeks.length * 4;
        tdP.innerHTML = `<div class="p-ver">${ver.name}</div><div class="p-name">${ph.label}</div><div class="p-wk">${ph.weeks}w</div>`;
        tr1.appendChild(tdP);
      }
      // 空白角色列（日期行的分工格留空，做上下分区）
      const tdRoleEmpty = document.createElement('td');
      tdRoleEmpty.className = 'td-role';
      tdRoleEmpty.style.background = 'var(--c-bg-0)';
      tr1.appendChild(tdRoleEmpty);
      // 7 日期格
      for(let di=0; di<7; di++){
        const day = new Date(mon.getTime() + di*86400000);
        const isToday = day.getTime() === todayTs;
        const isWeekend = di>=5;
        const hol = suppressHoliday ? null : holidayOnDay(day);
        const td = document.createElement('td');
        let cls = 'td-date' + (isToday?' today':'') + (isWeekend?' weekend':'') + (hol?' holiday':'');
        td.className = cls;
        const dateStr = `${day.getFullYear()}/${day.getMonth()+1}/${day.getDate()}`;
        td.innerHTML = hol
          ? `<div class="td-date-num">${dateStr}</div><div class="td-date-hol">${hol.short}</div>`
          : dateStr;
        if(hol) td.title = hol.label;
        tr1.appendChild(td);
      }
      tbody.appendChild(tr1);

      // Row 2/3/4: 文案 / 音频 / PM
      const roles = [
        { key:'cn',    label:'文案', cls:'role-cn' },
        { key:'audio', label:'音频', cls:'role-audio' },
        { key:'pm',    label:'PM',   cls:'role-pm' },
      ];
      for(const r of roles){
        const tr = document.createElement('tr');
        const tdR = document.createElement('td');
        tdR.className = 'td-role ' + r.cls;
        tdR.textContent = r.label;
        tr.appendChild(tdR);
        for(let di=0; di<7; di++){
          const day = new Date(mon.getTime() + di*86400000);
          const isToday = day.getTime() === todayTs;
          const isWeekend = di>=5;
          const hol = suppressHoliday ? null : holidayOnDay(day);
          const ts = day.getTime();
          const td = document.createElement('td');
          let cls = 'td-slot empty';
          if(isToday)  cls += ' today';
          if(isWeekend)cls += ' weekend';
          if(hol)      cls += ' holiday';
          td.className = cls;
          td.dataset.date = `${day.getFullYear()}/${day.getMonth()+1}/${day.getDate()}`;
          td.dataset.role = r.key;
          td.dataset.ver = ver.id;
          td.dataset.phase = ph.type;
          if(hol) td.title = hol.label;
          // 匹配当日事件（按 role + 角色关注过滤）
          const dayEvts = eventsOnDay(day).filter(e => e.roles && e.roles.includes(r.key) && eventVisible(e));
          if(dayEvts.length){
            cls = cls.replace(' empty','');
            td.className = cls;
            td.innerHTML = dayEvts.map(e => `<span class="evt-chip evt-${e.tag}" title="${e.full}">${e.short.replace(/^→/,'')}</span>`).join('');
          }
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
    }
  }
}
