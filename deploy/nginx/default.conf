# ============================================================
# Vo Manager · Nginx（HTTPS 优先 + 安全响应头）
# 证书路径（容器内）：/etc/nginx/certs/fullchain.pem / privkey.pem
# 获取方式见 deploy/HTTPS.md：
#   - 公网域名：certbot 签发（Let's Encrypt）
#   - 内网/VPN：自签或企业 CA，浏览器需信任
# ============================================================

# ---- 80：仅做 301 跳转 + ACME 挑战，不提供业务 ----
server {
    listen 80 default_server;
    server_name _;

    # Let's Encrypt 验证目录（certbot 用，放行不跳 HTTPS）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # 其余一律跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- 443：HTTPS 业务 ----
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 100M;
    server_tokens off;

    # 安全响应头（HTTPS 上启用 HSTS）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; media-src 'self' blob:" always;

    # 前端静态
    root /usr/share/nginx/html;
    index vo-manager-refined.html index.html;

    # HTML 不缓存（外壳每次都重新拉取，避免改了看不到）
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ =404;
    }

    # 根路径重定向到主页面
    location = / {
        return 302 /vo-manager-refined.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 后端 API 反代（透传真实协议，便于后端安全头判断）
    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # 音频资源
    location /audio/ {
        proxy_pass http://backend:3001/audio/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
