/* ===== 筛选栏动态渲染：角色视图=大类 / 需求视图=AREA（带数量） ===== */
function renderFilterBar(){
  var g = document.getElementById('actorDimGroup');
  if(!g) return;
  if(ACTOR_STATE.vmode === 'demand'){
    /* 需求视图：AREA 维度，从数据中统计数量 */
    var all = ACTOR_STATE.demands || [];
    var areaCnt = {};
    var total = 0;
    all.forEach(function(d){
      var a = d.area || '未分类';
      areaCnt[a] = (areaCnt[a]||0) + 1;
      total++;
    });
    // 固定顺序：SOL / 大战场 / 系统 / 商业化 / 干员 / 其余按名称
    var AREA_ORDER = ['SOL','大战场','系统','商业化','干员'];
    var ordered = [];
    AREA_ORDER.forEach(function(a){ if(areaCnt[a]) ordered.push(a); });
    Object.keys(areaCnt).forEach(function(a){ if(ordered.indexOf(a)<0) ordered.push(a); });
    var label = '<span class="tb-label">AREA</span>';
    var pills = '';
    // 全部 pill
    var isAllOn = !ACTOR_STATE.area || ACTOR_STATE.area === 'all';
    pills += '<button class="tb-btn'+(isAllOn?' on':'')+'" data-area="all" onclick="setActorArea(\'all\',this)">全部 <span class="dim-count">'+total+'</span></button>';
    // 各 AREA pill
    ordered.forEach(function(a){
      var c = areaCnt[a] || 0;
      var isOn = ACTOR_STATE.area === a;
      pills += '<button class="tb-btn'+(isOn?' on':'')+'" data-area="'+escHtmlSafe(a)+'" onclick="setActorArea(\''+escHtmlSafe(a)+'\',this)">'+escHtmlSafe(a)+' <span class="dim-count">'+c+'</span></button>';
    });
    g.innerHTML = label + pills;
  } else {
    /* 角色视图：大类维度（按数据动态统计角色去重数，2026-09-07 用户定稿） */
    var rows = ACTOR_STATE.estimates || [];
    var seenByCat = {'指挥官':{}, '干员':{}, 'Boss':{}, 'AI兵':{}, 'NPC':{}, 'AI系统音':{}};
    var seenAll = {};
    var catCnt = {'指挥官':0, '干员':0, 'Boss':0, 'AI兵':0, 'NPC':0, 'AI系统音':0};
    var total = 0;
    rows.forEach(function(r){
      var role = String(r.role_name || r.role || '').trim();
      var cat = String(r.category || '').trim();
      if(!role) return;
      if(cat && catCnt.hasOwnProperty(cat) && !seenByCat[cat][role]){
        seenByCat[cat][role] = 1;
        catCnt[cat]++;
      }
      if(!seenAll[role]){
        seenAll[role] = 1;
        total++;
      }
    });
    var label = '<span class="tb-label">大类</span>';
    var pills = '<button class="tb-btn'+(ACTOR_STATE.cat==='all'?' on':'')+'" data-cat="all" onclick="setActorCat(\'all\',this)">全部 <span class="dim-count">'+total+'</span></button>';
    ['指挥官','干员','Boss','AI兵','NPC','AI系统音'].forEach(function(c){
      var isOn = ACTOR_STATE.cat === c;
      pills += '<button class="tb-btn'+(isOn?' on':'')+'" data-cat="'+c+'" onclick="setActorCat(\''+c+'\',this)">'+c+' <span class="dim-count">'+catCnt[c]+'</span></button>';
    });

    g.innerHTML = label + pills;
  }
}

// 判断点击是否落在「空白处」：非控件、非内容、非日期/条目 → 可恢复默认总计
function isBlankAreaClick(el){
  if(!el) return false;
  if(el === document.body || el === document.documentElement) return true;
  if(el.nodeType !== 1) return false;
  var t = el.tagName;
  // 命中任何控件/图标（含其内部 svg/path/line/rect 等子元素）→ 一律不算空白
  if(t === 'BUTTON' || t === 'A' || t === 'INPUT' || t === 'SELECT' || t === 'TEXTAREA') return false;
  if(t === 'SVG' || t === 'PATH' || t === 'LINE' || t === 'RECT' || t === 'CIRCLE' || t === 'POLYLINE' || t === 'POLYGON' || t === 'G') return false;
  // 命中任何交互元素（按钮、可点击 data 属性、卡片、pill、chip、tab、legend 等）→ 不算空白
  if(el.closest && el.closest('[data-vmode],[data-area],[data-cat],[data-gender],[data-lang-pill],[data-ymd],[onclick],.tb-btn,.filter-pill,.actor-toolbar,.demand-toolbar,.mp-cal-day,.mp-up-item,.risk-banner,.risk-stat,.risk-area-pill,.area-pend-badge,.deadline-meta,.page-title,.eyebrow,.brand-bar,.nav-item,.actor-lines-total,.actor-stat')) return false;
  return true;
}

async function loadActorData(){
  let arr = [];
  let talents = [];
  try{
    const r = await fetch('/api/demands', {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    arr = Array.isArray(j) ? j : (j.data || []);
  }catch(e){
    arr = [];
  }
  // 拉取声优库（/api/talents = voice_roles）用于 role→大类 映射
  try{
    const t = await fetch('/api/talents', {cache:'no-store'});
    if(t.ok){ const j = await t.json(); talents = Array.isArray(j) ? j : (j.data || []); }
  }catch(e){ talents = []; }
  // 角色需求明细：腾讯文档真源的 MySQL 查询镜像；角色卡只展示这里有记录的角色。
  try{
    const v = await fetch('/api/voice-estimates', {cache:'no-store'});
    if(v.ok){ const j=await v.json(); ACTOR_STATE.estimates=Array.isArray(j.rows)?j.rows:[]; }
    else ACTOR_STATE.estimates=[];
  }catch(e){ ACTOR_STATE.estimates=[]; }
  // web 端预估单列（默认按 language='cn' 存）；为让「英文声优」看板也承接同一批角色，
  // 在客户端为每条 cn 预估派生一条 language='en' 影子行——声优/状态/日期都由 sheet 快照回填。
  try{
    const cnOnly = (ACTOR_STATE.estimates||[]).filter(r => normLang(r.language)==='cn');
    const enShadow = cnOnly.map(r => Object.assign({}, r, { language:'en', _shadow:true }));
    ACTOR_STATE.estimates = cnOnly.concat(enShadow);
  }catch(e){}
  // 从台词库汇总表拉「3.录制档期」快照（Vomi 拥有的 release 实例）：
  //  → GET /api/schedule-from-sheet?release=<current>
  //  返回结构：{ok, release, records:[{category, role_cn, va_cn, va_en, status_cn, status_en, date_cn, date_en, location, ...}], fetched_at}
  //  按 (category, role_cn) 归入 ACTOR_STATE.sheetSchedule 用于 aggregateActors 覆盖 actor/status/date
  ACTOR_STATE.sheetSchedule = [];
  ACTOR_STATE.sheetFetchedAt = '';
  try{
    const rel = ACTOR_STATE.release || 'Yang1.0';
    const s = await fetch('/api/schedule-from-sheet?release=' + encodeURIComponent(rel), {cache:'no-store'});
    if(s.ok){
      const sj = await s.json();
      ACTOR_STATE.sheetSchedule = Array.isArray(sj.records) ? sj.records : [];
      ACTOR_STATE.sheetFetchedAt = sj.fetched_at || '';
    }
  }catch(e){ ACTOR_STATE.sheetSchedule = []; }
  // 虚拟数据兜底：仅 file:// 本地预览注入；线上保持真实数据（空则空态）2026-08-31
  // 2026-09-03：mock 数据不做 releaseInScope 过滤 —— file:// 下 release 日历无法加载
  //（fetch 不可用 → cachedPlans 空 → isAtOrAfterCached 恒 false），若过滤会把 mock 全清空。
  // mock 本身受「file:// + FORCE_SCHED_MOCK」双重开关保护，线上永不触达此分支。
  const usedMockDemands = window.FORCE_SCHED_MOCK && (!arr || !arr.length);
  if(usedMockDemands) arr = buildMockDemands();
  setRoleCategoryMap(talents);
  ACTOR_STATE.demands = usedMockDemands ? arr : arr.filter(releaseInScope);
  if(usedMockDemands && !ACTOR_STATE.estimates.length){
    ACTOR_STATE.estimates=[];
    ACTOR_STATE.demands.forEach(d=>(d.voice_estimates||[]).forEach(v=>{
      if(v.cn_va)ACTOR_STATE.estimates.push({demand_id:d.id,release_plan:d.release_plan,language:'cn',category:v.category,role_name:v.role,estimated_lines:Number(v.est_lines)||0,actual_lines:0,match_status:'exact'});
      if(v.en_va)ACTOR_STATE.estimates.push({demand_id:d.id,release_plan:d.release_plan,language:'en',category:v.category,role_name:v.role,estimated_lines:Number(v.est_lines)||0,actual_lines:0,match_status:'exact'});
    }));
  }
  ACTOR_STATE.loaded = true;
  renderFilterBar();
  renderActorRollup();
  // sheet 快照加载完成后，同步刷新侧栏（预约进度/录制日历/即将录制）——
  // 侧栏一开始只监听 /api/schedules（正式发布），台词库回填链路依赖 ACTOR_STATE.sheetSchedule 就绪后重绘。
  if(typeof window.renderSched === 'function'){
    try{ window.renderSched(); }catch(_){}
  }
}

// 返回 [{role, lang, actor, covers:[{story,est}], total, status}, ...]
function aggregateActorsLegacy(demands, release){
  const map = new Map();  // key = lang + '|' + role
  demands.forEach(dem => {
    if((dem.release_plan||'') !== release) return;
    let ves = dem.voice_estimates;
    if(typeof ves === 'string'){ try{ ves = JSON.parse(ves); }catch(_){ ves = []; } }
    if(!Array.isArray(ves)) return;
    ves.forEach(v => {
      const role  = (v.role || '').trim() || '(未指定角色)';
      const cat   = categoryOf(v) || 'NPC';
      const gender = String(v.gender || '').trim();
      const est   = parseInt(v.est_lines || v.est || 0, 10) || 0;
      const story = (dem.task_name || '').trim();
      // 中配
      const cn = (v.cn_va || '').trim();
      if(cn && cn !== 'N/A'){
        const k = 'cn|' + role;
        if(!map.has(k)) map.set(k, { role, category: cat, gender, lang: 'cn', actor: cn, covers: [], total: 0, status: 'pending' });
        const g = map.get(k);
        if(!g.gender && gender) g.gender = gender;
        if(g.actor.indexOf(cn) < 0) g.actor = g.actor ? (g.actor + ' / ' + cn) : cn;
        g.covers.push({ story, est });
        g.total += est;
      }
      // 英配
      const en = (v.en_va || '').trim();
      if(en && en !== 'N/A'){
        const k = 'en|' + role;
        if(!map.has(k)) map.set(k, { role, category: cat, gender, lang: 'en', actor: en, covers: [], total: 0, status: 'pending' });
        const g = map.get(k);
        if(!g.gender && gender) g.gender = gender;
        if(g.actor.indexOf(en) < 0) g.actor = g.actor ? (g.actor + ' / ' + en) : en;
        g.covers.push({ story, est });
        g.total += est;
      }
    });
  });
  // “已约”只认recording_schedules正式数据；未发布草稿不参与。
  // 同时为每个 (lang, role) 找一条最近档期（含 date/slot/start_time/end_time）用于左右双轨制展示
  const sched = window.PUBLISHED_SCHEDULES || [];
  const bookedRoles = new Set();
  const scheduleByKey = {};      // key = 'lang|role' -> 最近一档（保留兼容 formatScheduleLabel）
  const schedulesByKey = {};     // key = 'lang|role' -> 全量档期数组（按 date 升序）
  sched.forEach(s => {
    const lang = s.lang === '英配' ? 'en' : 'cn';
    (s.roles || []).forEach(r => bookedRoles.add(lang + '|' + r));
    if(s.role_cn) bookedRoles.add('cn|' + s.role_cn);
    if(s.role_en) bookedRoles.add('en|' + s.role_en);
    if(s.role)    bookedRoles.add(lang + '|' + s.role);
    // 归组：一个 (lang, role) 可能有多档
    const keys = [];
    if(s.role_cn) keys.push('cn|' + s.role_cn);
    if(s.role_en) keys.push('en|' + s.role_en);
    if(s.role){
      const lg = (s.lang==='英配'?'en':'cn');
      keys.push(lg + '|' + s.role);
    }
    const entry = {
      date: s.date || '',
      slot: s.slot || s.time_slot || '',
      start_time: s.start_time || '',
      end_time:   s.end_time || '',
      studio: s.studio || ''
    };
    keys.forEach(k => {
      if(!schedulesByKey[k]) schedulesByKey[k] = [];
      schedulesByKey[k].push(entry);
      // scheduleByKey 保留最近一档兼容旧调用
      const cur = scheduleByKey[k];
      if(!cur || (entry.date||'') > (cur.date||'')){
        scheduleByKey[k] = entry;
      }
    });
  });
  // 按日期升序 + 去重
  Object.keys(schedulesByKey).forEach(k => {
    const seen = new Set();
    schedulesByKey[k] = schedulesByKey[k]
      .filter(x => { const sig = x.date+'|'+x.start_time+'|'+x.end_time; if(seen.has(sig)) return false; seen.add(sig); return true; })
      .sort((a,b) => (a.date||'').localeCompare(b.date||''));
  });
  const list = [...map.values()];
  list.forEach(a => {
    const k = a.lang + '|' + a.role;
    if(bookedRoles.has(k)) a.status = 'booked';
    a.schedule = scheduleByKey[k] || null;
    a.schedules = schedulesByKey[k] || []; // ← 新增：全量档期数组
  });
  list.sort((a,b) => b.total - a.total);
  return list;
}

// v2：角色明细表驱动；只展示当前版本角色明细中有记录的角色。
function aggregateActors(demands, release){
  const demandMap=new Map((demands||[]).map(d=>[String(d.id),d]));
  const map=new Map();
  const rows=(ACTOR_STATE.estimates||[]).filter(r=>normReleaseToken(r.release_plan)===normReleaseToken(release));
  rows.forEach(r=>{
    const role=String(r.role_name||r.role||'').trim(); const lang=normLang(r.language); if(!role||!lang)return;
    const k=lang+'|'+role, d=demandMap.get(String(r.demand_id))||{};
    const meta=ROLE_META_MAP.get(role)||{};
    if(!map.has(k)) map.set(k,{role,category:r.category||meta.module||'未匹配',gender:meta.gender||'',lang,actor:lang==='en'?(meta.en_va||''):(meta.cn_va||''),covers:[],total:0,actual:0,delivered:0,demandTotal:0,unmatched:0,status:'pending'});
    const g=map.get(k); const est=Number(r.estimated_lines)||0; const act=Number(r.actual_lines)||0; const st=String(d.manual_status||'待澄清');
    g.covers.push({story:d.task_name||'',est,actual:act,status:st,demandId:r.demand_id}); g.total+=est; g.demandTotal++;
    if(['已交稿','Vo ing','Done'].includes(st)){g.actual+=act;g.delivered++;}
    if(r.match_status==='unmatched')g.unmatched++;
  });
  const schedules=window.PUBLISHED_SCHEDULES||[];
  // 台词库表格快照（3.录制档期页）—— 按 (category|role_cn) 建索引，用于覆盖 actor/status/date
  const sheetRecs = ACTOR_STATE.sheetSchedule || [];
  const sheetMap = new Map();
  sheetRecs.forEach(rec => {
    const cat = String(rec.category||'').trim();
    const rc = String(rec.role_cn||'').trim();
    if(!rc) return;
    sheetMap.set(cat + '|' + rc, rec);
    // 无 category 兜底：允许仅按 role_cn 匹配
    if(!sheetMap.has('|' + rc)) sheetMap.set('|' + rc, rec);
  });
  const list=[...map.values()];
  list.forEach(g=>{
    // ① 先取 /api/schedules 的正式排期（真人已经在录制档期页发布过）
    const matched=schedules.filter(s=>{
      const sl=normLang(s.lang||s.language)||(s.role_en?'en':'cn');
      const roles=[s.role,s.role_cn,s.role_en].concat(Array.isArray(s.roles)?s.roles:[]).map(x=>String(x||'').trim());
      return sl===g.lang&&roles.includes(g.role);
    }).map(s=>({date:s.date||s.record_date||'',slot:s.slot||s.time_slot||'',start_time:s.start_time||'',end_time:s.end_time||'',studio:s.studio||''})).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
    g.schedules=matched;g.schedule=matched[0]||null;g.status=matched.length?'booked':'pending';
    // ② 无正式排期时，回落到台词库表格快照的声优/状态/日期
    if(!matched.length){
      const hit = sheetMap.get((g.category||'')+'|'+g.role) || sheetMap.get('|'+g.role);
      if(hit){
        const va = g.lang==='en' ? (hit.va_en||'') : (hit.va_cn||'');
        const st = g.lang==='en' ? (hit.status_en||'') : (hit.status_cn||'');
        const dt = g.lang==='en' ? (hit.date_en||'') : (hit.date_cn||'');
        if(va && va !== 'N/A') g.actor = va;
        const bucket = schedStatusBucket(st);
        if(bucket === 'full' || bucket === 'partial'){
          g.status = 'booked';
          g.schedule = { date: dt || '', slot: '', start_time:'', end_time:'', studio: hit.location || '' };
          g.schedules = [g.schedule];
        }
        g.sheetStatus = st;
        g.sheetLocation = hit.location || '';
      }
    }
    g.deviation=deviationState(g.total,g.actual,{delivered:g.delivered,total:g.demandTotal});
  });
  list.sort((a,b)=>(CAT_ORDER[a.category]||99)-(CAT_ORDER[b.category]||99)||b.total-a.total||a.role.localeCompare(b.role,'zh-CN'));
  return list;
}
function deviationState(estimated,actual,progress){
  const est=Math.max(0,Number(estimated)||0),act=Math.max(0,Number(actual)||0),total=Number(progress&&progress.total)||0,delivered=Number(progress&&progress.delivered)||0;
  if(total>0&&delivered===0)return {kind:'waiting',label:'待交稿'};
  if(est===0&&act>0)return {kind:'unestimated',label:'未预估'};
  const value=act-est,percent=est>0?value/est:0;
  if(value<0)return {kind:'negative',label:String(value)};
  if(percent>.3)return {kind:'over',label:'+'+value};
  return {kind:'normal',label:value>0?'+'+value:String(value)};
}

// 按需求视图聚合：1 行 = 需求 × 演员 × 语种
function aggregateByDemandLegacy(demands, release){
  const map = new Map(); // key = demandId|lang|role
  const sched = window.PUBLISHED_SCHEDULES || [];
  // 简化版：复用 aggregateActors 找 schedule
  const flat = aggregateActors(demands, release);
  demands.forEach(dem => {
    if((dem.release_plan||'') !== release) return;
    let ves = dem.voice_estimates;
    if(typeof ves === 'string'){ try{ ves = JSON.parse(ves); }catch(_){ ves = []; } }
    const story = (dem.task_name || '').trim() || ('需求 ' + dem.id);
    const area  = String(dem.area || '').trim();
    // ★ 骨架占位（2026-09-03）：需求尚未同步声优预估时，仍产出 1 条占位行，
    //   让 AREA 分组与需求卡骨架照常渲染，便于在无数据阶段验证框架。
    //   占位行不参与待约数 / 完成度 / 角色构成统计（下游按 isPlaceholder 过滤）。
    if(!Array.isArray(ves) || ves.length === 0){
      map.set('PLACEHOLDER|' + (dem.id||''), {
        demandId: dem.id,
        area: area,
        story: story,
        lang: '',
        role: '',
        category: '',
        actor: '',
        est: 0,
        schedule: null,
        status: 'placeholder',
        isPlaceholder: true
      });
      return;
    }
    ves.forEach(v => {
      const role  = (v.role || '').trim() || '(未指定角色)';
      const est   = parseInt(v.est_lines || v.est || 0, 10) || 0;
      [['cn', v.cn_va], ['en', v.en_va]].forEach(([lang, actor]) => {
        const name = String(actor||'').trim();
        if(!name || name === 'N/A') return;
        const k = (dem.id||'') + '|' + lang + '|' + role;
        const found = flat.find(a => a.role === role && a.lang === lang);
        const schedInfo = found ? found.schedule : null;
        const status = found ? found.status : 'pending';
        map.set(k, {
          demandId: dem.id,
          area: area,
          story: story,
          lang: lang,
          role: role,
          category: categoryOf(v),
          actor: name,
          est: est,
          schedule: schedInfo,
          status: status
        });
      });
    });
  });
  const list = [...map.values()];
  // 排序：未约置顶 → 同需求 → 同语种；骨架占位行统一沉到最后
  list.sort((a,b) => {
    if(!!a.isPlaceholder !== !!b.isPlaceholder) return a.isPlaceholder ? 1 : -1;
    if((a.status==='pending') !== (b.status==='pending')) return a.status==='pending' ? -1 : 1;
    if(a.story !== b.story) return a.story < b.story ? -1 : 1;
    if(a.lang !== b.lang) return a.lang < b.lang ? -1 : 1;
    return b.est - a.est;
  });
  return list;
}

  const q = (document.getElementById('actorSearch').value || '').trim().toLowerCase();
  const list = all.filter(a => {
    // lang 仅在侧栏胶囊被点击时使用，主表按 role 合并展示时不过滤单条 flat（避免误伤对侧语种的角色）
    // → 现在保留：只看某语种时，仅显示"在该语种下有应约的角色"
    if(ACTOR_STATE.lang !== 'all' && a.lang !== ACTOR_STATE.lang) return false;
    if(ACTOR_STATE.status !== 'all' && a.status !== ACTOR_STATE.status) return false;
    if(ACTOR_STATE.cat !== 'all'){
      const c = (a.category || categoryOf(a.role) || '').trim();
      if(c !== ACTOR_STATE.cat) return false;
    }
    if(ACTOR_STATE.gender !== 'all'){
      const g = String(a.gender || genderOf(a.role) || '').toLowerCase();
      if(ACTOR_STATE.gender === 'male'   && !(g==='m'||g==='male'||g==='男')) return false;
      if(ACTOR_STATE.gender === 'female' && !(g==='f'||g==='female'||g==='女')) return false;
    }
    if(q){
      const hay = (a.role + ' ' + a.covers.map(c=>c.story).join(' ')).toLowerCase();
      if(hay.indexOf(q) < 0) return false;
    }
    return true;
  });

  const cnAll = list.filter(a=>a.lang==='cn');
  const enAll = list.filter(a=>a.lang==='en');
  const cnTotal = cnAll.length, cnBooked = cnAll.filter(a=>a.status==='booked').length;
  const enTotal = enAll.length, enBooked = enAll.filter(a=>a.status==='booked').length;
  const pendingN = list.filter(a=>a.status==='pending').length;
  // 风险公告：3 个业务核心数据点（品牌黄 + 透明度）+ 1 个时间维度
  // · 未约齐演员：至少 1 语种未约的 unique 角色数
  // · 缺少档期：当前未约的 (lang, role) 行数
  // · 受影响需求：至少 1 个 voice_estimate 角色未约的需求数
  const unalignedRoles = (function(){
    const m = new Set();
    list.forEach(a => { if(a.status==='pending') m.add(a.role); });
    return m.size;
  })();
  // 未预约角色名列表（用于副标题展示）
  const pendingRoleNames = (function(){
    const names = new Set();
    list.forEach(a => { if(a.status==='pending') names.add(a.role); });
    return Array.from(names);
  })();
  // 声优视图风险预警：按 game 角色大类（category）聚合待约角色数（角色去重）
  // · 同一角色在中+英两语种都 pending 也只算 1 位
  // · 与需求视图 AREA 口径镜像：pill 显示"角色名" + 圆形数字徽章
  const catPendingStats = (function(){
    const m = new Map(); // category -> Set<role>
    list.forEach(a => {
      if(a.status !== 'pending') return;
      const c = (a.category||'').trim() || '未分类';
      if(!m.has(c)) m.set(c, new Set());
      m.get(c).add(a.role);
    });
    const cnt = {};
    m.forEach((set, c) => { cnt[c] = set.size; });
    return { cnt };
  })();
  // 按语种拆分未约数
  const cnPendingN = list.filter(a=>a.lang==='cn' && a.status==='pending').length;
  const enPendingN = list.filter(a=>a.lang==='en' && a.status==='pending').length;
  const affectedDemands = (function(){
    const m = new Set();
    const pendingRoles = new Set(list.filter(a=>a.status==='pending').map(a=>a.lang+'|'+a.role));
    (ACTOR_STATE.estimates||[]).forEach(v=>{
      if(normReleaseToken(v.release_plan)!==normReleaseToken(ACTOR_STATE.release))return;
      const key=normLang(v.language)+'|'+String(v.role_name||'').trim();
      if(pendingRoles.has(key))m.add(v.demand_id);
    });
    return m.size;
  })();
  // ===== 需求视图专用：按 AREA 统计"未出完整档期"的需求数 =====
  const AREA_ORDER = ['SOL','大战场','系统','商业化','干员'];
  const areaPendingStats = (function(){
    const byDemand = aggregateByDemand(ACTOR_STATE.demands, ACTOR_STATE.release);
    // 需求维度：只要该需求有 >=1 行 pending，就算"尚未出完整档期"
    const pendMap = new Map(); // demandKey -> {area, story, pendingCount}
    byDemand.forEach(r => {
      const key = (r.demandId||'—') + '|' + (r.story||'');
      if(!pendMap.has(key)) pendMap.set(key, { area:(r.area||'未分类'), story:(r.story||''), pendingCount:0 });
      if(r.status === 'pending') pendMap.get(key).pendingCount++;
    });
    const pendDemands = [...pendMap.values()].filter(x => x.pendingCount > 0);
    // 按 AREA 计数
    const cnt = {};
    pendDemands.forEach(x => { cnt[x.area] = (cnt[x.area]||0) + 1; });
    // 待预约最多的需求名（按 pendingCount 降序，取前 3）
    const topNames = pendDemands
      .sort((a,b) => b.pendingCount - a.pendingCount)
      .slice(0,3)
      .map(x => x.story);
    return { total:pendDemands.length, cnt, topNames };
  })();
  const deliveryDate = deliveryDayOf(ACTOR_STATE.release);
  const workDaysLeft = workingDaysUntil(deliveryDate);
  let deliveryHtml = '—';
  if(deliveryDate && workDaysLeft !== null){
    if(workDaysLeft > 0)      deliveryHtml = String(workDaysLeft);
    else if(workDaysLeft === 0) deliveryHtml = '今天';
    else                      deliveryHtml = String(-workDaysLeft) + '↓';
  }
  const banner = document.getElementById('riskBanner');
  const title = document.getElementById('riskTitle');
  const sub = document.getElementById('riskSub');
  const stats = document.getElementById('riskStats');
  const areasEl = document.getElementById('riskAreas');
  const riskBtn = document.getElementById('riskAction');
  if(banner && title && sub && stats){
    if(ACTOR_STATE.vmode === 'demand'){
      // ===== 需求视图：按 AREA 口径 =====
      const ap = areaPendingStats;
      if(ap.total > 0){
        banner.classList.remove('calm');
        // 预设顺序优先，数据里出现但不在预设内的 AREA 追加在后面（避免漏统计）
        const extraAreas = Object.keys(ap.cnt).filter(a => AREA_ORDER.indexOf(a) < 0);
        const order = AREA_ORDER.concat(extraAreas).filter(a => (ap.cnt[a]||0) > 0);
        // AREA 圆框 pill（圆角矩形 = 圆框框）—— AREA 名在前，圆形数字徽章加尾后强化"标出来"
        if(areasEl){
          if(order.length){
            areasEl.innerHTML = order.map(a =>
              `<span class="risk-area-pill">${escHtmlSafe(a)}<span class="num">${ap.cnt[a]}</span></span>`
            ).join('');
            areasEl.hidden = false;
          } else {
            areasEl.innerHTML = '';
            areasEl.hidden = true;
          }
        }
        title.textContent = `风险预警 · ${ap.total} 个需求尚未出完整录制档期`;
        const nameTxt = ap.topNames.length
          ? ap.topNames.map(n => escHtmlSafe(n)).join('、')
          : '—';
        sub.innerHTML = `${nameTxt} 需要音频尽快确认预约`;
      } else {
        banner.classList.add('calm');
        if(areasEl){ areasEl.innerHTML = ''; areasEl.hidden = true; }
        title.textContent = '全部需求档期已出齐';
        sub.innerHTML = '当前版本所有需求的录制档期均已排期完成。';
      }
    } else if(pendingN > 0){
      // ===== 声优视图：按 game 角色大类（category）口径，镜像需求视图 AREA =====
      banner.classList.remove('calm');
      const cp = catPendingStats;
      if(areasEl){
        // 预设大类顺序（与侧栏 tab 顺序一致），非预设项追加在末
        const CAT_ORDER = ['指挥官','干员','Boss','AI兵','NPC','AI系统音'];
        const extras = Object.keys(cp.cnt).filter(c => CAT_ORDER.indexOf(c) < 0);
        const order = CAT_ORDER.concat(extras).filter(c => (cp.cnt[c]||0) > 0);
        if(order.length){
          areasEl.innerHTML = order.map(c =>
            `<span class="risk-area-pill">${escHtmlSafe(c)}<span class="num">${cp.cnt[c]}</span></span>`
          ).join('');
          areasEl.hidden = false;
        } else {
          areasEl.innerHTML = '';
          areasEl.hidden = true;
        }
      }
      title.textContent = `风险预警 · ${unalignedRoles} 位声优尚未预约档期（中配 ${cnPendingN} ，英配 ${enPendingN} ）`;
      sub.innerHTML = '录制时间需要音频同学尽快确认';
    } else {
      banner.classList.add('calm');
      if(areasEl){ areasEl.innerHTML = ''; areasEl.hidden = true; }
      title.textContent = '全部声优档期已确认';
      sub.innerHTML = `当前版本共 ${cnTotal+enTotal} 位应约的中英配档期均已排期完成。`;
    }
    // 独立 stat 卡片（2026-09-07 卡片分离）：banner 谈「谁没约」，stat 卡片谈「影响多大」
    // 卡片自身带 warn/ok 类决定左边竖条颜色（黄=有影响 / 绿=已无虞），不再依赖 banner 的 calm 态联级
    const affectedCls = pendingN > 0 ? 'warn' : 'ok';
    stats.innerHTML = `
      <div class="risk-stat ${affectedCls}"><div class="k">受影响需求</div><div class="v">${affectedDemands}<span class="unit">个</span></div></div>
      <div class="risk-stat"><div class="k">距 VO 资源交付</div><div class="v">${deliveryHtml}<span class="unit">工作日</span></div></div>
    `;
  }
  // 保留旧 actorStatStrip 兼容（如有其它地方引用，避免报错）
  const oldStrip = document.getElementById('actorStatStrip');
  if(oldStrip) oldStrip.innerHTML = '';

  // 分发到两个视图
  if(ACTOR_STATE.vmode === 'role')   renderActorRoleTable();
  if(ACTOR_STATE.vmode === 'demand') renderActorDemandTable();
  // 主表重渲染后恢复日历 focus 的高亮（保证筛选/搜索不打断联动）
  if(typeof window.applyMidFocus === 'function'){
    try{ window.applyMidFocus(); }catch(_){}
  }

  const actorTabHintEl = document.getElementById('actorTabHint');
  if(actorTabHintEl) actorTabHintEl.textContent = pendingN ? `${pendingN} 未约` : '';
  // 同步刷新顶栏「录制档期截止」药丸（release 状态变更后）
  try{ renderScheduleDeadline(); }catch(_){}
}

// 格式化档期时间：从 schedule 渲染 "9/08 14:00-18:00" 或 fallback "9/08 上午"
function formatScheduleLabel(s){
  if(!s) return '';
  var d = s.date || '';
  var md = '';
  if(d){
    var p = d.split('-');
    if(p.length === 3) md = parseInt(p[1],10) + '/' + parseInt(p[2],10);
    else md = d;
  }
  var st = s.start_time || '';
  var et = s.end_time || '';
  if(st && et) return { date: md, time: st + '-' + et };
  if(s.slot) return { date: md, time: s.slot };
  return { date: md, time: '' };
}

// 判断某档期条目在指定日期是否有录制（日期 focus 真过滤用）
function itemHasSlotOn(item, ymd){
  if(!ymd) return true;
  if(!item) return false;
  var arr = (item.schedules && Array.isArray(item.schedules) && item.schedules.length)
    ? item.schedules
    : (item.schedule ? [item.schedule] : []);
  if(!arr.length) return false;
  return arr.some(function(s){ return s && s.date && String(s.date).slice(0,10) === ymd; });
}

// 通用 6 看板渲染（2026-09-03 用户定稿：声优视图与需求视图统一为「按语种 × 3 状态」6 块向下看板）
//   viewType: 'role'   → 声优视图，LANG_GROUPS 用「中文声优 / 英文声优」
//             'demand' → 需求视图，LANG_GROUPS 用「中文 Vo 需求 / 英文 Vo 需求」
//   状态 3 档统一：⚠ 待预约（黄）/ ◆ 部分已约（蓝）/ ✓ 已约完（绿）
//   条目粒度：需求 × 角色 × 语种（板内同款 lbe，与需求视图同构）
//   占位行（无声优预估）不占板，沉底「待录入」提示条；全占位时板内 lb-skeleton 骨架文案

// ============================================================
// 视图 C · 时间看板（里程碑 · 开发/转测/发布 3 期泳道 + 未约倒计时池）
// 2026-09-09：附加于既有 6 板视图之后，data 源同 aggregateActors + 发布计划 phases。
// 未约角色沉「距最近 DDL X 天」置顶提醒；已约角色按 booking 日期落入对应 phase 泳道。
// ============================================================
async function renderActorScheduleTimeline(){
  var host = document.getElementById('actorScheduleBody');
  var empty = document.getElementById('actorScheduleEmpty');
  if(!host) return;

  var release = ACTOR_STATE.release || detectCurrentReleaseFromDemands() || 'Yang1.0';
  var phases = null;
  try{
    if(!window.__RELEASE_PHASES_CACHE){ window.__RELEASE_PHASES_CACHE = {}; }
    if(window.__RELEASE_PHASES_CACHE[release]){
      phases = window.__RELEASE_PHASES_CACHE[release];
    } else {
      var resp = await fetch('/api/release-plans', {cache:'no-store'});
      if(resp.ok){
        var j = await resp.json();
        var arr = Array.isArray(j) ? j : (j.data || []);
        var normKey = normReleaseKey(release);
        var match = arr.find(function(p){ return normReleaseKey(p.release_plan||p.name||'') === normKey; });
        if(match && match.phases){ phases = match.phases; window.__RELEASE_PHASES_CACHE[release] = phases; }
      }
    }
  }catch(e){ console.warn('release-plans fetch failed', e); }

  if(!phases || !phases.dev){
    var normKeyFB = normReleaseKey(release);
    var FALLBACK_PHASES = {
      'Yang1':   { dev:{start:'2026-08-01', end:'2026-10-15'}, test:{start:'2026-10-16', end:'2026-11-15'}, release:{start:'2026-11-16', end:'2026-11-30'} },
      'Yang2':   { dev:{start:'2026-11-16', end:'2027-01-31'}, test:{start:'2027-02-01', end:'2027-02-28'}, release:{start:'2027-03-01', end:'2027-03-14'} },
      'Ma5':     { dev:{start:'2026-06-01', end:'2026-08-15'}, test:{start:'2026-08-16', end:'2026-09-15'}, release:{start:'2026-09-16', end:'2026-09-30'} }
    };
    if(FALLBACK_PHASES[normKeyFB]){
      phases = FALLBACK_PHASES[normKeyFB];
      window.__RELEASE_PHASES_CACHE[release] = phases;
    }
  }
  if(!phases || !phases.dev){
    host.innerHTML = '';
    if(empty){ empty.style.display=''; }
    return;
  }
  if(empty) empty.style.display='none';

  var today = new Date(); today.setHours(0,0,0,0);
  var pDev = { start: new Date(phases.dev.start), end: new Date(phases.dev.end) };
  var pTest = phases.test ? { start: new Date(phases.test.start), end: new Date(phases.test.end) } : null;
  var pRel = phases.release ? { start: new Date(phases.release.start), end: new Date(phases.release.end) } : null;

  function fmt(d){ if(!d) return '—'; var m=d.getMonth()+1, dd=d.getDate(); return String(m).padStart(2,'0')+'.'+String(dd).padStart(2,'0'); }
  function daysBetween(a,b){ return Math.round((a - b) / 86400000); }
  function classifyDate(d){
    if(!d) return 'pending';
    if(pRel && d >= pRel.start && d <= pRel.end) return 'release';
    if(pTest && d >= pTest.start && d <= pTest.end) return 'test';
    if(d >= pDev.start && d <= pDev.end) return 'dev';
    if(pTest && d > pTest.end) return 'release';
    if(d > pDev.end) return 'test';
    return 'dev';
  }
  function currentPhase(){
    if(pRel && today >= pRel.start && today <= pRel.end) return 'release';
    if(pTest && today >= pTest.start && today <= pTest.end) return 'test';
    if(today >= pDev.start && today <= pDev.end) return 'dev';
    if(today < pDev.start) return 'pre';
    return 'post';
  }
  var curPhase = currentPhase();

  var actors = aggregateActors(ACTOR_STATE.demands, release) || [];
  actors = actors.filter(function(a){
    if(ACTOR_STATE.lang !== 'all' && a.lang !== ACTOR_STATE.lang) return false;
    if(ACTOR_STATE.cat !== 'all'){
      var c = (a.category || (typeof categoryOf==='function' ? categoryOf(a.role) : '') || '').trim();
      if(c !== ACTOR_STATE.cat) return false;
    }
    return true;
  });

  var lanes = { pending:[], dev:[], test:[], release:[] };
  actors.forEach(function(a){
    var bookedDate = null;
    var scheds = Array.isArray(a.schedules) ? a.schedules : (a.schedule ? [a.schedule] : []);
    scheds.forEach(function(s){
      var raw = s && (s.date || s.record_date);
      if(!raw) return;
      var d = new Date(String(raw).replace(/\//g,'-'));
      if(!isNaN(d.getTime())){ if(!bookedDate || d < bookedDate) bookedDate = d; }
    });
    var story = (a.covers && a.covers[0] && a.covers[0].story) || '';
    var actor = a.va_cn || a.va_en || (scheds[0] && (scheds[0].va_cn || scheds[0].va_en)) || '';
    var lines = a.total || a.demandTotal || 0;
    var entry = { role:a.role, cat:a.category||'', lang:a.lang, story:story, lines:lines, actor:actor, date:bookedDate };
    if(bookedDate){ lanes[classifyDate(bookedDate)].push(entry); }
    else { lanes.pending.push(entry); }
  });
  lanes.pending.sort(function(x,y){ return (y.lines||0) - (x.lines||0); });
  ['dev','test','release'].forEach(function(k){ lanes[k].sort(function(x,y){ return (x.date - y.date) || (String(x.role).localeCompare(String(y.role))); }); });

  var nextDdl = null;
  if(pDev && today < pDev.end) nextDdl = { name:'开发期结束', date:pDev.end };
  else if(pTest && today < pTest.end) nextDdl = { name:'转测期结束', date:pTest.end };
  else if(pRel && today < pRel.end) nextDdl = { name:'发布', date:pRel.end };
  var pendingDdlDays = nextDdl ? daysBetween(nextDdl.date, today) : null;
  var ddlCls = '';
  if(pendingDdlDays != null){
    ddlCls = (pendingDdlDays <= 14) ? 'is-hot' : (pendingDdlDays <= 30 ? 'is-warm' : '');
  }

  function roleRowHTML(e, hot){
    var esc = window.escHtml || function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}); };
    var langBadge = e.lang === 'en' ? ' EN' : '';
    var dateCls = e.date ? 'is-booked' : 'is-pending';
    var dateTxt = e.date ? fmt(e.date) : '—';
    return '<div class="sched-role-row'+(hot?' is-hot':'')+'">'
      + '<span class="r-name" title="'+esc(e.role)+'">'+esc(e.role)+langBadge+'</span>'
      + '<span class="r-cat">'+esc(e.cat||'—')+'</span>'
      + '<span class="r-story" title="'+esc(e.story)+'">'+esc(e.story||'—')+'</span>'
      + '<span class="r-lines">'+(e.lines||0)+'</span>'
      + '<span class="r-actor" title="'+esc(e.actor)+'">'+esc(e.actor||'未指派')+'</span>'
      + '<span class="r-date '+dateCls+'">'+dateTxt+'</span>'
      + '</div>';
  }

  function laneHTML(cls, title, items, ddlHTML){
    var body;
    if(!items.length){
      body = '<div class="sched-lane-body is-empty">暂无</div>';
    } else {
      body = '<div class="sched-lane-body">' + items.map(function(e){ return roleRowHTML(e, cls==='lane-pending'); }).join('') + '</div>';
    }
    return '<div class="sched-lane '+cls+'">'
      + '<div class="sched-lane-head">'
      +   '<span class="lane-rail"></span>'
      +   '<span class="sched-lane-title">'+title+'</span>'
      +   '<span class="sched-lane-count">'+items.length+'</span>'
      +   (ddlHTML || '')
      + '</div>'
      + body
      + '</div>';
  }

  var phaseStrip = ''
    + '<div class="sched-phase-strip">'
    +   '<div class="sched-phase-cell on-dev'+(curPhase==='dev'?' is-current':'')+'">'
    +     '<div class="ph-label">开发期</div>'
    +     '<div class="ph-range">'+fmt(pDev.start)+' → '+fmt(pDev.end)+'</div>'
    +     '<div class="ph-hint">台词制作 · 声优锁 · 台词锁 · 录制</div>'
    +   '</div>'
    +   '<div class="sched-phase-cell on-test'+(curPhase==='test'?' is-current':'')+'">'
    +     '<div class="ph-label">转测期</div>'
    +     '<div class="ph-range">'+(pTest?fmt(pTest.start)+' → '+fmt(pTest.end):'—')+'</div>'
    +     '<div class="ph-hint">台词封板 · 音频合入 · 修正</div>'
    +   '</div>'
    +   '<div class="sched-phase-cell on-release'+(curPhase==='release'?' is-current':'')+'">'
    +     '<div class="ph-label">发布期</div>'
    +     '<div class="ph-range">'+(pRel?fmt(pRel.start)+' → '+fmt(pRel.end):'—')+'</div>'
    +     '<div class="ph-hint">台词发布 · 音频发布</div>'
    +   '</div>'
    + '</div>';

  var pendingDdlHTML = '';
  if(pendingDdlDays != null){
    pendingDdlHTML = '<span class="sched-lane-ddl '+ddlCls+'">距'+nextDdl.name+' '+pendingDdlDays+' 天</span>';
  }

  host.innerHTML = ''
    + phaseStrip
    + laneHTML('lane-pending', '未约 · 待指派', lanes.pending, pendingDdlHTML)
    + laneHTML('lane-dev',     '开发期已约',   lanes.dev,     '')
    + laneHTML('lane-test',    '转测期已约',   lanes.test,    '')
    + laneHTML('lane-release', '发布期已约',   lanes.release, '')
    + '<div class="sched-legend"><b>说明</b>：未约角色置顶按句数倒序，距最近里程碑 ≤14 天转红、≤30 天转黄；已约按录制日期落入对应阶段。数据源：voice_estimates + /api/schedules + /api/schedule-from-sheet。</div>';

  var wkHtml = WEEK_META.map(function(w,i){

  var riskIcon = { danger:'!', open:DF_MARK, done:'✓' };

  });

  bodyEl.innerHTML = sorted.map(rowHtml).join('');
}

    return (lab.date || '') + (lab.time ? ' ' + lab.time : '');
  };

  // 状态标签 2026-09-03 用户定稿：待预约 / 部分已约 / 已约完
  // 分组标签按视图类型切换：声优视图 = 「中文声优 / 英文声优」；需求视图 = 「中文 Vo 需求 / 英文 Vo 需求」
  const LANG_GROUPS = viewType === 'role'
    ? [{ lang:'cn', name:'中文声优' }, { lang:'en', name:'英文声优' }]
    : [{ lang:'cn', name:'中文 Vo 需求' }, { lang:'en', name:'英文 Vo 需求' }];
  const shellLang = (window.SHELL_LANG === 'cn' || window.SHELL_LANG === 'en') ? window.SHELL_LANG : 'all';
  const visibleLangs = (ACTOR_STATE.lang === 'cn' || ACTOR_STATE.lang === 'en')
    ? [ACTOR_STATE.lang]
    : (shellLang !== 'all' ? [shellLang] : ['cn', 'en']);

  // 需求视图 · AREA → 颜色（参考声优 CAT_COLORS 6 色调色板，按 AREA 出现顺序循环分配）
  // · 不引入新真源，复用 v13.2 声优视图色板的视觉节奏
  // · 若未来想"AREA 固定绑色"，把这里换成 AREA_COLORS = { 'SOL': '#0FF796', ... } 即可
  const areaColorMap = (function(){
    if (viewType !== 'demand' || !list.length) return null;
    const AREA_PALETTE = ['#0FF796','#CEA06C','#E9E6DF','#D3DFDD','#608980','#727665'];
    const seen = [];
    list.forEach(r => { const a = (r.area||'未分类').trim(); if (a && seen.indexOf(a) < 0) seen.push(a); });
    const m = {};
    seen.forEach((a, i) => { m[a] = AREA_PALETTE[i % AREA_PALETTE.length]; });
    return m;
  })();

  const boardHtml = (kind, label, arr, skeleton) => {
    const ico = kind === 'pend' ? '⚠' : (kind === 'up' ? '◆' : '✓');
    let body;
    if(skeleton){
      body = `<div class="col-empty">待录入声优预估</div>`;
    } else if(!arr.length){
      body = `<div class="col-empty">—</div>`;
    } else {
      // 二次聚合：role 视图按 role 分组，demand 视图按 AREA 分组（外层 cat-band），内层 card 按 story 聚合（2026-09-07 用户定稿）
      const groups = buildCardBList(viewType, arr);
      body = groups.map(g => {
        const color = areaColorMap
          ? (areaColorMap[g.cat] || '#6B7A85')
          : ((typeof CAT_COLORS !== 'undefined' && CAT_COLORS[g.cat]) || '#6B7A85');
        const isDone = kind === 'done';
        const catNeed = isDone
          ? `<span class="cat-need ok">✓ 已约齐</span>`
          : `<span class="cat-need">需约 <span class="num">${g.cards.length}</span> ${viewType==='role'?'位':'个需求'}</span>`;
        const cards = g.cards.map(card => {
          // 头像：声优视图=角色首字；需求视图不显示（用 .cardB-req 类名去掉 padding-left 偏移）
          const avatar = viewType === 'role'
            ? `<div class="cardB-avatar">${escHtmlSafe((card.name||'').slice(0,1) || '·')}</div>`
            : '';
          const cardBClass = viewType === 'demand' ? 'cardB cardB-req' : 'cardB';
          // 进度（仅 up 列：已约/总需求）
          const progress = (kind === 'up' && card.totalCount > 0)
            ? `<span class="cardB-progress"><span class="booked">${card.bookedCount}</span>/${card.totalCount}</span>`
            : '';
          // 头部单位：role 视图="句"；demand 视图：pend="人待约" / up="人待约" / done="全约齐"
          let totalN, totalU = '';
          if (viewType === 'role') {
            totalN = card.totalEst;
            totalU = '<span class="u">句</span>';
          } else {
            if (kind === 'done') { totalN = '✓'; totalU = '<span class="u">全约齐</span>'; }
            else { totalN = card.totalCount; totalU = '<span class="u">人待约</span>'; }
          }
          // 标签云
          const tags = card.tags.map(t => {
            let cls = 'cardB-tag';
            let tcCls = 'tc';
            let tcTxt = '';
            if (kind === 'done' || (kind === 'up' && t.isBooked)) {
              cls += ' done';
              tcTxt = `${t.est || 0} ✓`;
            } else if (kind === 'up' && !t.isBooked) {
              cls += ' wait';
              tcTxt = '—';
            } else {
              // 待预约列：按句数三态着色（黄≥50 / 蓝 20-49 / 灰<20）
              const n = t.est || 0;
              if (n >= 50) tcCls = 'tc hi';
              else if (n >= 20) tcCls = 'tc mid';
              else tcCls = 'tc lo';
              tcTxt = String(n);
            }
            // tag 文字：role 视图=需求名；demand 视图=「角色 · 大类」
            const tagLabel = viewType === 'role'
              ? t.label
              : `${t.label} · ${t.cat || '未分类'}`;
            return `<span class="${cls}"><span class="tn">${escHtmlSafe(tagLabel)}</span><span class="${tcCls}">${tcTxt}</span></span>`;
          }).join('');
          return `<div class="${cardBClass}">
            <div class="cardB-head">
              ${avatar}
              <span class="cardB-name">${escHtmlSafe(card.name)}</span>
              <span class="cardB-total"><span class="n">${totalN}</span>${totalU}</span>
              ${progress}
            </div>
            <div class="cardB-tags">${tags}</div>
          </div>`;
        }).join('');
        return `<div class="cat-band" style="--cat-color:${color}">
          <span class="cat-ico"></span>
          <span class="cat-name">${escHtmlSafe(g.cat)}</span>
          ${catNeed}
        </div>${cards}`;
      }).join('');
    }
    return `<div class="line-board seg-${kind}${skeleton ? ' lb-skeleton' : ''}">
      <div class="lb-side"><span class="lb-ico">${ico}</span><span class="lb-name">${label}</span><span class="lb-n">${skeleton ? '待录入' : arr.length}</span></div>
      <div class="col-body">${body}</div>
    </div>`;
  };

  // 标签云二次聚合（2026-09-04）：role 视图按 role 分组，demand 视图按 story 分组
  // · 2026-09-07 第 4 轮：需求视图的外层 cat-band 改为按 AREA（不是声优大类），
  //   仍走声优库 6 色调色板（AREA_PALETTE），保持视觉节奏与声优视图一致
  // · 内层 card 仍按 story 聚合，每张 cardB = 一条需求；tag 内仍展示「角色 · 声优大类」
  function buildCardBList(viewType, arr){
    const map = new Map();
    arr.forEach(r => {
      const key = viewType === 'role' ? (r.role || '') : (r.story || '');
      if(!key) return;
      if(!map.has(key)){
        map.set(key, {
          key, name: key,
          // 分组键：role 视图 = 声优大类（保持原口径）；demand 视图 = AREA
          cat: viewType === 'role' ? (r.category || '') : ((r.area || '未分类').trim()),
          area: (r.area || '未分类').trim(),
          totalEst: 0, tags: [], bookedCount: 0, totalCount: 0
        });
      }
      const card = map.get(key);
      // role 视图保留 CAT_ORDER 用作声优大类分组；demand 视图不再混用
      if(viewType === 'role' && !card.cat && r.category) card.cat = r.category;
      card.totalEst += (r.est || 0);
      const isBooked = r.status === 'booked';
      card.tags.push({ label: viewType === 'role' ? (r.story || '') : (r.role || ''), est: r.est || 0, isBooked, cat: r.category || '' });
      if(isBooked) card.bookedCount++;
      card.totalCount++;
    });
    // 固定 6 类声优大类（保留原守卫测试字面量）· 仅 role 视图使用
    const CAT_ORDER = ['指挥官','干员','Boss','AI兵','NPC','AI系统音'];
    // AREA 流程优先级（需求视图使用）：从 SOL 战斗玩法，到剧情/多人协作，到商业化
    const AREA_ORDER = ['SOL','大战场','撤离','系统','剧情','多人','商业化'];
    const ORDER = viewType === 'role' ? CAT_ORDER : AREA_ORDER;
    const groupKey = viewType === 'role' ? 'cat' : 'area';
    const grouped = new Map();
    map.forEach(card => {
      const c = (card[groupKey] || '未分类').trim();
      if(!grouped.has(c)) grouped.set(c, []);
      grouped.get(c).push(card);
    });
    // 每个组内按 totalEst 倒序
    grouped.forEach(list => list.sort((a,b) => b.totalEst - a.totalEst));
    // 按预设顺序输出，未在预设内的 key 追加在最后
    const allKeys = [...grouped.keys()];
    const orderedKeys = ORDER.filter(c => grouped.has(c))
      .concat(allKeys.filter(c => !ORDER.includes(c)));
    return orderedKeys.map(c => ({ cat: c, cards: grouped.get(c) }));
  }

  grid.innerHTML = LANG_GROUPS.filter(g => visibleLangs.indexOf(g.lang) >= 0).map(grp => {
    const rows = realRows.filter(r => r.lang === grp.lang);
    const pend = rows.filter(r => boardOfRow(r) === 'pend');
    const up   = rows.filter(r => boardOfRow(r) === 'up');
    const done = rows.filter(r => boardOfRow(r) === 'done');
    const tot = pend.length + up.length + done.length;
    return `<div class="line-group${ACTOR_STATE.pendingOnly ? ' pendingOnly' : ''}" data-lang="${grp.lang}">
      <div class="line-head">
        <div class="lh-title"><span class="lh-tag ${grp.lang}">${grp.lang === 'cn' ? '中' : '英'}</span><span class="lh-name">${grp.name}</span></div>
        <div class="lh-stats">
          <div class="lh-stat pend"><span class="lh-stat-n">${pend.length}</span><span class="lh-stat-l">待预约</span></div>
          <div class="lh-stat up"><span class="lh-stat-n">${up.length}</span><span class="lh-stat-l">部分已约</span></div>
          <div class="lh-stat done"><span class="lh-stat-n">${done.length}</span><span class="lh-stat-l">已约完</span></div>
          <div class="lh-stat tot"><span class="lh-stat-n">${tot}</span><span class="lh-stat-l">总计</span></div>
        </div>
      </div>
      ${boardHtml('pend', '待预约', pend, allPlaceholder)}
      ${boardHtml('up',   '部分已约', up,   allPlaceholder)}
      ${boardHtml('done', '已约完',     done, allPlaceholder)}
    </div>`;
  }).join('')
  + (phRows.length
      ? `<div class="ph-strip"><span class="ph-label">待录入声优预估</span>${phRows.map(r => `<span class="ph-chip" title="${escHtmlSafe(r.story)}">${escHtmlSafe(r.story)}</span>`).join('')}</div>`
      : '');
}

// 当前版本 → 声优锁日期（简版映射；后续可从 /api/version-nodes 取 estimateDay 替换）
// Release key 归一化：外壳传入 "Yang1.0" / "Yang_1.0" / "【Yang_1.0】" 等格式，本页内部 map key 是 "Yang1"
function normReleaseKey(release){
  return String(release||'')
    .trim()
    .replace(/[【】\s_]/g,'')
    .replace(/\.0+$/,''); // 去除末尾 .0/.00
}
function estimateDayOf(release){
  const map = {
    'Ma4':   new Date('2026-08-13'),
    'Ma5':   new Date('2026-07-30'),
    'Yang1': new Date('2026-10-28'),
    'Yang2': new Date('2026-12-17'),
    'Yang3': new Date('2027-02-25')
  };
  return map[normReleaseKey(release)] || null;
}
// VO 资源交付日（开发倒数第 2 周周五；无效周前推）。当前硬编码各版本，后续可从 /api/version-nodes 取 delivery_day。
function deliveryDayOf(release){
  const map = {
    'Ma4':   new Date('2026-08-21'),
    'Ma5':   new Date('2026-09-11'),
    'Yang1': new Date('2026-11-06'),
    'Yang2': new Date('2026-12-19'),
    'Yang3': new Date('2027-02-27')
  };
  return map[normReleaseKey(release)] || null;
}
// 录制档期输出截止日（台词锁后 5 工作日；口径：声优锁 + 2 有效周 Thursday + 5 工作日）。
// 当前按主版本硬编码；后续切换到 /api/version-nodes.tape_lock_day + 5 wd。
function recordingScheduleDeadlineOf(release){
  const map = {
    'Ma4':   new Date('2026-09-03'), // 声优锁 08-13 + 22d
    'Ma5':   new Date('2026-08-20'), // 声优锁 07-30 + 21d
    'Yang1': new Date('2026-11-19'), // 声优锁 10-28 + 22d（用户校准值）
    'Yang2': new Date('2026-12-31'), // 声优锁 12-17 + 14d（圣诞周跳过）
    'Yang3': new Date('2027-03-12')  // 声优锁 02-25 + 15d（春节周跳过）
  };
  return map[normReleaseKey(release)] || null;
}
// 录制定档期区间 [start, end]：起日 = 声优锁后 1 个有效天，截止 = recordingScheduleDeadlineOf。
function recordingScheduleRangeOf(release){
  const map = {
    'Ma4':   [new Date('2026-08-14'), new Date('2026-09-03')],
    'Ma5':   [new Date('2026-07-31'), new Date('2026-08-20')],
    'Yang1': [new Date('2026-10-29'), new Date('2026-11-19')], // 用户校准起日
    'Yang2': [new Date('2026-12-18'), new Date('2026-12-31')],
    'Yang3': [new Date('2027-02-26'), new Date('2027-03-12')]
  };
  return map[normReleaseKey(release)] || null;
}
// 渲染本页顶栏「录制定档期」药丸：按 release 取 [start→end] 区间 + 版本名，过期切绿色 calm 态，第 2 行追加「· 已完成」。
function renderScheduleDeadline(){
  var rel = '';
  try{
    rel = String(
      (window.SCHED_STATE && SCHED_STATE.currentRelease)
      || (window.ACTOR_STATE && ACTOR_STATE.release)
      || (typeof detectCurrentReleaseFromDemands === 'function' ? detectCurrentReleaseFromDemands() : '')
      || (window.SHELL_RELEASE || '')
      || ''
    ).trim();
  }catch(_){ rel=''; }
  var meta = document.getElementById('schedDeadlinePill');
  if(!meta) return;
  var rangeEl = document.getElementById('schedDeadlineRange');
  var relEl = document.getElementById('schedDeadlineRel');
  var calmEl = document.getElementById('schedDeadlineCalm');
  var today = new Date(); today.setHours(0,0,0,0);
  var range = recordingScheduleRangeOf(rel);
  function fmt(d){ return (d.getMonth()+1) + '.' + (d.getDate()<10?'0':'') + d.getDate(); }
  if(!range || !rel){
    meta.hidden = true;
    return;
  }
  var startD = range[0], endD = range[1];
  var passed = endD.getTime() < today.getTime();
  if(rangeEl) rangeEl.textContent = fmt(startD) + ' → ' + fmt(endD);
  if(relEl) relEl.textContent = rel;
  if(calmEl) calmEl.hidden = !passed;
  var sy = startD.getFullYear(), sm = startD.getMonth()+1, sd = startD.getDate();
  var ey = endD.getFullYear(), em = endD.getMonth()+1, ed = endD.getDate();
  meta.title = rel + ' 录制定档期：' + sy + '-' + (sm<10?'0':'') + sm + '-' + (sd<10?'0':'') + sd + ' → ' + ey + '-' + (em<10?'0':'') + em + '-' + (ed<10?'0':'') + ed;
  meta.hidden = false;
}
// DOMContentLoaded 后再尝试一次，确保 release 取到后再渲染
document.addEventListener('DOMContentLoaded', function(){
  try{ renderScheduleDeadline(); }catch(_){}
  // 首屏保险：即便无档期数据，也把中间辅助栏日历先画出来（当月空月历）
  try{ if(typeof renderMidPanel === 'function') renderMidPanel([]); }catch(_){}
  // 风险预警「仅看未预约」按钮：toggle pendingOnly + 同步 aria-pressed + 立刻重渲
  var riskBtn = document.getElementById('riskAction');
  if(riskBtn){

      ACTOR_STATE.pendingOnly = !ACTOR_STATE.pendingOnly;
      riskBtn.classList.toggle('active', ACTOR_STATE.pendingOnly);
      riskBtn.setAttribute('aria-pressed', ACTOR_STATE.pendingOnly ? 'true' : 'false');
      try{ renderActorRollup(); }catch(_){}
    });
  }
  setTimeout(function(){
    try{ renderScheduleDeadline(); }catch(_){}
    try{ if(typeof renderMidPanel === 'function') renderMidPanel([]); }catch(_){}
  }, 500);
});
// 工作日统一按共享模块：周末补班计入，法定放假日与 12/25 排除。
var SCHED_HOLIDAY_CALENDAR = window.VOMI_HOLIDAY_CALENDAR;
function isHolidayOrWeekend(day){
  if(SCHED_HOLIDAY_CALENDAR) return !SCHED_HOLIDAY_CALENDAR.isWorkday(day);
  const dow = day.getDay();
  return dow === 0 || dow === 6;
}
// 从 today 到 targetDate 之间的工作日数（不含起点，含终点）
function workingDaysUntil(targetDate){
  if(!targetDate) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const oneDay = 86400000;
  let n = 0;
  for(let t = today.getTime() + oneDay; t <= targetDate.getTime(); t += oneDay){
    if(isHolidayOrWeekend(new Date(t))) continue;
    n++;
  }
  return n;
}
// 占位：未约角色点击"查看档期"时打开档期草稿（后续可跳到 sched 视图 + 预填该角色）
function openScheduleForRole(role, lang){

  var det = document.getElementById('viewSched');
  if(det && det.tagName === 'DETAILS'){ det.open = true; det.scrollIntoView({behavior:'smooth', block:'start'}); }
  if(typeof toast==='function') toast('已展开档期草稿 · 角色：' + role);
}

function escHtmlSafe(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escHtml(s){ return escHtmlSafe(s); }
function escAttr(s){ return String(s==null?'':s).replace(/['"\\]/g, '\\$&'); }

// 预约档期：跳到 sched 视图并预填角色（把 role 塞进 localStorage 作提示，档期草稿 wizard 可读取）
// key 保留 vo_actor_prefill 名称（下游兼容），语义已改为"角色预填"

}

  function updateKPI(sourceRows){

    var conf=countConflicts(rows);
    setStat(0, rows.length, '/ 场', false);

      })
      .catch(function(){ return []; });
    return Promise.all([p1, p2]).then(function(res){
      var pub = res[0]||[], sheet = res[1]||[];
      toast('已同步：已发布 '+pub.length+' 条 · 表格快照 '+sheet.length+' 条');
      // 同步刷新侧栏（renderSched 内部会调用 renderMidPanel）+ 主表演员卡
      if(typeof window.renderSched === 'function') try{ window.renderSched(); }catch(_){}
      if(typeof renderActorRollup === 'function') try{ renderActorRollup(); }catch(_){}
      return { published: pub, sheet: sheet };
    }).catch(function(e){ toast('同步失败：'+(e&&e.message||e), true); return null; }).finally(function(){
      if(btn){ btn.disabled=false; if(btn.dataset.label) btn.innerHTML=btn.dataset.label; }
    });
  };
  // ============================================================
  // 「从台词库表格加载」（2026-09-08 POC）
  // 端点：GET /api/schedule-from-sheet?release=Yang1.0
  //   → 后端读 deploy/backend/data/schedule_from_sheet.json（Vomi 表格快照）
  //   → 弹窗展示 21 条虚拟档期，验证「表格档期真源」链路
  // ============================================================
  window.loadScheduleFromSheet=function(){
    var btn=document.getElementById('loadFromSheetBtn');
    if(btn){ btn.disabled=true; btn.dataset.label=btn.dataset.label||btn.innerHTML; btn.innerHTML='<span class="sync-spinner"></span>加载中…'; }
    var release=(window.__INIT_RELEASE__||document.querySelector('.eyebrow-release')&&document.querySelector('.eyebrow-release').textContent||'Yang1.0').trim();
    fetch('/api/schedule-from-sheet?release='+encodeURIComponent(release))
      .then(function(r){ return r.json().then(function(j){ return {status:r.status, body:j}; }); })
      .then(function(x){
        if(btn){ btn.disabled=false; if(btn.dataset.label) btn.innerHTML=btn.dataset.label; }
        if(!x.body.ok){
          toast('表格数据未就绪：'+(x.body.error||'unknown')+'（快照未生成或 release 不匹配）', true);
          return;
        }
        renderSheetSchedulePreview(x.body);
      })
      .catch(function(e){
        if(btn){ btn.disabled=false; if(btn.dataset.label) btn.innerHTML=btn.dataset.label; }
        toast('拉取失败：'+(e&&e.message||e), true);
      });
  };
  function renderSheetSchedulePreview(data){
    var host=document.getElementById('sheetSchedulePreview');
    if(!host){
      host=document.createElement('div');
      host.id='sheetSchedulePreview';
      host.style.cssText='position:fixed;top:60px;right:20px;bottom:20px;width:min(720px,calc(100vw - 40px));z-index:9200;background:rgba(11,17,22,.98);border:1px solid rgba(15,247,150,.4);box-shadow:0 18px 54px rgba(0,0,0,.7);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);display:flex;flex-direction:column;font-family:"Microsoft YaHei UI","PingFang SC",sans-serif';
      document.body.appendChild(host);
    }
    var records=data.records||[];
    var rowsHtml=records.map(function(r,i){
      var st=(r.status_cn||'')+(r.status_en&&r.status_en!==r.status_cn?' / '+r.status_en:'');
      var stCls=(r.status_cn==='已完成'?'#0FF796':(r.status_cn==='已排期'?'#FFD24C':'#B3BBC1'));
      return '<tr style="border-bottom:1px solid rgba(255,255,255,.05)">'
        +'<td style="padding:6px 10px;color:#8B9199;font-size:11px;font-variant-numeric:tabular-nums">'+(i+1)+'</td>'
        +'<td style="padding:6px 10px;color:#B3BBC1;font-size:12px">'+r.category+'</td>'
        +'<td style="padding:6px 10px;color:var(--c-text);font-size:12px;font-weight:500">'+r.role_cn+'</td>'
        +'<td style="padding:6px 10px;color:#B3BBC1;font-size:12px">'+r.va_cn+' / '+r.va_en+'</td>'
        +'<td style="padding:6px 10px;color:'+stCls+';font-size:12px;font-weight:500">'+st+'</td>'
        +'<td style="padding:6px 10px;color:#B3BBC1;font-size:11px;font-variant-numeric:tabular-nums">'+(r.date_cn||'—')+'</td>'
        +'<td style="padding:6px 10px;color:#8B9199;font-size:11px">'+(r.location||'—')+'</td>'
        +'</tr>';
    }).join('');
    host.innerHTML=''
      +'<div style="padding:12px 16px 10px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between;background:#0F171C;position:relative">'
      +  '<div style="position:absolute;left:0;top:12px;bottom:10px;width:3px;background:var(--c-primary);opacity:.85"></div>'
      +  '<div style="padding-left:8px">'
      +    '<div style="font-size:13px;font-weight:600;color:var(--c-text);letter-spacing:.3px">台词库表格 · 3.录制档期 · '+(data.release||'—')+'</div>'
      +    '<div style="font-size:11px;color:#8B9199;margin-top:4px"><span style="color:var(--c-primary);opacity:.7">&gt;</span> '+records.length+' 条 · 快照 '+String(data.fetched_at||'').replace('T',' ')+'</div>'
      +  '</div>'
      +  '<button onclick="document.getElementById(\'sheetSchedulePreview\').remove()" style="width:26px;height:26px;border:1px solid var(--c-hairline);background:transparent;color:var(--c-text-2);cursor:pointer;font-size:16px;line-height:1;clip-path:polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px)">×</button>'
      +'</div>'
      +'<div style="flex:1;overflow-y:auto;padding:0 4px">'
      +'<table style="width:100%;border-collapse:collapse;font-size:12px">'
      +'<thead style="position:sticky;top:0;background:#0E1519"><tr style="border-bottom:1px solid rgba(15,247,150,.25)">'
      +'<th style="padding:8px 10px;text-align:left;font-size:11px;color:var(--c-primary);letter-spacing:.4px;font-weight:600">NO</th>'
      +'<th style="padding:8px 10px;text-align:left;font-size:11px;color:var(--c-primary);letter-spacing:.4px;font-weight:600">大类</th>'
      +'<th style="padding:8px 10px;text-align:left;font-size:11px;color:var(--c-primary);letter-spacing:.4px;font-weight:600">游戏角色</th>'
      +'<th style="padding:8px 10px;text-align:left;font-size:11px;color:var(--c-primary);letter-spacing:.4px;font-weight:600">声优 中/英</th>'
      +'<th style="padding:8px 10px;text-align:left;font-size:11px;color:var(--c-primary);letter-spacing:.4px;font-weight:600">状态</th>'
      +'<th style="padding:8px 10px;text-align:left;font-size:11px;color:var(--c-primary);letter-spacing:.4px;font-weight:600">录制日期</th>'
      +'<th style="padding:8px 10px;text-align:left;font-size:11px;color:var(--c-primary);letter-spacing:.4px;font-weight:600">录制地点</th>'
      +'</tr></thead>'
      +'<tbody>'+rowsHtml+'</tbody>'
      +'</table></div>';
    toast('已加载：'+records.length+' 条表格档期');
  }
  window.openDraftWizard=SCHED.open; window.closeDraftWizard=SCHED.close; window.confirmDraftWizard=SCHED.confirm;
  window.addEmptySched=SCHED.addEmpty; window.exportSchedule=SCHED.export; window.publishScheduleDrafts=SCHED.publishAll;
  window.renderSched=renderSched;
  document.getElementById('wizMask').addEventListener('click',function(e){ if(e.target===this) SCHED.close(); });
  renderSched();
  loadDemandOptions();
  // 启动：草稿仅本机；正式档期只读recording_schedules。KV不再承载档期草稿。
  kvPull(CLARIFY).then(function(remoteClar){
    try{if(remoteClar && !Object.keys(loadClarify()).length)localStorage.setItem(CLARIFY,remoteClar);}catch(_){}
    return loadPublishedSchedules();
  }).then(renderSched);
})();
</script>

<script>
/* eyebrow release pill：与需求汇总页同一数据源，外层 iframe 经 window.__INIT_RELEASE__ 注入当前 release。
   独立 IIFE 放在 body 末尾，DOM 已就绪且不与各页初始化时序耦合。 */
(function(){
  var el = document.querySelector('.eyebrow-release');
  if(el) el.textContent = (window.__INIT_RELEASE__ || 'Yang1.0');
})();

/* 搜索历史下拉（2026-09-07 用户指令：谷歌风格 + 玻璃绿 UI + 5 条内 + 紧凑） */
(function(){
  const HISTORY_LIMIT = 5;
  const HISTORY_VER = 'v1';
  const KEY_OF = (host) => 'vo_search_history_' + HISTORY_VER + '::' + (host.dataset.searchPage || 'default');
  function load(host){
    try{ const raw = localStorage.getItem(KEY_OF(host)); const list = raw ? JSON.parse(raw) : []; return Array.isArray(list) ? list.slice(0, HISTORY_LIMIT) : []; }catch(_){ return []; }
  }
  function save(host, list){
    try{ localStorage.setItem(KEY_OF(host), JSON.stringify(list.slice(0, HISTORY_LIMIT))); }catch(_){}
  }
  function push(host, term){
    term = (term||'').trim();
    if(!term || term.length < 2) return;
    const list = load(host).filter(t => t !== term);
    list.unshift(term);
    save(host, list);
  }
  function render(host){
    const pop = host.querySelector('[data-search-history]');
    if(!pop) return;
    const ul = pop.querySelector('.sh-list');
    const clearBtn = pop.querySelector('.sh-clear');
    const list = load(host);
    if(!list.length){
      ul.innerHTML = '<div class="sh-empty">暂无搜索记录</div>';
      clearBtn.style.display = 'none';
      return;
    }
    clearBtn.style.display = '';
    const input = host.querySelector('input');
    const cur = (input.value||'').trim().toLowerCase();
    ul.innerHTML = list.map((t, i) =>
      '<li class="sh-item" data-idx="' + i + '" role="option">' +
        '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          '<circle cx="12" cy="12" r="9"/>' +
          '<polyline points="12 7 12 12 15.5 14"/>' +
        '</svg>' +
        '<span class="label"></span>' +
        '<button class="del" type="button" aria-label="删除此条历史" data-tip="删除">×</button>' +
      '</li>'
    ).join('');
    ul.querySelectorAll('.sh-item').forEach(li => {
      const i = parseInt(li.dataset.idx, 10);
      const label = li.querySelector('.label');
      label.textContent = list[i];
      if(cur && list[i].toLowerCase().includes(cur)) li.classList.add('hit');
    });
    ul.querySelectorAll('.sh-item').forEach(li => {
      const i = parseInt(li.dataset.idx, 10);
      li.addEventListener('mousedown', (e) => {
        if(e.target.closest('.del')) return;
        e.preventDefault();
        input.value = list[i];
        input.dispatchEvent(new Event('input', {bubbles:true}));
        pop.hidden = true;
        input.focus();
      });
    });
    ul.querySelectorAll('.del').forEach(btn => {
      btn.addEventListener('mousedown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const cur2 = load(host);
        cur2.splice(parseInt(btn.closest('.sh-item').dataset.idx, 10), 1);
        save(host, cur2);
        render(host);
      });
    });
  }
  function open(host){
    const pop = host.querySelector('[data-search-history]');
    if(!pop || !pop.hidden) return;
    render(host);
    pop.hidden = false;
  }
  function close(host){
    const pop = host.querySelector('[data-search-history]');
    if(pop) pop.hidden = true;
  }
  function wire(host){
    const input = host.querySelector('input');
    const pop = host.querySelector('[data-search-history]');
    const clearBtn = pop && pop.querySelector('.sh-clear');
    if(!input || !pop) return;
    input.addEventListener('focus', () => {
      if(!(input.value||'').trim()) open(host);
      else close(host);
    });
    input.addEventListener('input', () => {
      if((input.value||'').trim()) close(host);
    });
    input.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){
        if((input.value||'').trim()) push(host, input.value);
        close(host);
      } else if(e.key === 'Escape'){
        if(!pop.hidden){ close(host); e.preventDefault(); }
      }
    });
    input.addEventListener('blur', () => {
      setTimeout(() => { if(!host.contains(document.activeElement)) close(host); }, 120);
    });
    if(clearBtn){
      clearBtn.addEventListener('mousedown', (e) => {
        e.preventDefault();
        save(host, []);
        render(host);
        input.focus();
      });
    }
  }
  function init(){
    document.querySelectorAll('[data-search-host]').forEach(wire);
    document.addEventListener('mousedown', (e) => {
      document.querySelectorAll('[data-search-host]').forEach(host => {
        const pop = host.querySelector('[data-search-history]');
        if(pop && !pop.hidden && !host.contains(e.target)) pop.hidden = true;
      });
    });
    document.addEventListener('keydown', (e) => {
      if(e.key !== 'Escape') return;
      document.querySelectorAll('[data-search-host]').forEach(host => {
        const pop = host.querySelector('[data-search-history]');
        if(pop && !pop.hidden) pop.hidden = true;
      });
    });
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
