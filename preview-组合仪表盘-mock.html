  { role:'黑鸦Boss',          category:'Boss',   lang:'en', actor:'Kaito',   total:120, status:'booked', dateOffset:-8, studio:'居然翁棚', covers:[{story:'Yang1 · Boss 战 · 黑鸦'}] }

// ============ 场景切换：控制 DDL 距离 ============
// ddlOffset = 从今天推多少天到"最近的 DDL"（>0=未来，0=今日，<0=已过）
const SCENARIOS = {
  normal:   { ddlOffset: 20, ddlLabel: '声优锁' },
  hot:      { ddlOffset: 5,  ddlLabel: '声优锁' },
  dday:     { ddlOffset: 0,  ddlLabel: '声优锁' },
  overdue:  { ddlOffset: -3, ddlLabel: '声优锁' },
  healthy:  { ddlOffset: 30, ddlLabel: '声优锁', healthyMode: true }
};

// ============ 工具函数 ============
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtD(d){ if(!d || !(d instanceof Date) || isNaN(d)) return '—'; var m=d.getMonth()+1, dd=d.getDate(); return String(m).padStart(2,'0')+'.'+String(dd).padStart(2,'0'); }
function addDays(base, n){ var d = new Date(base); d.setHours(0,0,0,0); d.setDate(d.getDate()+n); return d; }
function isoMonday(d){ var x = new Date(d); x.setHours(0,0,0,0); var day = x.getDay(); x.setDate(x.getDate() - ((day+6)%7)); return x; }
function isoWeekNo(d){ var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7)); var s=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-s)/86400000+1)/7); }

// ============ 主渲染 ============
function render(scenario){
  var scen = SCENARIOS[scenario] || SCENARIOS.normal;
  var today = new Date(); today.setHours(0,0,0,0);
  var vaLock = addDays(today, scen.ddlOffset);
  var scLock = addDays(today, scen.ddlOffset + 21);   // 台词锁 = 声优锁 + 3 周
  var voDeliver = addDays(today, scen.ddlOffset + 56); // VO 交付 = 声优锁 + 8 周
  var devEnd = addDays(today, scen.ddlOffset + 56);

  // healthyMode: 把所有 pending 转成 booked（随机分布日期）
  var list = MOCK_ROLES.map(function(a, i){
    var copy = Object.assign({ role_lang_key: a.role+'|'+a.lang }, a);
    if(scen.healthyMode && copy.status === 'pending'){
      copy.status = 'booked';
      copy.dateOffset = 8 + (i % 8) * 4;
      copy.actor = ['谢佳洺','关学院','罗婧文','陈晨','胡瑞璋','杨开元','郑懿','hayden'][i % 8];
      copy.studio = ['8082棚','叽咔棚','居然翁棚','SIDE棚'][i % 4];
    }
    if(copy.status === 'booked'){
      copy.schedule = { date: addDays(today, copy.dateOffset), studio: copy.studio || '' };
    }
    return copy;
  });

  // 计算 DDL
  var dayDiff = function(a,b){ return Math.floor((a - b) / 86400000); };
  var daysToVA = dayDiff(vaLock, today);
  var daysToSC = dayDiff(scLock, today);
  var daysToVO = dayDiff(voDeliver, today);
  var ddlLabel, ddlDays, ddlHot = 0;
  // 允许 -7 天以内的逾期仍显示在当前 DDL 上（不自动跳到下一个），便于展示"已逾期"态
  if(daysToVA >= -7){ ddlLabel = '声优锁'; ddlDays = daysToVA; }
  else if(daysToSC >= -7){ ddlLabel = '台词锁'; ddlDays = daysToSC; }
  else { ddlLabel = 'VO 交付'; ddlDays = daysToVO; }
  if(ddlDays <= 14) ddlHot = 1;

  // 甘特 13 周窗口
  var W0 = isoMonday(today); W0.setDate(W0.getDate() - 14);
  var weeks = []; for(var i=0;i<13;i++){ var wm = new Date(W0); wm.setDate(wm.getDate() + i*7); weeks.push(wm); }
  var wStart = weeks[0], wEnd = new Date(weeks[12]); wEnd.setDate(wEnd.getDate() + 6);
  function weekIdx(dt){ if(!(dt instanceof Date) || isNaN(dt)) return -1; var d = new Date(dt); d.setHours(0,0,0,0); if(d < wStart || d > wEnd) return -1; return Math.floor((d - wStart) / (7*86400000)); }
  function phaseOfDate(dt){ if(!dt) return ''; var d = new Date(dt); d.setHours(0,0,0,0); if(d <= addDays(today, scen.ddlOffset + 21)) return 'dev'; if(d <= addDays(today, scen.ddlOffset + 42)) return 'test'; return 'release'; }

  // ============ D · KPI ============
  var booked = list.filter(a => a.status === 'booked').length;
  var pending = list.length - booked;
  var totalLines = list.reduce((s,a)=>s+a.total, 0);
  var pendingLines = list.filter(a=>a.status!=='booked').reduce((s,a)=>s+a.total, 0);
  var kpiEl = document.getElementById('acKpiRow');
  kpiEl.innerHTML = ''
    + '<div class="ac-kpi-card" data-tone="total" data-code="ROSTER"><div class="ac-kpi-label">角色总数 · Yang1.0</div>'
    +   '<div class="ac-kpi-value">'+list.length+'<span class="unit">位</span></div>'
    +   '<div class="ac-kpi-sub"><b>'+totalLines+'</b> 句 · '+(new Set(list.map(a=>a.category))).size+' 个大类</div></div>'
    + '<div class="ac-kpi-card" data-tone="booked" data-code="BOOKED"><div class="ac-kpi-label">已排期</div>'
    +   '<div class="ac-kpi-value">'+booked+'<span class="unit">位</span></div>'
    +   '<div class="ac-kpi-sub">覆盖率 <b>'+Math.round(booked/list.length*100)+'%</b></div></div>'
    + '<div class="ac-kpi-card" data-tone="pending" data-code="PENDING"><div class="ac-kpi-label">待预约 · 待指派</div>'
    +   '<div class="ac-kpi-value">'+pending+'<span class="unit">位</span></div>'
    +   '<div class="ac-kpi-sub"><b>'+pendingLines+'</b> 句待录</div></div>'
    + '<div class="ac-kpi-card" data-tone="ddl" data-hot="'+ddlHot+'" data-code="DDL"><div class="ac-kpi-label">距最近里程碑 · '+ddlLabel+'</div>'
    +   '<div class="ac-kpi-value">'+(ddlDays>=0?ddlDays:Math.abs(ddlDays))+'<span class="unit">'+(ddlDays<0?'天逾期':'天')+'</span></div>'
    +   '<div class="ac-kpi-sub">'+ddlLabel+' <b>'+fmtD(ddlLabel==='声优锁'?vaLock:ddlLabel==='台词锁'?scLock:voDeliver)+'</b></div></div>';

  // ============ C · 甘特 ============
  var todayIdx = weekIdx(today), vaIdx = weekIdx(vaLock), scIdx = weekIdx(scLock), voIdx = weekIdx(voDeliver);
  var wkHtml = weeks.map(function(wm, i){
    var cls = ['gt-week'];
    if(i === todayIdx) cls.push('is-today');
    if(i === vaIdx || i === scIdx || i === voIdx) cls.push('is-ms');
    var wn = isoWeekNo(wm), mm = wm.getMonth()+1, dd = wm.getDate();
    return '<div class="'+cls.join(' ')+'" title="W'+wn+' · '+mm+'/'+dd+'">W'+wn+'</div>';
  }).join('');
  function langBadge(a){ return a.lang === 'en' ? '<span class="lang-badge">EN</span>' : '<span class="lang-badge">CN</span>'; }
  function ganttRow(a){
    var track = '';
    if(todayIdx >= 0) track += '<div class="gt-today-line" style="left:calc('+((todayIdx+0.5)/13*100)+'% - 0.5px)"></div>';
    if(vaIdx >= 0)    track += '<div class="gt-ms-line" style="left:calc('+((vaIdx+0.5)/13*100)+'% - 0.5px)"></div>';
    if(scIdx >= 0)    track += '<div class="gt-ms-line" style="left:calc('+((scIdx+0.5)/13*100)+'% - 0.5px)"></div>';
    if(a.status === 'booked'){
      var idx = weekIdx(a.schedule.date);
      if(idx >= 0){
        var ph = phaseOfDate(a.schedule.date);
        var left = idx/13*100, width = 1/13*100;
        track += '<div class="gt-block" data-phase="'+ph+'" style="left:'+left+'%;width:'+width+'%" title="'+esc(fmtD(a.schedule.date))+' · '+esc(a.actor)+'"></div>';
      }
    } else {
      var startIdx = todayIdx>=0?todayIdx:0, endIdx = 12;
      var l = startIdx/13*100, w = (endIdx-startIdx+1)/13*100;
      var noteShort = (ddlDays>0) ? ('D-'+ddlDays) : (ddlDays===0?'D-DAY':('D+'+Math.abs(ddlDays)));
      var noteFull = (ddlDays>0)?('距 '+ddlLabel+' '+ddlDays+' 天'):(ddlDays===0?(ddlLabel+' 今日'):('已逾期 '+Math.abs(ddlDays)+' 天'));
      track += '<div class="gt-pending" style="left:'+l+'%;width:'+w+'%" data-note="'+esc(noteShort)+'" title="'+esc(noteFull)+'"></div>';
    }
    return '<div class="ac-gantt-row">'
      + '<div class="gr-name" title="'+esc(a.role)+'">'+esc(a.role)+langBadge(a)+'</div>'
      + '<div class="gr-cat">'+esc(a.category)+'</div>'
      + '<div class="gr-lines">'+a.total+'</div>'
      + '<div class="gr-track">'+track+'</div>'
      + '<div class="gr-actor" title="'+esc(a.actor)+'">'+esc(a.actor||'未指派')+'</div>'
      + '</div>';
  }
  var sorted = list.slice().sort(function(a,b){
    if((a.status==='booked') !== (b.status==='booked')) return a.status==='booked' ? 1 : -1;
    return b.total - a.total;
  });
  // 里程碑标签栏
  function msPct(idx){ return ((idx+0.5)/13*100); }
  var msTags = [];
  if(todayIdx >= 0) msTags.push('<span class="ms-tag" data-kind="today" style="left:'+msPct(todayIdx)+'%">今</span>');
  if(vaIdx >= 0)    msTags.push('<span class="ms-tag" data-kind="va" style="left:'+msPct(vaIdx)+'%">声优锁</span>');
  if(scIdx >= 0 && scIdx !== vaIdx) msTags.push('<span class="ms-tag" data-kind="sc" style="left:'+msPct(scIdx)+'%">台词锁</span>');
  if(voIdx >= 0 && voIdx !== scIdx) msTags.push('<span class="ms-tag" data-kind="vo" style="left:'+msPct(voIdx)+'%">VO 交付</span>');
  var msStripHtml = msTags.length ? '<div class="ac-gantt-ms-strip"><div class="ms-lane">'+msTags.join('')+'</div></div>' : '';

  document.getElementById('acGanttWrap').innerHTML = ''
    + '<div class="ac-gantt-head">'
    +   '<div class="gh-title">TIMELINE <span class="gh-title-sub">全角色时间轴 · '+list.length+' 位角色 · 13 周窗口</span></div>'
    +   '<div class="gh-legend"><span><i class="lg-dev"></i>开发</span><span><i class="lg-test"></i>转测</span><span><i class="lg-release"></i>发布</span><span><i class="lg-pending"></i>未约</span></div>'
    + '</div>'
    + '<div class="ac-gantt">'
    +   '<div class="ac-gantt-timeline"><div>ROLE</div><div>CAT</div><div>LINES</div><div class="gt-lane">'+wkHtml+'</div><div>VA</div></div>'
    +   msStripHtml
    +   '<div class="ac-gantt-body">'+sorted.map(ganttRow).join('')+'</div>'
    + '</div>';

  // ============ A · 风险清单 ============
  function riskOf(a){
    if(a.status === 'booked'){
      var bd = a.schedule && a.schedule.date;
      if(bd && bd < today) return 'done';
      return 'ok';
    }
    if(ddlDays <= 14) return 'hot';
    return 'warn';
  }
  var riskIcon = { hot:'[!]', warn:'[~]', ok:'[◆]', done:'[✓]' };
  function statusText(a){
    if(a.status === 'booked'){
      var bd = a.schedule && a.schedule.date;
      var studio = a.schedule && a.schedule.studio ? a.schedule.studio : '';
      var dtxt = bd ? fmtD(bd) : '未定';
      return dtxt + (studio ? ' · '+studio : '');
    }
    return (ddlDays>0?'距 '+ddlLabel+' '+ddlDays+' 天':ddlDays===0?ddlLabel+' 今日':'已逾期 '+Math.abs(ddlDays)+' 天');
  }
  function riskRow(a){
    var r = riskOf(a);
    var stories = (a.covers||[]).map(c=>c.story).filter(Boolean).join(' / ') || '—';
    return '<div class="ac-risk-row" data-risk="'+r+'">'
      + '<div class="rr-icon">'+riskIcon[r]+'</div>'
      + '<div class="rr-role" title="'+esc(a.role)+'">'+esc(a.role)+langBadge(a)+'</div>'
      + '<div class="rr-cat">'+esc(a.category)+'</div>'
      + '<div class="rr-lines">'+a.total+'</div>'
      + '<div class="rr-story" title="'+esc(stories)+'">'+esc(stories)+'</div>'
      + '<div class="rr-actor" title="'+esc(a.actor||'')+'">'+esc(a.actor||'未指派')+'</div>'
      + '<div class="rr-status" data-status="'+r+'">'+esc(statusText(a))+'</div>'
      + '</div>';
  }
  var riskOrder = { hot:0, warn:1, ok:2, done:3 };
  var riskSorted = list.slice().sort(function(a,b){
    var ra = riskOrder[riskOf(a)], rb = riskOrder[riskOf(b)];
    if(ra !== rb) return ra - rb;
    return b.total - a.total;
  });
  var hotN = riskSorted.filter(a=>riskOf(a)==='hot').length;
  var warnN = riskSorted.filter(a=>riskOf(a)==='warn').length;
  var okN = riskSorted.filter(a=>riskOf(a)==='ok').length;
  var doneN = riskSorted.filter(a=>riskOf(a)==='done').length;

  document.getElementById('acRiskWrap').innerHTML = ''
    + '<div class="ac-risk-head">'
    +   '<div class="rh-title">ALERT <span class="rh-title-sub">风险清单 · '+hotN+' 高危 · '+warnN+' 待约 · '+okN+' 已排 · '+doneN+' 完成</span></div>'
    +   '<div class="rh-note">按风险倒序 · 距最近 DDL <b>'+(ddlDays>=0?ddlDays:'-'+Math.abs(ddlDays))+'</b> 天</div>'
    + '</div>'
    + '<div class="ac-risk-cols"><div>LVL</div><div>ROLE</div><div>CAT</div><div style="text-align:right">LINES</div><div>MISSION</div><div>VA</div><div style="text-align:right">STATUS</div></div>'
    + '<div class="ac-risk-body">'+riskSorted.map(riskRow).join('')+'</div>';
}

// ============ 场景切换按钮 ============
document.querySelectorAll('.demo-toolbar .toggle').forEach(btn => {
  btn.addEventListener('click', function(){
    document.querySelectorAll('.demo-toolbar .toggle').forEach(b => b.classList.remove('on'));
    this.classList.add('on');
    render(this.dataset.scen);
  });
});

// 初始渲染
render('normal');
</script>
