  --c-primary:#0FF796;--c-primary-dark:#0BD980;--c-primary-glow:rgba(15,247,150,0.18);
  --c-bg:#0F171C;--c-bg-0:#0F171C;--c-surface:#1F2A32;--c-surface-3:#2E3B45;
  --c-border:#2E3B45;--c-border-strong:#3D4C57;--c-hairline:#243039;
  --c-text:#FFFFFF;--c-text-2:#D4DDE3;--c-text-mute:#A1B1BC;--c-text-dim:#6B7A85;
  --c-brand-yellow:#FFD24C;--c-danger:#D699BE;
  --c-vo:#7A9E85;                /* VO 资源交付 · 深橄榄绿实线 */
  --c-rec-open:var(--c-primary);  /* 已排期待录制 · 品牌绿（与 STATUS REC pill 前后统一） */
  --c-rec-done:#5E6D63;          /* 录制完成 · 灰绿 */
  --c-rec-danger:#FFD24C;        /* 排在开发期最后一周 · 品牌黄 */
  --font-ui:'Inter','Microsoft YaHei UI','PingFang SC',sans-serif;
  /* 列宽定值 · 无独立 LVL 列（合入 ROLE 前缀） */
  --col-cat:60px;--col-lang:48px;--col-role:150px;--col-story:200px;--col-lines:44px;--col-weeks:minmax(560px,1fr);--col-ddl:104px;
  /* 阶段色 */
  --ph-hist:#4C5A64;--ph-sched:var(--c-primary);--ph-dev:#7FB0A6;--ph-test:var(--c-brand-yellow)
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  font-family:var(--font-ui);font-size:14px;color:var(--c-text);
  background:
    radial-gradient(1200px 800px at 20% -10%,rgba(15,247,150,.06) 0%,transparent 55%),
    radial-gradient(900px 700px at 90% 100%,rgba(122,158,133,.045) 0%,transparent 55%),
    var(--c-bg);
  -webkit-font-smoothing:antialiased;min-height:100vh
}

/* 页头 */
.demo-header{padding:22px 32px 16px;border-bottom:1px solid var(--c-hairline);background:rgba(11,17,22,.6);position:relative}
.demo-header::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--c-primary) 30%,var(--c-primary) 70%,transparent);opacity:.35}
.demo-eyebrow{font:600 10px/1 var(--font-ui);letter-spacing:1.4px;color:var(--c-primary);text-transform:uppercase;display:inline-flex;align-items:center;gap:6px}
.demo-eyebrow::before{content:'▌';color:var(--c-primary)}
.demo-eyebrow .code{color:var(--c-text-mute);font-weight:500;margin-left:6px}
.demo-title{margin-top:6px;font:700 22px/1 var(--font-ui);letter-spacing:.3px;color:var(--c-text);display:flex;align-items:baseline;gap:12px}
.demo-title .sub{font:500 12px/1 var(--font-ui);color:var(--c-text-mute);letter-spacing:.4px}
.demo-meta{margin-top:10px;font:500 11px/1.5 var(--font-ui);color:var(--c-text-2);letter-spacing:.3px}
.demo-meta::before{content:'> ';color:var(--c-primary);opacity:.7}
.demo-meta b{color:var(--c-brand-yellow);font-weight:700}

/* 主容器 */
.demo-main{padding:16px 24px 40px;max-width:1600px;margin:0 auto}
.combined-wrap{display:flex;flex-direction:column;gap:12px}

/* ============ D · KPI ============ */
.ac-kpi-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ac-kpi-card{
  position:relative;padding:12px 14px 11px 18px;
  background:
    linear-gradient(180deg,rgba(15,247,150,.045) 0%,rgba(15,23,28,0) 60%),
    repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 12px),
    rgba(11,17,22,.72);
  border:1px solid var(--c-hairline);
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  overflow:hidden
}
.ac-kpi-card::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--kpi-c);opacity:.95;box-shadow:0 0 6px var(--kpi-c)}
.ac-kpi-card::after{content:attr(data-code);position:absolute;top:8px;right:10px;font:600 9.5px/1 var(--font-ui);letter-spacing:.6px;color:var(--kpi-c);opacity:.55;text-transform:uppercase}
.ac-kpi-card[data-tone="total"]{--kpi-c:var(--c-primary)}
.ac-kpi-card[data-tone="booked"]{--kpi-c:var(--c-rec-open)}
.ac-kpi-card[data-tone="pending"]{--kpi-c:var(--c-brand-yellow)}
.ac-kpi-card[data-tone="ddl"]{--kpi-c:var(--c-brand-yellow)}
.ac-kpi-card[data-tone="ddl"][data-hot="1"]{animation:kpiPulse 1.8s ease-in-out infinite}
@keyframes kpiPulse{0%,100%{box-shadow:inset 0 0 0 1px rgba(255,210,76,.15)}50%{box-shadow:inset 0 0 0 1px rgba(255,210,76,.45)}}
.ac-kpi-label{font:600 10px/1 var(--font-ui);letter-spacing:1.2px;color:var(--c-text-mute);text-transform:uppercase;display:flex;align-items:center;gap:5px}
.ac-kpi-label::before{content:'▸';color:var(--kpi-c);opacity:.75;font-size:9px}
.ac-kpi-value{margin-top:6px;font:600 28px/1 var(--font-ui);color:var(--kpi-c);font-variant-numeric:tabular-nums;letter-spacing:.4px}
.ac-kpi-value .unit{font-size:12px;color:var(--c-text-mute);margin-left:5px;letter-spacing:.6px;font-weight:500}
.ac-kpi-sub{margin-top:8px;font:500 10.5px/1.4 var(--font-ui);color:var(--c-text-mute);letter-spacing:.3px}
.ac-kpi-sub::before{content:'> ';color:var(--kpi-c);opacity:.7}
.ac-kpi-sub b{color:var(--c-text-2);font-weight:600}

/* ============ 合并表 · 时间轴 + 风险清单 ============ */
.act-table{
  background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 26px),
    rgba(11,17,22,.62);
  border:1px solid var(--c-hairline);
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)
}
/* 表头 */
.act-head{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(11,17,22,.85);border-bottom:1px solid var(--c-hairline);position:relative}
.act-head::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--c-primary);opacity:.9}
.act-head .hd-title{font:600 12px/1 var(--font-ui);color:var(--c-text);letter-spacing:.6px;display:flex;align-items:center;gap:6px}
.act-head .hd-title::before{content:'[SYS]';color:var(--c-primary);opacity:.7;font:600 10px/1 var(--font-ui);letter-spacing:.6px;padding:2px 5px;border:1px solid rgba(15,247,150,.35);border-radius:2px}
.act-head .hd-title-sub{color:var(--c-text-mute);font-weight:500;font-size:11px;letter-spacing:.3px}
.act-head .hd-title-sub::before{content:'// ';color:var(--c-primary);opacity:.5}
.act-head .hd-legend{margin-left:auto;display:flex;gap:14px;font:500 10px/1 var(--font-ui);color:var(--c-text-mute);letter-spacing:.4px;text-transform:uppercase}
.act-head .hd-legend span{display:inline-flex;align-items:center}
.act-head .hd-legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:middle;border-radius:1px}
.act-head .hd-legend .lg-open{background:var(--c-rec-open)}
.act-head .hd-legend .lg-done{background:var(--c-rec-done)}
.act-head .hd-legend .lg-danger{background:var(--c-rec-danger)}
.act-head .hd-legend .lg-warn{background:transparent;border:1px solid var(--c-brand-yellow)}

/* 分组上标行 */
.act-groups{display:grid;grid-template-columns:var(--col-cat) var(--col-lang) var(--col-role) var(--col-story) var(--col-lines) var(--col-weeks) var(--col-ddl);padding:6px 14px 4px}
.act-groups .g-lane{grid-column:6/7;display:grid;gap:2px}
.act-groups .g-tag{font:600 9px/1 var(--font-ui);letter-spacing:1.4px;text-transform:uppercase;color:var(--g-c);text-align:center;padding:3px 0;border-bottom:2px solid var(--g-c);opacity:.85}
.act-groups .g-tag[data-g="hist"]{--g-c:var(--ph-hist);opacity:.55}
.act-groups .g-tag[data-g="sched"]{--g-c:var(--ph-sched)}
.act-groups .g-tag[data-g="dev"] {--g-c:var(--ph-dev)}
.act-groups .g-tag[data-g="test"]{--g-c:var(--ph-test)}

/* 关键节点标签行 · 紧凑小行（不要大 pill；仅关键锚点） */
.act-labels{display:grid;grid-template-columns:var(--col-cat) var(--col-lang) var(--col-role) var(--col-story) var(--col-lines) var(--col-weeks) var(--col-ddl);padding:8px 14px;background:transparent}
.act-labels .ll-lane{grid-column:6/7;position:relative;height:20px;display:grid;grid-template-columns:repeat(var(--wk-count,13),1fr);border-top:1px dashed rgba(15,247,150,.18);border-bottom:1px dashed rgba(15,247,150,.18);background:rgba(11,17,22,.35)}
.act-labels .ll-lane .ll-tick{border-left:1px solid rgba(255,255,255,.03);height:100%}
/* 通用小 tag：无背景填充、细描边、9px 大写字，紧贴其对应周的中心 */
.act-labels .ll{
  position:absolute;top:50%;transform:translate(-50%,-50%);
  padding:2px 6px;
  font:700 9px/1 var(--font-ui);letter-spacing:.5px;
  color:var(--ll-c);
  background:rgba(11,17,22,.85);
  border:1px solid var(--ll-c);
  border-radius:2px;
  white-space:nowrap;z-index:4;
}
/* 「今」使用 pin/箭头样式：品牌绿实心、深字，指向今日周中央 */
.act-labels .ll[data-kind="today"]{--ll-c:var(--c-primary);background:var(--c-primary);color:#0A1015;border-color:var(--c-primary);padding:2px 7px 2px 6px;clip-path:polygon(50% 100%,100% 60%,100% 0,0 0,0 60%)}

<script>
// ============ MOCK 数据 · 15 位 Talent · 相对偏移基于 MOCK_TODAY ============
// MOCK_TODAY 设为 2026-11-16 (Yang1 DEV W2)，让 timeline 覆盖完整 Vo 需求锁→test w3
const MOCK_TODAY = new Date('2026-11-16T00:00:00');
// Yang1 phases (real from /api/release-plans):
// dev 11-09→12-13, test 12-21→01-17, release 01-18→01-24
const YANG1 = {
  dev:  { start:new Date('2026-11-09'), end:new Date('2026-12-13') },
  test: { start:new Date('2026-12-21'), end:new Date('2027-01-17') },
  rel:  { start:new Date('2027-01-18'), end:new Date('2027-01-24') }
};

// ============ 关键节点 · 与版本节点页 60 天时间轴同源 ============
// 真源：preview-版本节点-精修版.html line 921-929（Vo需求锁 / 声优锁 / 台词锁 / 录制定档期 / VO资源交付）
// 版本节点页含"跳国庆/圣诞整周不计"逻辑；此处 mock 无假期表，若与线上有偏差，可用 OVERRIDE 硬编码线上真值。
// 留空则走 mock 简化算式（未考虑跳假期周）。
const YANG1_MILESTONES_OVERRIDE = {
  voNeedLock:  '',   // 例：'2026-09-21' —— Vo需求锁周一
  vaLock:      '',   // 例：'2026-10-15' —— 声优锁周四
  scriptLock:  '',   // 例：'2026-10-29' —— 台词锁周四
  fixDdl:      '',   // 例：'2026-11-05' —— 定档 DDL（录制定档期最后一天，= scriptLock + 5 工作日）
  voDeliver:   ''    // 例：'2027-01-08' —— VO资源交付周五
};

const MOCK_ROLES = [
  // 已完成 (今日之前的录制)
  { role:'路人-女B',           category:'NPC',      lang:'cn', story:'Yang1 · 城镇环境音·B',    total:8,   status:'booked', dateOffset:-4  },
  { role:'黑鸦Boss',           category:'Boss',     lang:'cn', story:'Yang1 · Boss 战 · 黑鸦',  total:120, status:'booked', dateOffset:-10 },
  { role:'AI-系统提示',        category:'AI系统音', lang:'en', story:'Yang1 · HUD 语音·提示',   total:45,  status:'booked', dateOffset:-18 },
  // 已排待录制 · 深绿
  { role:'医疗兵',             category:'干员',     lang:'cn', story:'Yang1 · 医疗支援',        total:22,  status:'booked', dateOffset:4   },
  { role:'侦查兵',             category:'干员',     lang:'cn', story:'Yang1 · 侦察小队',        total:42,  status:'booked', dateOffset:10  },
  { role:'18维罗妮卡·卡尔多佐', category:'干员',    lang:'cn', story:'Yang1 · 主线新干员777',   total:500, status:'booked', dateOffset:14  },
  { role:'Grunt-步兵',         category:'AI兵',     lang:'en', story:'Yang1 · 敌方兵种·步兵',   total:30,  status:'booked', dateOffset:16  },
  // 已排但落 DEV 最后一周 · 黄警告
  { role:'CC(赛季)',           category:'AI系统音', lang:'cn', story:'Yang1 · 赛季语音包',      total:70,  status:'booked', dateOffset:24  },
  { role:'阿萨拉盾兵',         category:'AI兵',     lang:'cn', story:'Yang1 · 敌方兵种·盾兵',   total:88,  status:'booked', dateOffset:26  },
  { role:'01红狼',             category:'干员',     lang:'en', story:'Yang1 · 主线红狼小队',    total:15,  status:'booked', dateOffset:28  },
  // 未排 · pending
  { role:'Haavk指挥官',        category:'指挥官',   lang:'cn', story:'Yang1 · 主线任务 A',      total:50,  status:'pending' },
  { role:'SOL-GTI指挥官',      category:'指挥官',   lang:'en', story:'Yang1 · 补给线',          total:25,  status:'pending' },
  { role:'AI-战术分析',        category:'AI系统音', lang:'cn', story:'Yang1 · HUD 系统音',      total:88,  status:'pending' },
  { role:'MP-Haavk战术班长',   category:'干员',     lang:'cn', story:'Yang1 · MP 多人对战',     total:14,  status:'pending' },
  { role:'哈夫克哨兵',         category:'AI兵',     lang:'cn', story:'Yang1 · 敌方兵种·哨兵',   total:12,  status:'pending' }
];

// ============ 工具 ============
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtD(d){ if(!d) return '—'; var m=d.getMonth()+1, dd=d.getDate(); return String(m).padStart(2,'0')+'.'+String(dd).padStart(2,'0'); }
function addDays(b,n){ var d=new Date(b); d.setHours(0,0,0,0); d.setDate(d.getDate()+n); return d; }
function isoMonday(d){ var x=new Date(d); x.setHours(0,0,0,0); var day=x.getDay(); x.setDate(x.getDate()-((day+6)%7)); return x; }
// 工作日倒数：从 today 到 target 之间的工作日（周一到周五）计数
function workdaysBetween(from, to){
  var s = new Date(from), e = new Date(to);
  s.setHours(0,0,0,0); e.setHours(0,0,0,0);
  if(s > e) return -workdaysBetween(to, from);
  var n = 0, cur = new Date(s);
  while(cur < e){
    cur.setDate(cur.getDate()+1);
    var d = cur.getDay();
    if(d !== 0 && d !== 6) n++;
  }
  return n;
}
// 从 start 起累加 N 个工作日（跳过周末），返回目标日；与版本节点页 addWorkDaysN 语义一致。
function addWorkDaysN(start, n){
  var cur = new Date(start); cur.setHours(0,0,0,0);
  if(n <= 0) return cur;
  var rem = n;
  while(rem > 0){
    cur.setDate(cur.getDate() + 1);
    var d = cur.getDay();
    if(d !== 0 && d !== 6) rem--;
  }
  return cur;
}

// ============ 主渲染 ============
(function render(){
  var today = new Date(MOCK_TODAY); today.setHours(0,0,0,0);

  // ============ Yang1 里程碑（对齐版本节点页真源规则 · preview-版本节点-精修版.html line 921-929） ============
  // Vo需求锁 = dev.end 向前第 11 个有效周的周一（mock 简化：dev.end - 77 天再取周一）
  // 声优锁   = Vo需求锁 + 3 有效周 · 周四11:30
  // 台词锁   = 声优锁 + 2 有效周 · 周四11:30
  // 录制定档期 = [声优锁, 台词锁 + 5 工作日]
  // 定档 DDL  = 台词锁 + 5 工作日（录制定档期的终点，取自版本节点页 60 天时间轴的『录制定档期』段末日）
  // VO 资源交付 = 开发倒数第二自然周 周五（简化为 test W3 周五）
  function firstMondayBefore(d){ return isoMonday(d); }
  function parseYMD(s){ return s ? new Date(s+'T00:00:00') : null; }
  var voNeedLock = parseYMD(YANG1_MILESTONES_OVERRIDE.voNeedLock) || firstMondayBefore(addDays(YANG1.dev.end, -77));
  var vaLock     = parseYMD(YANG1_MILESTONES_OVERRIDE.vaLock)     || addDays(voNeedLock, 3*7 + 3);
  var scriptLock = parseYMD(YANG1_MILESTONES_OVERRIDE.scriptLock) || addDays(vaLock, 2*7);
  var fixDdl     = parseYMD(YANG1_MILESTONES_OVERRIDE.fixDdl)     || addWorkDaysN(scriptLock, 5);
  var recWinStart = vaLock;
  var recWinEnd   = fixDdl;
  var testW3Mon   = addDays(isoMonday(YANG1.test.start), 2*7);
  var voDeliver   = parseYMD(YANG1_MILESTONES_OVERRIDE.voDeliver) || addDays(testW3Mon, 4);

  // ============ 时间轴窗口 · 声优锁 那周(周一) → 测试第 3 周 那周(周日) ============
  // 起点 = 声优锁那周（录制定档期起点，再前就是"历史周" W-N）
  var winStart = isoMonday(vaLock);
  var winEnd   = addDays(testW3Mon, 6);
  var wkCount  = Math.round((winEnd - winStart) / (7*86400000)) + 1;

  // 相位：录制定档期是嵌在 DEV+TEST 里的，不单独出组；winStart 前 = 'hist'，其余按 dev/test 归位
  function phaseOfMondayWeek(mon){
    if(mon < YANG1.dev.start)   return 'hist';
    if(mon <= YANG1.dev.end)    return 'dev';
    if(mon <= YANG1.test.end)   return 'test';
    return 'hist';
  }
  // 生成 WEEK_META
  var WEEK_META = [];
  for(var i=0;i<wkCount;i++){
    var mon = addDays(winStart, i*7);
    WEEK_META.push({ monday:mon, phase:phaseOfMondayWeek(mon), label:'W'+(i+1) });
  }
  // 给关键周替换更有意义的标签：HIST W-N / DEV D1..Dn / TEST T1..Tn
  var devStartIdx = -1, testStartIdx = -1;
  WEEK_META.forEach(function(w,i){
    if(devStartIdx<0   && w.phase==='dev')   devStartIdx=i;
    if(testStartIdx<0  && w.phase==='test')  testStartIdx=i;
  });
  // 周编号：以 DEV 起始周为 W1，往前 W-N 往后 W+N，全轴统一（不再分 D/T 前缀）
  WEEK_META.forEach(function(w,i){
    if(devStartIdx < 0){ w.label = 'W'+(i+1); return; }
    var n = i - devStartIdx + 1;   // DEV.start = W1
    w.label = n >= 1 ? ('W'+n) : ('W'+(n-1));  // n=0/-1/… → W-1/W-2/…（跳过 W0）
  });

  // 索引定位
  function weekIdxOfDate(dt){
    if(!(dt instanceof Date) || isNaN(dt)) return -1;
    var mon = isoMonday(dt);
    var diff = Math.round((mon - winStart) / (7*86400000));
    if(diff < 0 || diff >= wkCount) return -1;
    return diff;
  }
  function weekIdxOfOffset(offsetDays){ return weekIdxOfDate(addDays(today, offsetDays)); }

  var todayIdx = weekIdxOfDate(today);
  var fixIdx   = weekIdxOfDate(fixDdl);
  var voIdx    = weekIdxOfDate(voDeliver);
  var devLastIdx = -1;
  WEEK_META.forEach(function(w,i){ if(w.phase==='dev' && (devLastIdx<0 || WEEK_META[devLastIdx].monday < w.monday)) devLastIdx = i; });

  // 设置 CSS 变量 wk-count
  document.documentElement.style.setProperty('--wk-count', wkCount);

  // ============ 头部 meta ============
  document.getElementById('metaBar').innerHTML =
    '录制档期需要 <b>'+fmtD(fixDdl)+'</b> 前完成预约确定（定档 DDL · 取自版本节点页「录制定档期」段末日） · '
    +'录制定档期 <b>'+fmtD(recWinStart)+' → '+fmtD(recWinEnd)+'</b> · '
    +'VO 资源交付 '+fmtD(voDeliver)+' · 当前 '+fmtD(today);

  // ============ KPI ============
  var booked = MOCK_ROLES.filter(function(a){return a.status==='booked';}).length;
  var pending = MOCK_ROLES.length - booked;
  var totalLines = MOCK_ROLES.reduce(function(s,a){return s+a.total;},0);
  var pendingLines = MOCK_ROLES.filter(function(a){return a.status!=='booked';}).reduce(function(s,a){return s+a.total;},0);
  var ddlWorkdays = workdaysBetween(today, fixDdl);
  var ddlHot = ddlWorkdays <= 10 ? 1 : 0;
  var ddlValueTxt = ddlWorkdays >= 0 ? ddlWorkdays : Math.abs(ddlWorkdays);
  var ddlUnitTxt  = ddlWorkdays >= 0 ? '工作日' : '工作日逾期';
  var ddlLabelTxt = ddlWorkdays >= 0 ? '距定档 DDL · 工作日' : '已过定档 DDL';
  document.getElementById('kpiRow').innerHTML = ''
    + '<div class="ac-kpi-card" data-tone="total" data-code="TALENT"><div class="ac-kpi-label">Talent 总数 · Yang1.0</div>'
    +   '<div class="ac-kpi-value">'+MOCK_ROLES.length+'<span class="unit">位</span></div>'
    +   '<div class="ac-kpi-sub"><b>'+totalLines+'</b> 句 · '+(new Set(MOCK_ROLES.map(function(a){return a.category;}))).size+' 个大类</div></div>'
    + '<div class="ac-kpi-card" data-tone="booked" data-code="BOOKED"><div class="ac-kpi-label">已排期</div>'
    +   '<div class="ac-kpi-value">'+booked+'<span class="unit">位</span></div>'
    +   '<div class="ac-kpi-sub">覆盖率 <b>'+Math.round(booked/MOCK_ROLES.length*100)+'%</b></div></div>'
    + '<div class="ac-kpi-card" data-tone="pending" data-code="PENDING"><div class="ac-kpi-label">待预约 · 待指派</div>'
    +   '<div class="ac-kpi-value">'+pending+'<span class="unit">位</span></div>'
    +   '<div class="ac-kpi-sub"><b>'+pendingLines+'</b> 句待录</div></div>'
    + '<div class="ac-kpi-card" data-tone="ddl" data-hot="'+ddlHot+'" data-code="DDL"><div class="ac-kpi-label">'+ddlLabelTxt+'</div>'
    +   '<div class="ac-kpi-value">'+ddlValueTxt+'<span class="unit">'+ddlUnitTxt+'</span></div>'
    +   '<div class="ac-kpi-sub">录制定档需在 <b>'+fmtD(fixDdl)+'</b> 前完成预约</div></div>';

  // ============ 分组上标（录制定档期嵌在 DEV+TEST 里，不单独出组） ============
  var histCount  = (devStartIdx>=0) ? devStartIdx : 0;
  var devCount   = (devStartIdx>=0 && testStartIdx>=0) ? (testStartIdx - devStartIdx) : (devStartIdx>=0 ? wkCount-devStartIdx : 0);
  var testCount  = (testStartIdx>=0) ? (wkCount - testStartIdx) : 0;
  document.getElementById('groupsRow').innerHTML =
    '<div class="g-lane" style="grid-template-columns:'+histCount+'fr '+devCount+'fr '+testCount+'fr">'
    + (histCount>0 ? '<div class="g-tag" data-g="hist">HIST</div>' : '')
    + '<div class="g-tag" data-g="dev">DEV · 开发期</div>'
    + '<div class="g-tag" data-g="test">TEST · 转测期</div>'
    + '</div>';

  // ============ 关键节点标签行 · 紧凑小 tag（今 · 声优锁 · 台词锁） ============
  function llLeftPct(idx){ return ((idx + 0.5) / wkCount * 100); }
  var vaIdx = weekIdxOfDate(vaLock);
  var scIdx = weekIdxOfDate(scriptLock);
  var labelsHtml = '<div class="ll-lane">';
  for(var i=0;i<wkCount;i++) labelsHtml += '<div class="ll-tick"></div>';
  if(todayIdx >= 0) labelsHtml += '<span class="ll" data-kind="today" style="left:'+llLeftPct(todayIdx)+'%" title="今日 · '+fmtD(today)+'">今</span>';
  if(scIdx    >= 0) labelsHtml += '<span class="ll" data-kind="sc"    style="left:'+llLeftPct(scIdx)+'%"    title="台词锁 · '+fmtD(scriptLock)+'">台词锁</span>';
  if(voIdx    >= 0) labelsHtml += '<span class="ll" data-kind="vo"    style="left:'+llLeftPct(voIdx)+'%"    title="VO 资源交付 · '+fmtD(voDeliver)+'">VO 交付</span>';
  labelsHtml += '</div>';
  document.getElementById('labelsRow').innerHTML = labelsHtml;

  // ============ 列名行 ============
  var wkHtml = WEEK_META.map(function(w,i){
    var cls = ['wk'];
    if(i === todayIdx) cls.push('today');
    if(i === scIdx)    cls.push('fix');
    if(i === voIdx)    cls.push('vo');
    return '<div class="'+cls.join(' ')+'" data-phase="'+w.phase+'" title="'+w.label+' · '+fmtD(w.monday)+'">'+w.label+'</div>';
  }).join('');
  document.getElementById('colsRow').innerHTML = ''
    + '<div>CAT</div>'
    + '<div>LANG</div>'
    + '<div>LVL · ROLE</div>'
    + '<div>STORY</div>'
    + '<div style="text-align:right">LINES</div>'
    + '<div class="col-weeks">'+wkHtml+'</div>'
    + '<div class="col-ddl">STATUS</div>';

  // ============ 数据行 ============
  // 三角洲行动 Logo · 内联 SVG（三角+闪电切角），fill 用 currentColor 继承状态色 —— 无外部资源依赖
  // 三角洲行动 官方 Logo（仅图标）· 走 CSS mask 引用 assets/DeltaForceLogo-IconOnly.png · 形状=官方真源
  var DF_MARK = '<span class="df-mark" aria-hidden="true"></span>';
  var riskIcon = { danger:'!', open:DF_MARK, done:'✓' };

  function riskOf(a){
    if(a.status === 'booked'){
      var bd = addDays(today, a.dateOffset);
      if(bd < today) return 'done';
      return 'open';
    }
    return 'danger';
  }
  function recTypeOf(a){
    if(a.status !== 'booked') return null;
    var bd = addDays(today, a.dateOffset);
    if(bd < today) return 'done';
    if(devLastIdx >= 0 && weekIdxOfDate(bd) === devLastIdx) return 'danger';
    return 'open';
  }

  function weekCellsHtml(a){
    var cells = WEEK_META.map(function(w,i){
      var cls = ['wcell'];
      if(i === todayIdx) cls.push('today');
      if(i === scIdx)    cls.push('fix');
      if(i === voIdx)    cls.push('vo-mark');
      return '<div class="'+cls.join(' ')+'" data-phase="'+w.phase+'"></div>';
    }).join('');
    var overlay = '';
    if(a.status === 'booked'){
      var idx = weekIdxOfOffset(a.dateOffset);
      if(idx >= 0){
        var rec = recTypeOf(a);
        var bd = addDays(today, a.dateOffset);
        var left = idx/wkCount*100, width = 1/wkCount*100;
        overlay += '<div class="booked-mark" data-rec="'+rec+'" style="left:'+left+'%;width:calc('+width+'% - 6px);margin-left:3px" title="'+esc(fmtD(bd))+'">'+DF_MARK+'</div>';
      }
    }
    return '<div class="ar-weeks">'+cells+overlay+'</div>';
  }

  function statusHtml(a){
    if(a.status !== 'booked'){
      // 未安排 → Pending 徽章占前缀位，值位留空占位保持列内两栏对齐
      return '<span class="st-pref">Pending</span><span class="st-val"></span>';
    }
    var bd = addDays(today, a.dateOffset);
    // 已完成（录制日期在今日之前）→ DONE 徽章
    if(bd < today){
      return '<span class="st-pref">DONE</span><span class="st-val"></span>';
    }
    return '<span class="st-pref">REC</span><span class="st-val">'+fmtD(bd)+'</span>';
  }

  function rowHtml(a){
    var r = riskOf(a);
    var langTxt = a.lang === 'en' ? '英配' : '中配';
    return '<div class="act-row" data-risk="'+r+'">'
      + '<div class="ar-cat">'+esc(a.category)+'</div>'
      + '<div class="ar-lang" data-lang="'+(a.lang||'cn')+'">'+langTxt+'</div>'
      + '<div class="ar-role" title="'+esc(a.role)+'"><span class="ar-lvl">'+riskIcon[r]+'</span><span class="ar-role-text">'+esc(a.role)+'</span></div>'
      + '<div class="ar-story" title="'+esc(a.story)+'">'+esc(a.story)+'</div>'
      + '<div class="ar-lines">'+a.total+'</div>'
      + weekCellsHtml(a)
      + '<div class="ar-ddl" data-status="'+r+'">'+statusHtml(a)+'</div>'
      + '</div>';
  }

  // 排序：danger → open → done；同级句数倒序
  var riskOrder = { danger:0, open:1, done:2 };
  var sorted = MOCK_ROLES.slice().sort(function(a,b){
    var ra = riskOrder[riskOf(a)], rb = riskOrder[riskOf(b)];
    if(ra !== rb) return ra - rb;
    // 同组内的排序策略：
    //  - danger（Pending 未安排）：按句数倒序（大句数排前）
    //  - open（REC 待录制）：按录制日期升序（最近的排前，最远排后）
    //  - done（DONE 已完成）：按录制日期降序（最近完成的排前）
    var risk = riskOf(a);
    if(risk === 'open')  return a.dateOffset - b.dateOffset;   // 未来越近越靠前
    if(risk === 'done')  return b.dateOffset - a.dateOffset;   // 过去越近越靠前（负值大者近）
    return b.total - a.total;
  });
  document.getElementById('tableBody').innerHTML = sorted.map(rowHtml).join('');
})();
</script>
</body>
</html>
